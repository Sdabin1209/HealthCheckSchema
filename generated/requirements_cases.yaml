# 요구사항 참고 자료. 컴포넌트를 실행하거나 정답을 판정하지 않는다.
문항정의:
  버전: 1
  문항:
    Q1:
      이름: 흡연
      순서: 1
      선행조건: null
      정책:
        질문상한: 3
        모름수용시점: 1
        거절수용시점: 1
      슬롯:
        상태:
          선택지:
          - 현재 피움
          - 끊음
          - 안 피움
          필수: true
          되묻기문장: 현재 피우시는지, 끊으셨는지, 안 피우시는지 말씀해 주세요.
      영향받는후속문항:
      - Q2
      문항문장: 담배는 피우시나요?
      거절시설명: 흡연 여부는 폐 건강을 보는 데 꼭 필요해서 여쭙습니다.
      안내문장:
        설명: 지금 피우시는지, 끊으셨는지, 원래 안 피우시는지를 여쭙는 것입니다.
        목적: 흡연은 여러 질환의 위험을 높여 진료 전에 확인합니다.
    Q2:
      이름: 흡연량
      순서: 2
      선행조건:
        슬롯: Q1.상태
        값: 현재 피움
      정책:
        질문상한: 3
        모름수용시점: 1
        거절수용시점: 2
      슬롯:
        개비:
          단위:
          - 이름: 개비
            다른이름:
            - 개
            범위:
            - 0
            - 80
          - 이름: 갑
            환산:
              단위: 개비
              배수: 20
          필수: true
          되묻기문장: 하루에 몇 개비인지 말씀해 주세요.
      문항문장: 하루에 몇 개비나 피우세요?
      거절시설명: 흡연량에 따라 권해 드리는 것이 달라져서 여쭙습니다.
      안내문장:
        설명: 하루에 피우시는 담배 개비 수입니다. 갑으로 말씀하셔도 됩니다.
        목적: 양에 따라 금연 상담 기준이 달라 확인합니다.
    Q3a:
      이름: 음주 여부
      순서: 3
      선행조건: null
      정책:
        질문상한: 3
        모름수용시점: 1
        거절수용시점: 1
      슬롯:
        여부:
          선택지:
          - 마심
          - 안 마심
          네아니요대응:
            네: 마심
            아니요: 안 마심
          필수: true
          되묻기문장: 술을 드시는지 아닌지 말씀해 주세요.
      영향받는후속문항:
      - Q3b
      - Q4
      문항문장: 술은 드시나요?
      거절시설명: 음주 여부는 간 기능과 약 처방에 영향이 있어 여쭙습니다.
      안내문장:
        설명: 최근에도 술을 드시는지 여쭙는 것입니다.
        목적: 음주는 간 수치와 약 선택에 영향이 있어 확인합니다.
    Q3b:
      이름: 음주 상세
      순서: 4
      선행조건:
        슬롯: Q3a.여부
        값: 마심
      정책:
        질문상한: 3
        모름수용시점: 1
        거절수용시점: 1
      슬롯:
        빈도:
          단위:
          - 이름: 주 n회
            다른이름:
            - 일주일
            - 주일
            범위:
            - 0
            - 21
          - 이름: 월 n회
            다른이름:
            - 한 달
            - 달
            범위:
            - 0
            - 93
          필수: true
          되묻기문장: 일주일이나 한 달에 몇 번 드시는지 말씀해 주세요.
        종류:
          선택지:
          - 소주
          - 맥주
          - 막걸리
          - 와인
          - 기타
          필수: true
          되묻기문장: 어떤 술을 주로 드시는지 말씀해 주세요.
        1회양:
          단위:
          - 이름: 잔
            범위:
            - 0
            - 50
          - 이름: 병
            범위:
            - 0
            - 10
          필수: true
          되묻기문장: 한 번에 얼마나 드시는지 말씀해 주세요.
      문항문장: 얼마나 자주, 어떤 술을 한 번에 얼마나 드세요?
      거절시설명: 음주량은 간 건강을 보는 기준이라 여쭙습니다.
      안내문장:
        설명: 마시는 횟수와 종류, 한 번에 드시는 양을 여쭙는 것입니다.
        목적: 주당 음주량으로 위험 음주 여부를 봅니다.
    Q3c:
      이름: 주종별 음주량
      순서: 10
      선행조건:
        슬롯: Q3a.여부
        값: 마심
      정책:
        질문상한: 3
        모름수용시점: 1
        거절수용시점: 1
      반복키:
      - 소주
      - 맥주
      - 막걸리
      - 와인
      - 기타
      슬롯:
        양:
          단위:
          - 이름: 잔
            범위:
            - 0
            - 50
          - 이름: 병
            범위:
            - 0
            - 10
          필수: false
          되묻기문장: 그 술을 한 번에 얼마나 드시는지 말씀해 주세요.
      문항문장: 드시는 술 종류별로 한 번에 얼마나 드세요?
      거절시설명: 술 종류마다 알코올 양이 달라 따로 여쭙습니다.
      안내문장:
        설명: 드시는 술마다 한 번에 드시는 양을 따로 여쭙는 것입니다.
        목적: 종류별 양을 합쳐 주당 알코올 섭취량을 봅니다.
    Q4:
      이름: 폭음
      순서: 5
      선행조건:
        슬롯: Q3a.여부
        값: 마심
      정책:
        질문상한: 3
        모름수용시점: 1
        거절수용시점: 1
      슬롯:
        여부:
          선택지:
          - 예
          - 아니요
          네아니요대응:
            네: 예
            아니요: 아니요
          필수: true
          되묻기문장: 그런 일이 있으신지 아닌지 말씀해 주세요.
      문항문장: 한 번에 소주 한 병 넘게 드시는 일이 있나요?
      거절시설명: 폭음은 따로 보는 항목이라 여쭙습니다.
      안내문장:
        설명: 한 자리에서 소주 한 병이 넘게 드시는 일이 있는지 여쭙는 것입니다.
        목적: 폭음은 전체 음주량과 따로 위험을 봅니다.
    Q5:
      이름: 수면
      순서: 6
      선행조건: null
      정책:
        질문상한: 3
        모름수용시점: 1
        거절수용시점: 1
      슬롯:
        시간:
          단위:
          - 이름: 시간
            범위:
            - 0
            - 24
          필수: true
          되묻기문장: 하루에 몇 시간 주무시는지 말씀해 주세요.
      문항문장: 하루에 몇 시간 주무세요?
      거절시설명: 수면 시간은 피로와 혈압에 관련이 있어 여쭙습니다.
      안내문장:
        설명: 보통 하루에 주무시는 시간입니다.
        목적: 수면 부족은 혈압과 피로에 영향이 있어 확인합니다.
    Q6:
      이름: 죽고 싶은 생각
      순서: 7
      선행조건: null
      정책:
        질문상한: 3
        모름수용시점: 1
        거절수용시점: 2
      슬롯:
        여부:
          선택지:
          - 예
          - 아니요
          네아니요대응:
            네: 예
            아니요: 아니요
          필수: true
          위험기준:
            연산: '='
            기준값: 예
            대응: IMMEDIATE
          되묻기문장: 그런 생각이 드신 적이 있는지 말씀해 주세요.
      문항문장: 최근에 죽고 싶다는 생각을 하신 적이 있나요?
      거절시설명: 답하기 어려우시면 넘어가셔도 됩니다. 도움을 드릴 수 있어 여쭙습니다.
      안내문장:
        설명: 최근 그런 생각이 드신 적이 있는지 여쭙는 것입니다.
        목적: 그런 생각이 드시면 바로 도움을 드리려고 확인합니다.
    Q7:
      이름: 혈압
      순서: 8
      선행조건: null
      정책:
        질문상한: 3
        모름수용시점: 2
        거절수용시점: 1
      슬롯:
        수축기:
          단위:
          - 이름: mmHg
            범위:
            - 50
            - 260
          필수: true
          위험기준:
            연산: '>='
            기준값: 180 mmHg
            대응: ON_RESULT
          되묻기문장: 혈압의 위 숫자를 말씀해 주세요.
        이완기:
          단위:
          - 이름: mmHg
            범위:
            - 30
            - 160
          필수: true
          위험기준:
            연산: '>='
            기준값: 110 mmHg
            대응: ON_RESULT
          되묻기문장: 혈압의 아래 숫자를 말씀해 주세요.
      문항문장: 최근에 재신 혈압이 어떻게 되세요?
      거절시설명: 혈압은 오늘 진료에 바로 쓰여서 여쭙습니다.
      안내문장:
        설명: 최근에 재신 혈압의 위 숫자와 아래 숫자입니다.
        목적: 혈압이 높으면 진료 순서를 조정합니다.
    Q8:
      이름: 운동
      순서: 9
      선행조건: null
      정책:
        질문상한: 3
        모름수용시점: 1
        거절수용시점: 1
      슬롯:
        횟수:
          단위:
          - 이름: 주 n회
            범위:
            - 0
            - 21
          필수: false
          되묻기문장: 일주일에 몇 번 하시는지 말씀해 주세요.
      문항문장: 일주일에 몇 번이나 운동하세요?
      거절시설명: 운동 습관은 생활 습관 상담에 쓰여 여쭙습니다.
      안내문장:
        설명: 일주일에 숨이 찰 정도로 움직이시는 횟수입니다.
        목적: 운동량은 생활 습관 상담의 기준이 됩니다.
  세션설정:
    위험표현목록:
    - 숨이 안
    - 가슴이 너무 아파
    - 쓰러질 것 같
    - 죽고 싶
    확인상한: 2
    알아듣지못한연속상한: 2
    물음상한: 3
    안내목록:
    - 안내항목ID: 설명
      고르는기준: 질문에 나온 말의 뜻을 물음
      문항별: true
    - 안내항목ID: 목적
      고르는기준: 이 질문을 왜 하는지 물음
      문항별: true
    - 안내항목ID: 진행
      고르는기준: 얼마나 남았는지 물음
      문항별: false
      채울값: REMAINING_COUNT
      문장: 앞으로 {남은 문항 수}개 더 여쭤보면 끝납니다.
    - 안내항목ID: 개인정보
      고르는기준: 답을 누가 보는지, 어디에 쓰는지 물음
      문항별: false
      문장: 말씀해 주신 내용은 오늘 진료를 보는 의료진만 봅니다.
    - 안내항목ID: 의료판단
      고르는기준: 자기 답이 건강상 괜찮은지 판단을 물음
      문항별: false
      문장: 제가 판단을 드리기는 어렵고, 진료 때 의료진이 봐 드립니다.
    고정문장:
      ASK_REPEAT: 잘 못 들었습니다. 다시 한번 말씀해 주세요.
      OOS_NOTICE: 그건 제가 도와드리기 어렵습니다.
      CALL_STAFF: 직원을 불러 드리겠습니다. 잠시만 기다려 주세요.
      FAREWELL: 문진이 끝났습니다. 수고하셨습니다.
      ASK_CONFIRM: 어느 쪽이 맞는지 말씀해 주세요.
      ASK_CORRECTION_TARGET: 어떤 것을 고쳐 드릴까요?
      ASK_FINISH: 다 여쭤봤습니다. 이대로 마칠까요?
      RISK_NOTICE: 바로 직원을 불렀습니다. 그 자리에 계셔 주세요.
      RESUME: 다시 이어서 여쭙겠습니다.
      SURVEY_STOPPED: 문진을 여기서 마치겠습니다.
      WAIT_NOTICE: 네, 천천히 하세요.
      ASK_STOP: 문진을 그만두시겠어요?
      STAFF_NOTICE: 직원을 불러 드렸습니다. 문진은 이어서 하겠습니다.
      DEFERRED: 그건 나중에 다시 여쭙겠습니다.
상황목록:
- id: A1
  상황: 시작
  예: 키오스크 앞에서 시작
  결과: 첫 질문을 듣는다
  왜: 문진은 키오스크 앞에서 말 없이 시작될 수 있다. 시작 신호만으로 첫 질문을 할 수 있어야 한다.
- id: A2
  상황: 첫 입력이 말
  예: 시작 신호 없이 바로 "담배 안 피워요"
  결과: 세션이 만들어지고 그 말이 답으로 처리된다
  왜: 사용자는 시작 버튼 없이 바로 답부터 말할 수 있다. 그 말을 버리면 다시 말하게 해야 한다.
- id: A3
  상황: 다시 접속
  예: 연결이 끊겼다가 다시 접속
  결과: 하던 곳부터 다시 묻는다
  왜: 연결이 끊겼다 다시 붙는 일은 키오스크에서 흔하다. 처음부터 다시 물으면 이미 한 답을 또 말해야 한다.
- id: A4
  상황: 떠남
  예: 프론트가 사용자가 떠났다고 판단(대기 중이었어도 같음)
  결과: 받은 데까지 미완료로 결과가 넘어간다
  왜: 사용자는 말없이 떠날 수 있다. 그때까지 받은 답이 넘어가지 않으면 버려진다.
- id: A5
  상황: 끝난 세션에 말이 들어옴
  예: 종료 뒤 다음 사람이 말함
  결과: 아무 처리도 기록도 하지 않는다
  왜: 끝난 키오스크 앞에서 다음 사람이 말할 수 있다. 이 말이 앞사람의 결과에 섞이면 안 된다.
- id: A6
  상황: 마친 직후 같은 사람이 고치려 함
  예: 마침 인사 직후 "아 잠깐, 아까 거 틀렸어요"
  결과: A5와 같다. 이미 넘긴 결과는 바꾸지 않는다(그래서 마치기 전에 한 번 묻는다, H1)
  왜: 마친 직후 고치려는 사람이 있지만, 이미 넘긴 결과를 바꾸면 받는 쪽 기록과 어긋난다. 그래서 마치기 전에 한 번 묻는다.
- id: B1
  상황: 묻는 것에 답함
  예: '"일주일에 두 번, 소주 한 병씩요"'
  결과: 저장하고 다음 질문
  왜: 문진의 기본 경로다.
- id: B2
  상황: 일부만 답함
  예: '"소주 마셔요"'
  결과: 저장하고 빠진 것만 되묻는다
  왜: 사람은 여러 칸 중 일부만 답하곤 한다. 받은 것은 저장하고 빠진 것만 물어야 한다.
- id: B3
  상황: 애매하게 답함
  예: '"두 번이요"(단위 없음), "서른 시간"(범위 밖), "두세 병"(모호)'
  결과: 말한 값을 짚어 구체적으로 묻는다
  왜: 단위 없이, 범위를 벗어나게, 범위 값으로 답하는 일이 흔하다. 그대로 저장하면 틀린 값이 남는다.
- id: B4
  상황: 서로 안 맞는 답
  예: '"술 안 마셔요, 소주 두 병 정도?"'
  결과: 두 값을 짚어 묻는다
  왜: 앞뒤가 맞지 않는 답을 둘 다 저장하면 결과가 모순된다.
- id: B5
  상황: 앞 질문의 짧은 답
  예: 구체화 요청 뒤 "일주일에요"
  결과: 앞서 말한 값과 합쳐 저장
  왜: 되물은 뒤의 짧은 답("일주일에요")은 앞서 한 말과 합쳐야 뜻이 된다.
- id: B6
  상황: 묻지 않은 문항까지 답함
  예: '"일곱 시간 자고, 운동은 주 세 번"'
  결과: 둘 다 저장하고 이미 답한 문항은 묻지 않는다
  왜: 사람은 묻지 않은 것까지 한꺼번에 말한다. 버리면 나중에 또 물어야 한다.
- id: B7
  상황: 모름
  예: '"혈압은 잘 모르겠어요"'
  결과: 모름으로 기록하고 정책대로 다시 묻거나 넘어간다
  왜: 모른다는 답은 흔하고 빈 답과 다르게 다뤄야 한다.
- id: B8
  상황: 거절
  예: '"그건 말 안 할래요"'
  결과: 거절로 기록하고 정책대로 설명하거나 넘어간다
  왜: 민감한 문항은 답을 거절할 수 있다.
- id: B9
  상황: 예/아니요 질문에 "네"
  예: 폭음 질문에 "네"
  결과: 그 문항의 답(예)으로 저장
  왜: 예/아니요 질문의 "네"는 확인이 아니라 답이다. 구분하지 못하면 답이 저장되지 않는다.
- id: B10
  상황: 같은 문항에 계속 쓸 수 있는 답이 안 나옴
  예: '"두세 병?" → "글쎄, 두세 병" → "한 두세 병…"'
  결과: 정해진 횟수 뒤 그 문항을 건너뛰고, 결과에 건너뛴 사유가 남는다. 모름·거절·애매한 답이 계속될 때도 무한 재질문을 피하도록 문항별 횟수 기준을 사용한다.
  왜: 계속 쓸 수 있는 답이 안 나오면 끝없이 묻게 된다.
- id: C1
  상황: 분명히 고침
  예: '"아까 열 개 아니고 스무 개요"'
  결과: 고치고 "바꿨습니다"를 알린다. 고치기 전 값은 이력으로 결과에 함께 넘어간다.
  왜: 사람은 앞서 한 답을 고친다.
- id: C2
  상황: 고친 답 때문에 뒤 문항이 무효
  예: '"저 사실 술 안 마셔요"(폭음 답이 있었음)'
  결과: 뒤 문항 답을 지우고 필요하면 다시 묻는다
  왜: 선행 답을 고치면 그에 딸린 후속 답이 모순이 된다(술을 안 마시는데 음주량이 남음).
- id: C3
  상황: 앞 답과 다른 말(고친다는 말 없음)
  예: 열 개라 했는데 "스무 개 피워요"
  결과: 어느 쪽이 맞는지 묻는다
  왜: 표지 없이 다른 값을 말하면 잘못 들었을 수도 있다.
- id: C4
  상황: 그 확인에 답함
  예: '"네" / "아니요, 열 개 맞아요"'
  결과: 새 값으로 바꾸고 알리거나, 기존 값을 유지한다고 알린다
  왜: 확인을 물었으면 그 답으로 어느 값을 남길지 정해야 한다.
- id: C5
  상황: 고친다는데 무엇인지 모름
  예: '"아까 그거 틀렸어요"'
  결과: 무엇을 고칠지 묻는다
  왜: '"아까 그거 틀렸어요"처럼 무엇을 고칠지 말하지 않는 경우가 있다. 버리면 고치려는 뜻이 사라진다.'
- id: C6
  상황: 고친다는데 값이 없음
  예: '"담배 답 고칠게요"'
  결과: 어떤 값으로 고칠지 묻는다(예/아니요 문항이면 "네"·"아니요"가 그 값)
  왜: 고치겠다고만 하고 값을 말하지 않는 경우가 있다. 값을 물어야 고칠 수 있다.
- id: C7
  상황: 앞 질문으로 돌아가기
  예: '"아까 술 질문 다시 해 주세요"'
  결과: 문항이 분명하면 C6처럼 그 문항의 값을 묻고, "아까 그거"처럼 분명하지 않으면 C5처럼 무엇인지 묻는다
  왜: '"앞 질문 다시 해 주세요"는 사실상 그 답을 고치려는 말이다.'
- id: C8
  상황: 확인에 계속 답을 안 줌
  예: '"열 개예요, 스무 개예요?" → "그때그때 달라요" → "둘 다 비슷해요" (모른다고 하면 B7)'
  결과: 정해진 횟수 뒤 더 묻지 않고 기존 답 유지를 알린다. 서로 다른 두 답은 결과에 "풀리지 않은 답"으로 넘어가고, 문진은 마칠 수 있다
  왜: 확인에 계속 답하지 않으면 끝없이 묻게 된다. 풀리지 않은 답은 결과에 남겨 의료진이 본다.
- id: C9
  상황: 고치려다 그만둠
  예: C5·C6 뒤 "아니요, 그냥 둘게요"
  결과: 고치지 않는다. 고치려던 문항이 있으면 기존 답 유지를 듣고 하던 질문으로 간다
  왜: 고치려다 마음을 바꾸는 경우가 있다. 고치지 않고 하던 질문으로 돌아가야 한다.
- id: D1
  상황: 다시 말해 달라
  예: '"네? 뭐라고요?"'
  결과: 방금 한 말을 다시 듣는다
  왜: 음성 대화에서 못 들었다는 말은 흔하다. 같은 말을 다시 들려줘야 한다.
- id: D2
  상황: 기다려 달라
  예: '"잠깐만요, 수첩 좀 찾고요"'
  결과: 기다리겠다고 하고 재촉하지 않는다
  왜: 수첩을 찾는 등 잠깐 기다려 달라는 사람에게 재촉하면 안 된다.
- id: D3
  상황: 나중에
  예: '"이건 이따 할게요"'
  결과: 다음 질문으로 가고 그 문항은 나중에 묻는다
  왜: 어떤 문항은 나중에 답하고 싶어 한다. 버리지 않고 마지막에 다시 물어야 한다.
- id: D4
  상황: 그만하겠다
  예: '"그만할래요"'
  결과: 정말 그만할지 묻는다
  왜: 그만하겠다는 사람이 있다. 잘못 들었을 수 있어 확인한다.
- id: D5
  상황: 그만하기 확인에 답함
  예: '"네" / "아니요"'
  결과: '네: 미완료로 끝나고 결과가 넘어간다. 아니요: 하던 질문으로'
  왜: 그만하기 확인의 답에 따라 미완료로 끝내거나 이어 가야 한다.
- id: E1
  상황: 질문의 뜻·이유를 물음
  예: '"폭음이 뭐예요?", "이건 왜 물어요?"'
  결과: 정해진 설명을 듣고 그 질문을 다시 듣는다
  왜: 질문의 뜻이나 이유를 묻는 사람에게 검토된 설명을 해야 답할 수 있다.
- id: E2
  상황: 진행 상황을 물음
  예: '"얼마나 남았어요?"'
  결과: 남은 문항 수를 듣는다
  왜: 얼마나 남았는지 묻는 사람에게 실제 남은 수를 알려야 한다.
- id: E3
  상황: 개인정보·의료 판단을 물음
  예: '"이거 누가 봐요?", "두 병이면 많은 거예요?"'
  결과: 정해진 안내를 듣는다. 답이 함께 있으면 저장된다
  왜: 개인정보·의료 판단 질문에는 검토된 문장으로만 답해야 한다. 함께 한 답은 저장돼야 한다.
- id: E4
  상황: 목록에 없는 질문
  예: '"화장실 어디예요?"'
  결과: 그건 도와드리기 어렵다는 말을 듣고 하던 질문을 다시 듣는다
  왜: 목록에 없는 질문(화장실 위치)에 답을 지어내면 안 된다.
- id: F1
  상황: 직원을 찾음
  예: '"직원 좀 불러 주세요"'
  결과: 직원을 불렀다고 듣고, 직원은 그 말과 함께 알림을 받는다. 문진은 계속된다
  왜: 직원을 찾는 사람에게 직원이 와야 한다.
- id: F2
  상황: 시스템이 할 수 없는 요청
  예: '"처음부터 다시 할래요", 보호자가 대신 답함'
  결과: F1과 같다
  왜: 처음부터 다시 하기, 보호자 대리 답변처럼 시스템이 할 수 없는 일은 사람에게 넘겨야 한다.
- id: F3
  상황: 계속 못 알아들음
  예: 알아듣지 못한 말이 이어짐
  결과: 직원을 부른다
  왜: 계속 못 알아들으면 시스템이 더 할 수 있는 일이 없어 사람이 와야 한다.
- id: F4
  상황: 직원이 문진을 끝냄
  예: 직원이 종료를 보냄
  결과: 미완료로 끝나고 결과가 넘어간다
  왜: 직원이 문진을 끝낼 수 있어야 한다.
- id: G1
  상황: 지금 위급하다는 말
  예: '"숨이 안 쉬어져요"'
  결과: 문진이 멈추고 안내를 듣고, 직원이 그 말과 함께 알림을 받는다
  왜: 위급한 말에는 문진보다 먼저 멈추고 사람을 불러야 한다.
- id: G2
  상황: 모델이 놓친 위급한 말
  예: '"아이고 가슴이 너무 아파서…"'
  결과: G1과 같다
  왜: 모델이 위급한 말을 놓칠 수 있으므로 한 번 더 거르는 장치가 필요하다.
- id: G3
  상황: 답 자체가 즉시 위험
  예: 죽고 싶다는 생각이 "예"
  결과: 답은 저장되고 G1과 같이 멈춘다
  왜: 답 자체가 즉시 위험한 문항(죽고 싶은 생각)이 있다.
- id: G4
  상황: 답이 위험하지만 바로 멈출 정도는 아님
  예: 혈압 190/110
  결과: 계속하고 결과에 표시된다
  왜: 위험하지만 바로 멈출 정도는 아닌 답은 결과에 표시해 의료진이 본다.
- id: G5
  상황: 멈춘 동안 사용자가 말함
  예: '"언제 와요?"'
  결과: 처리하지 않는다(기록만)
  왜: 멈춘 동안의 말을 처리하면 위급 상황에서 문진이 이어진다.
- id: G6
  상황: 의료진이 이어 가게 함
  예: 재개
  결과: 멈춘 곳부터 다시 묻는다. 같은 답으로 다시 멈추지 않는다
  왜: 위험이 지나가면 멈춘 곳부터 이어 가야 하고, 같은 답으로 다시 멈추면 안 된다.
- id: G7
  상황: 의료진이 끝냄
  예: 종료
  결과: 미완료로 끝나고 결과가 넘어간다(멈춘 이력 포함)
  왜: 의료진이 문진을 끝내면 받은 데까지 결과가 넘어가야 한다.
- id: G8
  상황: 위급한 말과 다른 요청이 함께
  예: '"잠깐만요, 숨이 안 쉬어져요", "네 그만할게요… 가슴이 아파요"'
  결과: 위험 대응이 먼저. 끝내지 않고 멈춘다
  왜: 위급한 말이 다른 요청과 함께 오면 위험이 먼저다.
- id: G9
  상황: 과거 증상이 위험 표현에 걸림
  예: '"예전에 숨이 안 쉬어진 적 있어요"'
  결과: G1과 같이 멈추고 직원이 확인한 뒤 재개한다. 놓치는 쪽이 더 위험해서 걸러 내지 않는다. 걸리는 범위는 의료진이 정하는 위험 표현 목록에 달려 있다
  왜: 과거 증상도 위험 표현에 걸릴 수 있다. 놓치는 쪽이 더 위험하므로 거르지 않는다.
- id: H1
  상황: 다 답함
  예: 남은 질문·확인이 없음
  결과: 마칠지 묻는다
  왜: 다 답했으면 마치기 전에 한 번 묻는다. 마친 뒤에는 고칠 수 없다(A6).
- id: H2
  상황: 마치겠다고 함
  예: '"네"'
  결과: 마침 인사를 듣고 결과가 넘어간다
  왜: 마치겠다고 하면 결과를 넘기고 끝낸다.
- id: H3
  상황: 마치기 전에 고침
  예: '"아 잠깐, 잠은 여섯 시간이에요", "네, 근데 운동은 두 번"'
  결과: 고친 뒤 남은 것이 없으면 다시 마칠지 묻는다
  왜: 마치기 직전에 고치는 사람이 있다. 고친 것을 반영하고 다시 물어야 한다.
- id: I1
  상황: 알아들을 수 없는 말·빈 말
  예: STT가 잘못 옮긴 글자, 소리는 났는데 글자가 없음
  결과: 다시 말해 달라고 한다. 이어지면 F3
  왜: STT가 잘못 옮기거나 소리만 들린 경우 다시 말해 달라고 해야 한다.
- id: K1
  상황: 인사·감사
  예: '"고마워요", "안녕하세요"'
  결과: 짧게 받고 질문을 잇는다
  왜: 인사·감사에는 짧게 받고 질문을 이어 가야 대화가 자연스럽다.
- id: K2
  상황: 사과·사정
  예: '"죄송해요, 제가 귀가 어두워서"'
  결과: '"괜찮습니다, 천천히 말씀하세요" 식으로 받고 잇는다'
  왜: 사과·사정에는 괜찮다고 받아 줘야 어르신이 편하게 답한다.
- id: K3
  상황: 맞장구·혼잣말
  예: '"아, 그렇구나", "어디 보자…" (예/아니요 질문에 "네"는 B9)'
  결과: 질문을 잇는다
  왜: 맞장구·혼잣말은 답이 아니므로 질문을 이어 간다.
- id: K4
  상황: 답에 붙인 사연
  예: '"담배는 끊었어요, 작년에 수술해서"'
  결과: 답은 저장되고, 사연을 받아 준 뒤 다음 질문
  왜: 답에 사연을 붙여도 답은 저장되고, 사연은 저장된 값처럼 말하지 않아야 한다.
- id: K5
  상황: 감정 표현(위험 표현이 아님)
  예: '"요즘 너무 힘들어요"'
  결과: 공감하는 말로 받고 잇는다. 위험 표현이면 G1
  왜: 힘들다는 말에는 공감하되 상담·진단을 하지 않는다. 위험 표현이면 G1이다.
- id: K6
  상황: 옆 사람에게 한 말
  예: '"엄마, 이거 뭐라고 해?"'
  결과: 질문을 다시 천천히 잇는다
  왜: 옆 사람에게 한 말은 답이 아니므로 질문을 다시 천천히 한다.
- id: K7
  상황: 문진에 대한 불평
  예: '"질문이 왜 이렇게 많아"'
  결과: 받아 주고(남은 수는 안내 E2로만) 잇는다
  왜: 불평에는 받아 주되 남은 수 같은 값을 지어내지 않는다.
- id: K8
  상황: 자기가 앞서 한 답을 물음
  예: '"제가 담배 몇 개라고 했죠?"'
  결과: 도와드리기 어렵다고 하고 잇는다(앞 답을 읽어 주는 것은 15절 요약 읽기와 함께 보류)
  왜: 앞서 한 답을 읽어 주는 기능은 정하지 않았으므로(보류) 지어내지 않고 도와드리기 어렵다고 한다.
- id: K9
  상황: 문진에 없는 건강 정보
  예: '"저 당뇨도 있어요"'
  결과: 받아 주고 잇는다. 저장하지 않는다
  왜: 문진에 없는 정보는 저장할 곳이 없다. 받아 주고 잇는다.
- id: J1
  상황: 문진 중 문항 정의가 바뀜
  예: 새 버전 등록
  결과: 진행 중인 세션은 처음 버전 그대로 끝난다
  왜: 운영 중 문항 정의가 바뀌어도 진행 중인 세션의 답과 문항이 어긋나면 안 된다.
- id: J2
  상황: 처리 중 실패
  예: 컴포넌트·저장 실패
  결과: 사용자 쪽은 실패를 알고 대처한다(대처는 프론트). 직원도 안다
  왜: 처리 중 실패하면 사용자와 직원이 알아야 대처한다.
- id: J3
  상황: 직원 호출이 전달되지 않음
  예: 직원 화면 엔드포인트 장애
  결과: 사용자는 안내를 듣고, 프론트는 직원이 오지 않는다는 것을 안다
  왜: 직원 호출이 실패하면 직원이 오지 않는다는 것을 프론트가 알아야 한다.
- id: J4
  상황: 직원이 보낸 재개·종료가 반영되지 않음
  예: 재개 처리 중 실패, 이미 끝난 세션에 종료
  결과: 직원이 반영 여부를 안다
  왜: 직원이 보낸 결정이 반영됐는지 직원이 알아야 다시 보낸다.
- id: J5
  상황: 결과 전달 실패
  예: 받는 시스템 장애
  결과: 실패가 기록된다(다시 보내기는 결과 전달·운영의 일)
  왜: 결과 전달이 실패하면 다시 보낼 수 있게 기록돼야 한다.
- id: J6
  상황: 문제 원인 추적
  예: 결과가 틀렸다는 신고
  결과: 어느 컴포넌트에서 틀렸는지 경계 값으로 가린다
  왜: 결과가 틀렸다는 신고가 오면 어느 단계가 틀렸는지 가려야 한다.
- id: J7
  상황: 모델 출력이 깨짐
  예: LoRA-A가 형식이 깨진 출력·없는 의도를 냄, LoRA-B가 응답 지시에 없는 말을 함
  결과: 'LoRA-A: "다시 말씀해 주세요"를 듣는다. LoRA-B: 정해진 문장 그대로 듣는다. 턴은 실패하지 않는다.'
  왜: 모델 출력은 깨질 수 있다. 깨져도 대화가 이어지고 지어낸 말이 나가지 않아야 한다.
- id: V1
  상황: 한 발화에 같은 칸의 두 줄
  예: '"소주는 두 병인데 맥주는 모르겠어요"'
  결과: 줄마다 따로 판정하고 따로 저장한다
  왜: 한 문항이 주종처럼 줄마다 반복되면 한 발화에 같은 칸의 두 줄이 올 수 있고("소주는 2병인데 맥주는 모르겠어요") 줄마다 상태가 다르다. 줄을 가리키지 못하면 둘 중 하나를 버려야 한다.
- id: V2
  상황: 다른 줄의 같은 칸
  예: 소주를 답한 뒤 "맥주는 세 잔이요"
  결과: 충돌이 아니라 그 줄의 첫 답이다
  왜: 다른 줄의 같은 칸을 같은 대상으로 보면, 두 번째 줄의 첫 답이 충돌로 잘못 판정되어 묻지 않아도 될 확인을 한다.
- id: V3
  상황: 목록에 없는 반복 키
  예: '"위스키 한 잔이요"'
  결과: 정의에 없는 대상으로 본다
  왜: 반복 키를 문항 정의가 정하지 않으면 사용자가 말한 아무 말이나 줄 식별자가 되어 저장에 들어간다.
- id: T1
  상황: 단일 근사값의 정밀도와 근거 보존
  예: 소주 두 병쯤 마셔요
  결과: 계약으로 선언한 정보를 보존할 수 있다.
  왜: 정해진 정보의 정적 표현 요구다. 단일 근사값의 정밀도와 근거 보존에 필요한 값과 구조를 보존하며 실제 발화의 정답을 판단하지 않는다.
- id: T2
  상황: 현재 원문에서 복수 위치 근거 보존
  예: 한 병이요. 아니, 두 병이요
  결과: 계약으로 선언한 정보를 보존할 수 있다.
  왜: 정해진 정보의 정적 표현 요구다. 현재 원문에서 복수 위치 근거 보존에 필요한 값과 구조를 보존하며 실제 발화의 정답을 판단하지 않는다.
- id: T3
  상황: 선택지·단위 코드와 표시 이름의 분리
  예: 시작
  결과: 계약으로 선언한 정보를 보존할 수 있다.
  왜: 정해진 정보의 정적 표현 요구다. 선택지·단위 코드와 표시 이름의 분리에 필요한 값과 구조를 보존하며 실제 발화의 정답을 판단하지 않는다.
- id: T4
  상황: 표시 이름과 다른 선택지 코드 전달
  예: 표시 이름 예시
  결과: 계약으로 선언한 정보를 보존할 수 있다.
  왜: 정해진 정보의 정적 표현 요구다. 표시 이름과 다른 선택지 코드 전달에 필요한 값과 구조를 보존하며 실제 발화의 정답을 판단하지 않는다.
- id: T5
  상황: 기준 revision과 원자적 쓰기 묶음의 표현
  예: 저장 요청 예시
  결과: 계약으로 선언한 정보를 보존할 수 있다.
  왜: 정해진 정보의 정적 표현 요구다. 기준 revision과 원자적 쓰기 묶음의 표현에 필요한 값과 구조를 보존하며 실제 발화의 정답을 판단하지 않는다.
- id: T6
  상황: 저장 성공과 반환 revision 표현
  예: 저장 결과 예시
  결과: 계약으로 선언한 정보를 보존할 수 있다.
  왜: 정해진 정보의 정적 표현 요구다. 저장 성공과 반환 revision 표현에 필요한 값과 구조를 보존하며 실제 발화의 정답을 판단하지 않는다.
- id: T7
  상황: 동시 수정 충돌과 값 충돌의 구분
  예: 버전 충돌 예시
  결과: 계약으로 선언한 정보를 보존할 수 있다.
  왜: 정해진 정보의 정적 표현 요구다. 동시 수정 충돌과 값 충돌의 구분에 필요한 값과 구조를 보존하며 실제 발화의 정답을 판단하지 않는다.
- id: T8
  상황: 조회 상태와 revision의 결합
  예: 조회 예시
  결과: 계약으로 선언한 정보를 보존할 수 있다.
  왜: 정해진 정보의 정적 표현 요구다. 조회 상태와 revision의 결합에 필요한 값과 구조를 보존하며 실제 발화의 정답을 판단하지 않는다.
- id: T9
  상황: 세부 문제 코드와 관련 칸 보존
  예: 두 박스예요
  결과: 계약으로 선언한 정보를 보존할 수 있다.
  왜: 정해진 정보의 정적 표현 요구다. 세부 문제 코드와 관련 칸 보존에 필요한 값과 구조를 보존하며 실제 발화의 정답을 판단하지 않는다.
- id: T10
  상황: 저장 오류와 반영 여부 미확인의 구분
  예: 결과 미확인 예시
  결과: 계약으로 선언한 정보를 보존할 수 있다.
  왜: 정해진 정보의 정적 표현 요구다. 저장 오류와 반영 여부 미확인의 구분에 필요한 값과 구조를 보존하며 실제 발화의 정답을 판단하지 않는다.
cases:
- id: A1
  상황:
  - A1
  설명: A1 시작
  given:
    세션: 없음
  input:
    신호: 세션 시작
  expect:
    LangGraph:
      세션정보생성: true
      턴종류: SESSION_START
      대화로그:
        입력:
          종류: SESSION_START
          발화: 없음
          개입결정: 없음
        처리: SESSION_START
        턴결과: 확정
        LoRA-A출력: 없음
        정규화출력: 없음
        판정출력: 없음
        저장출력: 없음
        응답지시: 있음
        흐름: CONTINUE
        진행기록갱신: 있음
        직원알림: 없음
        응답문장: 있음
        직원알림전달: 해당 없음
        턴실패신호: 없음
        개입결정결과: 없음
    Plan:
      행동: ASK_NEXT
      대상:
      - Q1
  왜: 'A1 시작: 기대값이 행동 ASK_NEXT Q1이 되는지 확인한다. 이 상황을 다루는 이유: 문진은 키오스크 앞에서 말 없이 시작될 수 있다. 시작 신호만으로 첫 질문을 할 수 있어야 한다.
    기대값을 정하는 규칙: 9-1절 처리 표; 8-3절 1; 8-1 규칙 17.'
- id: A2
  상황:
  - A2
  설명: A2 첫 입력이 말
  given:
    세션: 없음
  input:
    발화: 담배 안 피워요
  expect:
    LangGraph:
      세션정보생성: true
      턴종류: UTTERANCE
      대화로그:
        입력:
          종류: UTTERANCE
          발화: 있음
          개입결정: 없음
        처리: UTTERANCE
        문항정의버전: 1
    LoRA-A:
    - 대상: Q1.상태
      값: 안 피워요
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q1.상태
      상태: ANSWERED
      이번값: 안 피움
    저장:
    - 슬롯: Q1.상태
      동작: FIRST_WRITE
      값: 안 피움
    Plan:
      행동: ASK_NEXT
      대상:
      - Q3a
    뒤:
      답:
        Q1.상태: 안 피움
  왜: 'A2 첫 입력이 말: 기대값이 판정 Q1.상태 ANSWERED; 저장 Q1.상태 FIRST_WRITE; 행동 ASK_NEXT Q3a이 되는지 확인한다. 이 상황을 다루는 이유: 사용자는 시작
    버튼 없이 바로 답부터 말할 수 있다. 그 말을 버리면 다시 말하게 해야 한다. 기대값을 정하는 규칙: 9-1절 처리 표; 6절 1; 7절 1; 8-1 규칙 17.'
- id: A3
  상황:
  - A3
  설명: A3 다시 접속
  given:
    기본: 없음
    답:
      Q1.상태: 현재 피움
    직전:
      행동: ASK_NEXT
      대상:
      - Q2
  input:
    신호: 세션 시작
  expect:
    LangGraph:
      턴종류: SESSION_START
    Plan:
      행동: ASK_NEXT
      대상:
      - Q2
  왜: 'A3 다시 접속: 기대값이 행동 ASK_NEXT Q2이 되는지 확인한다. 이 상황을 다루는 이유: 연결이 끊겼다 다시 붙는 일은 키오스크에서 흔하다. 처음부터 다시 물으면 이미 한 답을 또
    말해야 한다. 기대값을 정하는 규칙: 9-1절 처리 표; 8-3절 1; 8-1 규칙 17.'
- id: A4a
  상황:
  - A4
  설명: A4 떠남
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    신호: 세션 종료
  expect:
    LangGraph:
      턴종류: END_LEFT
      결과전달호출: true
    Plan:
      행동: FAREWELL
      알릴것:
      - SURVEY_STOPPED: null
      세션상태: ENDED_LEFT
      흐름: END
    결과전달입력:
      세션정보:
        문항정의버전: 1
      세션상태: ENDED_LEFT
      응답기록: 받은 데까지(기본 상태의 Q1~Q4)
      건너뜀: []
      확인중단: []
      중지이력: []
  왜: 'A4 떠남: 기대값이 행동 FAREWELL; 세션 상태 ENDED_LEFT이 되는지 확인한다. 이 상황을 다루는 이유: 사용자는 말없이 떠날 수 있다. 그때까지 받은 답이 넘어가지 않으면 버려진다.
    기대값을 정하는 규칙: 9-1절 처리 표; 8-3절 4.'
- id: A4b
  상황:
  - A4
  설명: A4 대기 중에 떠남
  given:
    직전:
      행동: WAIT_NOTICE
    기다리는답:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    신호: 세션 종료
  expect:
    LangGraph:
      턴종류: END_LEFT
      결과전달호출: true
    Plan:
      행동: FAREWELL
      알릴것:
      - SURVEY_STOPPED: null
      세션상태: ENDED_LEFT
      흐름: END
  왜: 'A4 대기 중에 떠남: 기대값이 행동 FAREWELL; 세션 상태 ENDED_LEFT이 되는지 확인한다. 이 상황을 다루는 이유: 사용자는 말없이 떠날 수 있다. 그때까지 받은 답이 넘어가지
    않으면 버려진다. 기대값을 정하는 규칙: 9-1절 처리 표; 8-3절 4.'
- id: A5
