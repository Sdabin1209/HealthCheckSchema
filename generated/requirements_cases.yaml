    다루는 이유: 다른 줄의 같은 칸을 같은 대상으로 보면, 두 번째 줄의 첫 답이 충돌로 잘못 판정되어 묻지 않아도 될 확인을 한다. 기대값을 정하는 규칙: 6절 1(현재값과 다른 값이어야 충돌이다).
    소주 줄의 현재값은 맥주 줄의 현재값이 아니므로 맥주 줄은 첫 답이다. 반복 키가 없으면 2병과 3잔이 같은 칸의 두 값이 되어 충돌로 잘못 판정된다.'
