    아무 말이나 줄 식별자가 되어 저장에 들어간다. 기대값을 정하는 규칙: QuestionDef.repeat_keys(목록에 없는 키는 받지 않는다). 4절 대체 출력·5절 정의에 없는 대상은 무관으로
