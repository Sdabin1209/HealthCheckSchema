    프론트 전달: DELIVER_FRONT
field_encodings:
  JudgeOutput:
    judgments[].status:
      없음: null
representation_conventions:
  field_values:
    FrontendMessage/properties/kind: &id001
      세션 시작: SESSION_START
      세션 종료: SESSION_END
    OrchestratorInput/properties/session_found:
      없음: false
      진행 중: true
      일시 중지(위험): true
      종료(완료): true
      '종료(미완료: 개입 종료)': true
      '종료(미완료: 이탈)': true
      '종료(미완료: 사용자 중단)': true
    OpenRequests/properties/stop_requested:
      예: true
      아니요: false
    DispatchRecord/properties/succeeded:
      SUCCESS: true
      FAILURE: false
      성공: true
      실패: false
    FrontendMessage/oneOf/0/properties/kind: *id001
    FrontendMessage/oneOf/1/properties/kind: *id001
    FrontendMessage/oneOf/2/properties/kind: *id001
    OrchestratorOutput/properties/turn_kind:
      처리 안 함: null
  discriminator_keys:
    CORRECTION_ACK: CORRECTION_ACK
    KEPT_PREVIOUS: KEPT_PREVIOUS
    RESUME: RESUME
    SURVEY_STOPPED: SURVEY_STOPPED
    GUIDE: GUIDE
    DEFERRED: DEFERRED
    RISK_SIGNAL: RISK_SIGNAL
    USER_CALLED_STAFF: USER_CALLED_STAFF
    위험 신호: RISK_SIGNAL
    사람 요청: USER_CALLED_STAFF
    위험 기준: RISK_RULE
  nullable_tokens:
  - 없음
  - 그대로
  purpose: 요구자료의 선언값을 wire 표현으로 읽는 표기 규칙이다. 입력에 대한 정답이나 업무 동작을 계산하지 않는다.
