  FailedStep/properties/step:
    ? ''
    : LoRA-B
    정규화·검증: NORMALIZE
    상태 판정: JUDGE
    저장 판단: RECORD_WRITE
    Plan 결정: PLAN
    쓰기 확정: COMMIT
    직원 알림 전달: DELIVER_STAFF
    프론트 전달: DELIVER_FRONT
  LogEntry/properties/handling:
