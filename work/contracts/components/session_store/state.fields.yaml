definition: SessionStore
nodes:
  ? ''
  : title: 기록 저장소
    meaning: 세션 하나의 기록 전체.
    why: 세션 사이에 이어져야 하는 것만 둔다. 필드마다 쓰는 쪽은 하나다.
    case_refs:
    - B1
    - J1
    - J5
    evidence_status: requirement_reference
  /properties/session_info:
    title: 세션 정보
    meaning: LangGraph가 세션을 만들 때 한 번 쓴다.
    why: 세션을 찾고 그 세션의 문항 정의 버전을 고정해 둔다.
    case_refs:
    - J1
    - A1
    evidence_status: requirement_reference
  /properties/answer_records:
    title: 응답 기록
    meaning: 슬롯별 기록. 저장 판단만 쓴다. 동일 세션 상태에서 (question_id, repeat_key, slot_id) 복합 키는 유일하다.
    why: 문진의 답 자체로, 결과 전달이 넘기는 본체이고 Plan이 열린 문항을 계산하는 근거다. 하나의 슬롯에 서로 다른 현재 기록이 중복 존재하지 않도록 참조 대상을 결정해야 한다.
    case_refs:
    - B1
    - C1
    - C2
    evidence_status: requirement_reference
  /properties/progress_record:
    title: 진행 기록
    meaning: Plan만 쓴다.
    why: 다음 턴의 판단에 필요한 진행 사실을 턴 사이에 이어 둔다.
    case_refs:
    - A3
    - C8d
    - G5
    evidence_status: requirement_reference
  /properties/planner_record:
    title: Plan 기록
    meaning: Plan만 쓰고 읽는다.
    why: 상한과 수용 시점을 적용하는 데 필요한 횟수를 턴 사이에 이어 둔다.
    case_refs:
    - F3
    - C8a
    - B10
    evidence_status: requirement_reference
  /properties/dialogue_log:
    title: 대화 로그
    meaning: LangGraph만 쓴다. 시스템 안에서 읽는 컴포넌트는 없다.
    why: 결과가 틀렸다는 신고를 받으면 어느 컴포넌트에서 틀렸는지 턴별 경계 값으로 가리고, E2E 검증의 Trace로 쓴다. 시스템 안에서 읽는 컴포넌트는 없다.
    case_refs:
    - J2
    - G5
    - A5
    evidence_status: requirement_reference
  /properties/dispatch_log:
    title: 전달 기록
    meaning: 결과 전달만 쓴다.
    why: 결과를 넘긴 기록을 남겨 실패한 전달을 다시 보낼 수 있다.
    case_refs:
    - J5
    evidence_status: requirement_reference
  /properties/revision:
    title: ''
    meaning: 저장소가 보고한 상태 버전 토큰. 답 이력의 revision ID와 다른 개념이다. 생성 규칙과 단조 증가 여부는 정하지 않는다.
    why: 조회한 상태와 그 상태의 버전 토큰을 함께 보존하여 저장 기준 버전을 혼동하지 않아야 한다.
    case_refs:
    - T8
    evidence_status: requirement_reference
