definition: DispatchInput
nodes:
  ? ''
  : title: 결과 전달이 받는 값
    meaning: 세션 정보·응답 기록·건너뜀·확인 중단·세션 상태·중지 이력·문항 정의(턴 쓰기 반영 뒤).
    why: '넘길 결과 전부: 답, 수정 이력, 풀리지 않은 답, 위험 답, 받지 못한 문항과 사유, 완료 여부, 멈춘 적(A4, C8, G4,
      G7).'
    case_refs:
    - G7
    evidence_status: requirement_reference
  /properties/session_info:
    title: 세션 정보
    meaning: 기록 저장소 · 세션 정보.
    why: 어느 세션의 결과인지, 어느 문항 정의 버전으로 받은 답인지 받는 쪽이 알아야 한다.
    case_refs:
    - H2
    - H4
    evidence_status: requirement_reference
  /properties/answer_records:
    title: 응답 기록
    meaning: 기록 저장소 · 모든 슬롯.
    why: 넘길 답(현재값), 수정 이력, 풀리지 않은 확인 대기, 위험 표시가 모두 여기 있다.
    case_refs:
    - H2
    - H4
    - A4a
    evidence_status: requirement_reference
  /properties/skipped:
    title: 건너뜀
    meaning: 기록 저장소 · 진행 기록.건너뜀.
    why: 받지 못한 문항과 그 까닭을 결과에 함께 넘긴다.
    case_refs:
    - H4
    evidence_status: requirement_reference
  /properties/confirm_stopped:
    title: 확인 중단
    meaning: 기록 저장소 · 진행 기록.확인 중단.
    why: 확인을 그만둔 확인 대기는 결과에 '풀리지 않은 답'(서로 다른 두 답)으로 넘겨야 의료진이 판단한다.
    case_refs:
    - H4
    - C8d
    evidence_status: requirement_reference
  /properties/session_status:
    title: 세션 상태
    meaning: 기록 저장소 · 진행 기록.세션 상태.
    why: 완료인지, 미완료면 왜(개입 종료·이탈·사용자 중단)인지 결과에 넘긴다.
    case_refs:
    - A4a
    - F4
    - H2
    evidence_status: requirement_reference
  /properties/pause_history:
    title: 중지 이력
    meaning: 기록 저장소 · 진행 기록.중지 이력.
    why: 문진 중 위험으로 멈춘 적이 있는지 결과에 넘긴다.
    case_refs:
    - G7
    evidence_status: requirement_reference
