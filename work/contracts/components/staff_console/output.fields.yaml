  : title: 개입 결정
    meaning: 직원·의료진의 재개·종료.
    why: 위험으로 멈춘 문진은 사람만 이어 가거나 끝낼 수 있다(G6, G7, F4).
    case_refs:
    - F4
    - G6a
    - G7
    - J4b
    evidence_status: requirement_reference
  /properties/session_id:
    title: 세션 식별
    meaning: 어느 세션의 값인지.
    why: 직원이 여러 키오스크를 보며 재개·종료를 보내므로, 어느 세션에 대한 결정인지 있어야 9-1절 처리 표가 그 세션의 상태로 판단한다(F4,
      G6).
    case_refs:
    - G6a
    - J4b
    - F4
    evidence_status: requirement_reference
  /properties/decision:
    title: 결정
    meaning: 재개 또는 종료.
    why: 직원이 이어 갈지 끝낼지 정한다(G6, G7).
    case_refs:
    - F4
    - G6a
    - G7
    - J4a
    evidence_status: requirement_reference
