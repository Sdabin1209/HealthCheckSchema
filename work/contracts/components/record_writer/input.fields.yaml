definition: RecordWriterInput
nodes:
  ? ''
  : title: 저장 판단이 받는 값
    meaning: 판정·무효화 대상 문항·슬롯 목록·기록 대상 슬롯의 응답 기록.
    why: 판정을 슬롯별 저장 결정으로 바꾸려면 첫 저장인지(현재값), 받아들일 값(확인 대기)이 무엇인지 알아야 한다.
    case_refs:
    - B1
    - C1
    - C2
    evidence_status: requirement_reference
  /properties/judgments:
    title: 판정
    meaning: 상태 판정 · 판정.
    why: 판정마다 슬롯별 저장 결정(첫 저장, 새 revision, 확인 대기 등)을 만든다.
    case_refs:
    - B1
    - C1
    - C3
    evidence_status: requirement_reference
  /properties/invalidated_questions:
    title: 무효화 대상 문항
    meaning: 상태 판정 · 무효화 대상 문항.
    why: 선행 답이 바뀐 문항의 후속 기록을 지우는 저장 결정(무효화)을 내야 한다.
    case_refs:
    - C2
    - S6c
    evidence_status: requirement_reference
  /properties/question_slots:
    title: 문항의 슬롯 목록
    meaning: 문항 정의 저장소 · 문항 전체 판정의 문항과 무효화 대상 문항의 슬롯 전부.
    why: 응답 기록은 슬롯 단위라 문항 전체 판정과 무효화 대상 문항을 슬롯으로 펼쳐야 저장 결정을 낼 수 있다.
    case_refs:
    - B7a
    - C2
    evidence_status: requirement_reference
  /properties/question_slots/items:
    title: 문항 슬롯 항목
    meaning: 문항과 슬롯 ID들.
    why: 문항마다 칸이 달라 문항 단위 판정과 무효화를 칸으로 펼친다.
    case_refs:
    - B7a
    - C2
    evidence_status: requirement_reference
  /properties/question_slots/items/properties/question_id:
    title: 문항 ID
    meaning: 문항.
    why: 문항 단위 판정을 칸 단위 저장 결정으로 펼치려면 문항과 칸 목록이 짝지어 있어야 한다.
    case_refs:
    - B7a
    - C2
    evidence_status: requirement_reference
  /properties/question_slots/items/properties/slot_ids:
    title: 슬롯 ID
    meaning: 슬롯들.
    why: 펼칠 칸 목록이다. 응답 기록은 칸 단위다.
    case_refs:
    - B7a
    - C2
    evidence_status: requirement_reference
  /properties/question_slots/items/properties/slot_ids/items:
    title: ''
    meaning: 대상 문항에 등록된 슬롯 식별자 하나.
    why: 문항 전체 판정과 무효화를 슬롯별 저장 결정으로 펼친다.
    case_refs:
    - B7a
    - C2
    evidence_status: requirement_reference
  /properties/target_records:
    title: 기록 대상 슬롯의 응답 기록
    meaning: 기록 저장소 · 기록 대상 슬롯마다 현재값과 확인 대기(턴 시작). 기록이 없으면 현재값 없음, 확인 대기 없음.
    why: 첫 저장인지 새 revision인지, 지울 기록이 있는지, 받아들일 값과 위험 표시.
    case_refs:
    - C1
    - B1
    - C4a
    evidence_status: requirement_reference
  /properties/target_records/items:
    title: 기록 대상 항목
    meaning: 슬롯·현재값·확인 대기.
    why: 슬롯마다 기록이 다르다. 기록 대상 슬롯만 받아 필요 없는 기록에 의존하지 않는다.
    case_refs:
    - C1
    - C2
    - B1
    - C4a
    - S8b
    evidence_status: requirement_reference
  /properties/target_records/items/properties/slot:
    title: 슬롯
    meaning: 저장 판단이 current_value·pending을 읽고 쓰기 결정을 적용할 대상 슬롯 식별자.
    why: 어느 칸의 기록인지 있어야 그 칸의 판정과 맞춰 첫 저장인지 새 revision인지 정한다.
    case_refs:
    - C1
    - C2
    evidence_status: requirement_reference
  /properties/target_records/items/properties/current_value:
    title: 현재값
    meaning: 현재값.
    why: 첫 저장인지 새 revision인지, 지울 기록이 있는지.
    case_refs:
    - C1
    - B1
    - C2
    evidence_status: requirement_reference
  /properties/target_records/items/properties/pending:
    title: 확인 대기
    meaning: 확인 대기.
    why: 받아들임이면 이 확인 대기의 값과 위험 표시를 현재값으로 옮기고, 버림이면 지울 것이 있는지 안다.
    case_refs:
    - C4a
    - S8b
    evidence_status: requirement_reference
  /properties/target_records/items/properties/pending/anyOf/1:
    title: ''
    meaning: 없음
    why: 확인 대기가 없는 기록 대상 슬롯이다(B1 첫 저장, C1 새 revision). 7절 1의 두 동작은 확인 대기를 보지 않는다.
    case_refs:
    - B1
    - C1
    evidence_status: requirement_reference
