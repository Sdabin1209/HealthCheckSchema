definition: AnswerJudgeInput
nodes:
  ? ''
  : title: 상태 판정이 받는 값
    meaning: 항목·검사·발화 원문·위험 표현·직전 응답 지시·확인 대기 목록·후속 문항·슬롯 목록.
    why: 해석에 필요한 것 전부. 값 규칙은 받지 않는다(검사 결과로 받는다).
    case_refs:
    - B1
    - C4a
    - G2
    evidence_status: requirement_reference
  /properties/items:
    title: 항목 목록
    meaning: LoRA-A · 항목 목록.
    why: 사용자가 무엇을 하려 했는지(의도)와 원문을 보고 판정한다.
    case_refs:
    - B1
    - C1
    - C3
    evidence_status: requirement_reference
  /properties/item_checks:
    title: 항목별 검사
    meaning: 정규화·검증 · 항목별 검사.
    why: 값이 쓸 만한지, 기존·확인 대기 값과 같은지를 값 규칙 없이 사실로 받는다.
    case_refs:
    - B3a
    - C3
    - X2
    evidence_status: requirement_reference
  /properties/missing_required_slots:
    title: 빠진 필수 슬롯
    meaning: 정규화·검증 · 빠진 필수 슬롯.
    why: 같은 문항에서 빠진 필수 칸마다 누락 판정을 내야 빠진 것만 다시 묻는다.
    case_refs:
    - B2
    - S8b
    - E3b
    evidence_status: requirement_reference
  /properties/utterance:
    title: 발화 원문
    meaning: 프론트 · 발화.
    why: 위험 표현 목록과 대조해 모델이 놓친 위급한 말을 잡는다(G2).
    case_refs:
    - G2
    - G9
    - S3c
    evidence_status: requirement_reference
  /properties/risk_phrases:
    title: 위험 표현 목록
    meaning: 문항 정의 저장소 · 세션 설정.위험 표현 목록.
    why: 원문과 대조할 표현. 의료진이 관리한다(G2, G9).
    case_refs:
    - G2
    - G9
    - S3c
    evidence_status: requirement_reference
  /properties/last_directive:
    title: 직전 응답 지시
    meaning: 기록 저장소 · 진행 기록.직전 응답 지시(턴 시작).
    why: '"네"가 무엇에 대한 답인지, 정정 구체화의 답이라 정정으로 볼지, 대상 없는 "이건 이따 할게요"가 어느 문항인지(C4, C6,
      D3).'
    case_refs:
    - C4a
    - C4b
    - D3a
    evidence_status: requirement_reference
  /properties/last_directive/anyOf/1:
    title: ''
    meaning: 없음
    why: 직전 응답 지시가 없는 첫 발화다(A2, N1c). 6절 표의 "없음" 열이 이 경우이고, 이때 단독 "네"는 가리킬 것이 없어 무관과
      같이 본다.
    case_refs:
    - A2
    - N1c
    evidence_status: requirement_reference
  /properties/pendings:
    title: 확인 대기 목록
    meaning: 기록 저장소 · 확인 대기가 있는 모든 슬롯(턴 시작).
    why: 묻지 않은 확인 대기도 발화로 정리될 수 있어 전부 받는다(C4).
    case_refs:
    - C4a
    - X6
    - C3
    evidence_status: requirement_reference
  /properties/pendings/items:
    title: 확인 대기 목록 항목
    meaning: ID·슬롯·종류.
    why: '"네"를 확인 대기 ID와 잇고, 버릴 확인 대기를 슬롯으로 찾는다.'
    case_refs:
    - C4a
    - X6
    - C8c
    - X2
    evidence_status: requirement_reference
  /properties/pendings/items/properties/pending_id:
    title: 확인 대기 ID
    meaning: 이번 확인 응답이 수락·폐기할 현재 확인 대기의 ID.
    why: '"네"가 받아들일 확인 대기를 ID로 맞춰 보고 판정에 담는다.'
    case_refs:
    - C4a
    - X6
    evidence_status: requirement_reference
  /properties/pendings/items/properties/slot:
    title: 슬롯
    meaning: 이 확인 대기를 수락·폐기했을 때 바뀔 문항·반복 행·슬롯의 식별자.
    why: 문항 전체 모름·거절이 덮는 칸의 확인 대기를 찾아 버린다.
    case_refs:
    - C4a
    - C8c
    - X2
    evidence_status: requirement_reference
  /properties/affected_followups:
    title: 영향받는 후속 문항
    meaning: 문항 정의 저장소 · 모든 문항의 영향받는 후속 문항.
    why: 값이 바뀌는 문항의 후속 문항을 무효화 대상으로 낸다(C2).
    case_refs:
    - C2
    - S6a
    - S6c
    evidence_status: requirement_reference
  /properties/affected_followups/items:
    title: 후속 문항 항목
    meaning: 문항과 후속.
    why: 문항마다 무효로 만드는 후속 문항이 다르다.
    case_refs:
    - C2
    evidence_status: requirement_reference
  /properties/affected_followups/items/properties/question_id:
    title: 문항 ID
    meaning: 문항.
    why: 값이 바뀌는 문항을 찾아 그 후속 문항을 무효화 대상으로 낸다.
    case_refs:
    - C2
    evidence_status: requirement_reference
  /properties/affected_followups/items/properties/followups:
    title: 후속 문항
    meaning: 영향받는 후속 문항.
    why: 선행 답이 바뀌면 이 문항들의 기록이 더 맞지 않아 지워야 한다.
    case_refs:
    - C2
    evidence_status: requirement_reference
  /properties/question_slots:
    title: 문항의 슬롯 목록
    meaning: 문항 정의 저장소 · 항목에 문항 전체로 나온 문항의 슬롯 ID 전부.
    why: 문항 전체 모름·거절이 같은 발화의 슬롯 판정을 빼고 남는 슬롯과 버릴 확인 대기를 정한다(B7).
    case_refs:
    - S3b
    - S8d
    - R11
    evidence_status: requirement_reference
  /properties/question_slots/items:
    title: 문항 슬롯 항목
    meaning: 문항과 슬롯 ID들.
    why: 문항마다 칸이 달라 문항 전체 판정을 칸으로 나눠 본다.
    case_refs:
    - S3b
    - S8d
    evidence_status: requirement_reference
  /properties/question_slots/items/properties/question_id:
    title: 문항 ID
    meaning: 문항.
    why: 문항 전체 판정의 문항과 그 칸 목록을 짝지어야 칸별로 나눈다.
    case_refs:
    - S3b
    - S8d
    evidence_status: requirement_reference
  /properties/question_slots/items/properties/slot_ids:
    title: 슬롯 ID
    meaning: 슬롯들.
    why: 문항 전체 모름·거절에서 같은 발화로 답한 칸을 빼고 남는 칸을 정하려면 칸 목록이 있어야 한다.
    case_refs:
    - S3b
    - S8d
    evidence_status: requirement_reference
  /properties/question_slots/items/properties/slot_ids/items:
    title: ''
    meaning: 대상 문항에 등록된 슬롯 식별자 하나.
    why: 문항 전체 판정에서 해당하는 슬롯의 범위를 확인한다.
    case_refs:
    - S3b
    - S8d
    evidence_status: requirement_reference
