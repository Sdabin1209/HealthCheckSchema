definition: OrchestratorInput
nodes:
  ? ''
  : title: LangGraph가 받는 값
    meaning: 턴 시작 입력과 세션 상태.
    why: 처리 표의 입력 종류·세션 상태로 턴을 정한다. Plan의 흐름은 이후 PlannerOutput.flow에서 직접 받는다.
    case_refs:
    - A1
    - A5
    - J1
    evidence_status: requirement_reference
  /properties/frontend_input:
    title: 프론트 입력
    meaning: 이번 턴 입력이 프론트에서 왔으면.
    why: 프론트의 신호·발화가 턴을 시작하고 턴 종류를 정한다.
    case_refs:
    - A1
    - A2
    - A4a
    evidence_status: requirement_reference
  /properties/frontend_input/anyOf/1:
    title: ''
    meaning: 없음
    why: 입력이 사람 개입에서 온 턴이다(F4 직원 종료, G6a 재개). 프론트 입력과 개입 결정 중 하나만 차야 9-1절 처리 표의 행이
      하나로 정해진다.
    case_refs:
    - F4
    - G6a
    evidence_status: requirement_reference
  /properties/intervention_decision:
    title: 개입 결정
    meaning: 이번 턴 입력이 사람 개입에서 왔으면.
    why: 직원의 재개·종료가 재개 턴과 개입 종료 턴을 시작한다.
    case_refs:
    - G6a
    - G7
    - J4b
    evidence_status: requirement_reference
  /properties/intervention_decision/anyOf/1:
    title: ''
    meaning: 없음
    why: 입력이 프론트에서 온 턴이다(A1 시작 신호, B1 발화). 둘 다 차면 처리 표의 어느 행인지 정할 수 없다.
    case_refs:
    - A1
    - B1
    evidence_status: requirement_reference
  /properties/session_found:
    title: 세션 있음
    meaning: 기록 저장소 · 받은 세션 식별과 같은 세션 정보가 있는지(턴 맨 앞).
    why: 없으면 세션을 만든다(A2).
    case_refs:
    - A1
    - A2
    - A3
    evidence_status: requirement_reference
  /properties/session_question_bank_version:
    title: 이 세션의 문항 정의 버전
    meaning: 기록 저장소 · 세션 정보.문항 정의 버전(턴 시작). 세션이 없으면 없음.
    why: 이 버전으로 문항 정의를 가져와 컴포넌트에 건넨다. 운영 중 새 버전이 등록돼도 진행 중인 세션은 처음 버전으로 끝난다(J1).
    case_refs:
    - J1
    evidence_status: requirement_reference
  /properties/session_question_bank_version/anyOf/1:
    title: ''
    meaning: 없음
    why: 아직 세션이 없어 고정된 문항 정의 버전이 없다(A1·A2 모두 세션 없음에서 시작). 이때 최신 버전으로 세션 정보를 만들어 버전을
      고정한다(J1).
    case_refs:
    - A2
    - A1
    evidence_status: requirement_reference
  /properties/session_status:
    title: 세션 상태
    meaning: 기록 저장소 · 진행 기록.세션 상태(턴 시작). 세션이 없으면 없음.
    why: 처리 표에 따라 입력을 처리할지, 어떤 턴 종류로 처리할지 정한다(멈춤·종료 세션의 입력은 처리하지 않는다).
    case_refs:
    - A5
    - G5
    - J4b
    evidence_status: requirement_reference
  /properties/session_status/anyOf/1:
    title: ''
    meaning: 없음
    why: 아직 세션이 없다(A1, A2). 9-1절 처리 표의 "세션 없음" 열을 고르게 하는 값이 이 없음이다.
    case_refs:
    - A2
    - A1
    evidence_status: requirement_reference
  /properties/latest_question_bank_version:
    title: 최신 문항 정의 버전
    meaning: 문항 정의 저장소 · 가장 큰 버전.
    why: 새 세션을 만들 때 가장 최신 문항 정의로 고정하려면 그 버전을 알아야 한다.
    case_refs:
    - J1
    - A1
    evidence_status: requirement_reference
  /allOf/0/oneOf/0/properties/frontend_input:
    title: 필드 간 조건
    meaning: 프론트 입력·직원 결정은 정확히 하나만 존재하고, 세션 조회 결과와 상태·고정 버전의 존재 여부가 일치해야 한다.
    why: 잘못된 조합을 경계 스키마에서 거부하기 위해 필요하다. tests/test_schemas.py의 관계 거부 회귀 테스트로 확인한다.
    case_refs:
    - A1
    - A2
    - G6a
    evidence_status: requirement_reference
    assertions:
    - case: A1
      turn: 1
      expect_pointer: /Plan/행동
  /allOf/0/oneOf/0/properties/intervention_decision:
    title: 필드 간 조건
    meaning: 프론트 입력·직원 결정은 정확히 하나만 존재하고, 세션 조회 결과와 상태·고정 버전의 존재 여부가 일치해야 한다.
