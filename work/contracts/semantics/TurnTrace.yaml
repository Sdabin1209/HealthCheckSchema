definition: TurnTrace
nodes:
  ? ''
  : title: 한 턴의 전체 경계 Trace
    meaning: 실제로 사용한 입력과 생성한 출력 및 저장 상태를 담는 정형 기록. null은 그 경계에 payload가 확보되지 않았음을 뜻한다.
    why: 문제가 발생한 턴의 입력·경계별 출력·저장 전후 상태를 같은 세션·턴·계약 버전으로 연결하여 원인을 추적할 수 있어야 한다. 기록 형식은 payload 수집이나 실행의 정확성을 보증하지
      않는다.
    case_refs:
    - B1
    - J2
    evidence_status: requirement_reference
  /properties/session_id:
    title: session_id
    meaning: 이 Trace가 속하는 세션 식별자.
    why: 어떤 입력·출력·상태를 기록한 것인지 같은 턴에서 확인할 수 있어야 한다.
    case_refs:
    - B1
    - J2
    evidence_status: requirement_reference
  /properties/turn_id:
    title: turn_id
    meaning: 같은 세션 내 턴 식별자. 생성·유일성 검사는 수집 담당자 책임.
    why: 어떤 입력·출력·상태를 기록한 것인지 같은 턴에서 확인할 수 있어야 한다.
    case_refs:
    - B1
    - J2
    evidence_status: requirement_reference
  /properties/contract_version:
    title: contract_version
    meaning: 해당 Trace payload에 적용한 계약 버전. 적용 버전은 manifest.yaml에서 확인한다.
    why: 어떤 입력·출력·상태를 기록한 것인지 같은 턴에서 확인할 수 있어야 한다.
    case_refs:
    - B1
    - J2
    evidence_status: requirement_reference
  /properties/frontend_message:
    title: frontend_message
    meaning: FrontendMessage의 원본 payload 전체. null은 미확보이며 생략과 구분한다.
    why: 어떤 입력·출력·상태를 기록한 것인지 같은 턴에서 확인할 수 있어야 한다.
    case_refs:
    - B1
    - J2
    evidence_status: requirement_reference
  /properties/frontend_message/anyOf/1:
    title: 미확보
    meaning: 해당 경계 payload를 확보하지 못했다.
    why: 세션 조회·중간 단계 실패 또는 실행되지 않은 경계를 기록한다. 실패 단계와 함께 해석하며 Schema는 실행 여부를 판단하지 않는다.
