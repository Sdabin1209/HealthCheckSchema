definition: Evidence
nodes:
  ? ''
  : title: ''
    meaning: 현재 또는 이전 턴의 원문 근거를 위치 단위와 함께 표현한다. 턴 번호는 Framework가 부여한다.
    why: 현재 또는 이전 턴의 원문 근거를 위치 단위와 함께 표현한다. 턴 번호는 Framework가 부여한다.
    case_refs:
    - T1
    - T2
    evidence_status: requirement_reference
  /properties/turn_index:
    title: ''
    meaning: 세션 내 원문 발화의 턴 순번. Framework가 부여하며 0/1 시작 기준은 세션에서 일관되게 적용한다.
    why: 현재 발화와 과거 발화의 근거를 혼동하지 않아야 한다.
    case_refs:
    - T1
    - T2
    evidence_status: requirement_reference
  /properties/start:
    title: ''
    meaning: 원문에서 근거가 시작하는 포함 위치. 위치 단위는 offset_unit으로 명시한다.
    why: 같은 구절이 원문에 반복되어도 어느 부분을 사용했는지 식별해야 한다.
    case_refs:
    - T1
    - T2
    evidence_status: requirement_reference
  /properties/end:
    title: ''
    meaning: 원문에서 근거가 끝나는 제외 위치. start 이상이어야 한다. 순서와 text 길이의 일관성은 정적 자료 무결성 검사로 확인한다.
    why: 원문 근거의 정확한 범위를 복원할 수 있어야 한다.
    case_refs:
    - T1
    - T2
    evidence_status: requirement_reference
  /properties/offset_unit:
    title: ''
    meaning: '위치 단위: unicode_code_point, utf16_code_unit, utf8_byte. 서로 다른 런타임의 위치를
      조용히 혼용하지 않는다.'
    why: Unicode 문자, UTF-16 코드 단위, UTF-8 바이트 위치는 같은 숫자가 아닐 수 있다.
    case_refs:
    - T1
    - T2
    evidence_status: requirement_reference
  /properties/text:
    title: ''
    meaning: 근거 구절 자체. 원문 일치 여부는 원문을 가진 담당자가 확인한다.
    why: 현재 또는 이전 턴의 원문 근거를 위치 단위와 함께 표현한다. 턴 번호는 Framework가 부여한다.
    case_refs:
    - T1
    - T2
    evidence_status: requirement_reference
