definition: Intent
nodes:
  ? ''
  : title: 의도
    meaning: LoRA-A가 항목마다 붙이는, 사용자가 그 말로 하려는 일.
    why: 같은 말도 하려는 일에 따라 저장·되묻기·요청 처리로 갈린다. 하려는 일을 모델이 한 번 정해 두면 뒤의 코드 컴포넌트는 말의 뜻을 다시 해석하지 않는다.
    case_refs:
    - A2
    - B7a
    - F1
    - G1
    - K1
    evidence_status: requirement_reference
  /oneOf/0:
    title: 답함
    meaning: 묻는 문항(또는 다른 문항)에 값을 말함
    why: 말한 값을 그 슬롯의 답으로 저장하는 경로다. 이 의도가 없으면 답과 요청·잡담을 구분할 수 없다(B1).
    case_refs:
    - A2
    - B1
    - B9
    evidence_status: requirement_reference
  /oneOf/1:
    title: 정정
    meaning: 앞서 한 답을 고친다는 표지와 함께 말함
    why: 표지가 있으면 새 값을 확인 없이 고치고, 없으면 확인을 묻는다(C1과 C3을 가르는 유일한 근거)
    case_refs:
    - C1
    - C2
    - C5
    evidence_status: requirement_reference
  /oneOf/2:
    title: 확인-긍정
    meaning: 확인 질문에 "네"
    why: 확인 대기를 받아들이거나 종료·중단·정정 구체화에 승낙한다(C4, H2, D5)
    case_refs:
    - C4a
    - D5a
    - H2
    evidence_status: requirement_reference
  /oneOf/3:
    title: 확인-부정
    meaning: 확인 질문에 "아니요"
    why: 확인 대기를 버리거나 종료·중단·정정 구체화를 거부한다(C4, C9, D5)
    case_refs:
    - C4b
    - C9a
    - D5b
    evidence_status: requirement_reference
  /oneOf/4:
    title: 모름
    meaning: 모른다고 함
    why: 모름은 빈 칸과 다르다. 기록해 두어야 정책대로 한 번 더 묻거나 넘어가고, 결과에도 '모름'으로 남는다(B7).
    case_refs:
    - B7a
    - B7b
    - R11
    evidence_status: requirement_reference
  /oneOf/5:
    title: 거절
    meaning: 답하지 않겠다고 함
    why: 거절은 모름과 정책이 다르다(왜 묻는지 설명한 뒤 다시 묻는다). 구분하지 않으면 거절한 사람에게 모르냐고 다시 묻게 된다(B8).
    case_refs:
    - B8a
    - B8b
    - S3a
    evidence_status: requirement_reference
  /oneOf/6:
    title: 진행 조작
    meaning: 반복·대기·나중에·중단 요청
    why: 답이 아니라 진행에 대한 요청이라 저장하지 않고 응답만 바꾼다(D1~D5)
    case_refs:
    - D1a
    - D2
    - D3a
    - D4
    evidence_status: requirement_reference
  /oneOf/7:
    title: 안내 요청
    meaning: 안내 목록에 있는 물음(뜻, 남은 수 등)
    why: 안내 목록에 있는 물음은 검토된 문장으로만 답해야 하므로 무관과 구분해 안내 항목을 골라야 한다(E1~E3).
    case_refs:
    - E1a
    - E2
    - E3a
    evidence_status: requirement_reference
  /oneOf/8:
    title: 사람 요청
    meaning: 직원을 찾거나 시스템이 할 수 없는 요청
    why: 직원이 필요한 말을 무관으로 두면 요청이 아무에게도 가지 않는다(F1, F2).
    case_refs:
    - F1
    - F2
    - X8
    evidence_status: requirement_reference
  /oneOf/9:
    title: 무관
    meaning: 문진·안내 목록과 상관없는 말
    why: 저장도 요청도 아니므로 받아 주고 하던 질문을 잇는다(E4, K1~K9)
    case_refs:
    - E4
    - K1
    - K9a
    evidence_status: requirement_reference
  /oneOf/10:
    title: 인식불가
    meaning: 무슨 말인지 알 수 없음
    why: 다시 말해 달라고 하고, 이어지면 직원을 부른다(I1, F3)
    case_refs:
    - I1a
    - F3
    - J7b
    evidence_status: requirement_reference
  /oneOf/11:
    title: 위험 신호
    meaning: 지금 위급하다는 말
    why: 위급한 말은 문진보다 먼저 멈추고 직원을 불러야 하므로 다른 의도와 따로 표시한다(G1).
    case_refs:
    - G1
    - G8a
    - J3
    evidence_status: requirement_reference
