definition: StoreDecision
nodes:
  ? ''
  : title: 저장 결정
    meaning: 슬롯 하나에 대한 기록 저장소 쓰기. 변경 없는 슬롯은 나오지 않는다. 무효화가 먼저 온다.
    why: 기록 저장소가 판단 없이 그대로 반영하도록, 무엇을 어떤 값으로 할지 슬롯 단위로 다 정해서 보낸다.
    case_refs:
    - A2
    - C2
    - C3
    evidence_status: requirement_reference
  /properties/slot:
    title: 슬롯
    meaning: 쓸 슬롯.
    why: 응답 기록은 슬롯 단위로 저장되므로 쓰기마다 어느 칸인지 정해져 있어야 한다.
    case_refs:
    - A2
    - B1
    - C2
    evidence_status: requirement_reference
  /properties/action:
    title: 동작
    meaning: 저장 동작.
    why: 저장소는 판단하지 않으므로 이 슬롯에 무엇을 할지(첫 저장, 새 revision, 확인 대기 둠 등)를 받아야 그대로 반영한다.
    case_refs:
    - A2
    - C2
    - C3
    evidence_status: requirement_reference
  /properties/value:
    title: 값
    meaning: 첫 저장·새 revision·확인 대기 둠·확인 대기 받아들임일 때.
    why: 저장소는 판단하지 않으므로 넣을 값을 받아야 한다. 받아들임이면 확인 대기의 값을 다시 적어 보내 저장소가 찾지 않게 한다.
    case_refs:
    - A2
    - C1
    - C3
    evidence_status: requirement_reference
  /properties/value/anyOf/1:
    title: ''
    meaning: 없음
    why: '넣을 값이 없는 동작이다: 무효화(C2), 확인 대기 버림(C4b), 모름 기록(B7b), 거절 기록(B8b). 9-2절 표가 이 동작들의 현재값을 없음·모름·거절로 정하므로 저장소가
      값을 받을 필요가 없다.'
    case_refs:
    - C2
    - C4b
    - B7b
    - B8b
    evidence_status: requirement_reference
  /properties/pending_id:
    title: 확인 대기 ID
    meaning: 확인 대기 둠이면 새로 만든 ID, 받아들임·버림이면 그 ID.
    why: 받아들이거나 버릴 때 어느 확인 대기인지 맞춰 보고, 새로 둘 때는 다음 턴의 "네"가 이 ID로 이어진다.
    case_refs:
    - C3
    - C4a
    - C4b
    evidence_status: requirement_reference
  /properties/pending_id/anyOf/1:
    title: ''
    meaning: 없음
    why: 확인 대기를 다루지 않는 동작이다(B1 첫 저장, C1 새 revision). 7절 3이 확인 대기 둠마다 ID를 새로 만들므로, 없음이 "이 쓰기는 확인 대기와 상관없음"이다.
    case_refs:
    - B1
    - C1
    evidence_status: requirement_reference
  /properties/risk_mark:
    title: 위험 표시
    meaning: 값을 저장하거나 확인 대기에 두거나 받아들일 때 그 값의 위험 기준(받아들임이면 확인 대기의 위험 표시).
    why: 결과 전달이 위험 답을 표시한다(G4).
    case_refs:
    - G3
    - G4
    evidence_status: requirement_reference
  /properties/risk_mark/anyOf/1:
    title: ''
    meaning: 없음
    why: 위험 기준에 걸리지 않은 값을 저장하거나 값을 쓰지 않는 동작이다(B1 Q5.시간 7, C2 무효화). 9-2절 표의 "받은 것"이 곧 이 값이라, 없음이 응답 기록의 위험 표시를 비운다.
    case_refs:
    - B1
    - C2
    evidence_status: requirement_reference
  /properties/value_metadata:
    title: ''
    meaning: 해당 값의 정밀도와 근거. 생략은 미수집이며 exact로 간주하지 않는다.
    why: 정규화·판정·저장·확인 후보·응답 재료에서 정밀도와 근거가 사라지지 않아야 한다.
    case_refs:
    - T1
    - T2
    evidence_status: requirement_reference
  /allOf/0/if/properties/value_metadata:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
    - T1
    evidence_status: requirement_reference
  /allOf/0/if/properties/value_metadata/properties/precision:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
    - T1
    evidence_status: requirement_reference
  /allOf/0/then/properties/value:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
    - T1
    evidence_status: requirement_reference
  /allOf/0/then/properties/value/not:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
