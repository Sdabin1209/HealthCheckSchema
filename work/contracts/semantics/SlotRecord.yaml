definition: SlotRecord
nodes:
  ? ''
  : title: 슬롯 기록
    meaning: 슬롯 하나의 응답 기록. 저장 판단만 쓴다.
    why: 슬롯마다 지금 답, 이전 답, 확인을 기다리는 새 답, 위험 표시를 한곳에 두어야 저장 판단과 결과 전달이 같은 기록을 본다.
    case_refs:
    - B1
    - C1
    evidence_status: requirement_reference
  /properties/slot:
    title: 슬롯
    meaning: 이 답 기록이 속한 문항·반복 행·슬롯의 식별자.
    why: 응답 기록이 슬롯 단위라 기록마다 어느 칸인지 있어야 한다.
    case_refs:
    - B1
    - C1
    evidence_status: requirement_reference
  /properties/current_value:
    title: 현재값
    meaning: 지금 기록.
    why: 결과의 본체이자 열린 문항 계산의 근거.
    case_refs:
    - B1
    - C1
    - C2
    evidence_status: requirement_reference
  /properties/risk_mark:
    title: 위험 표시
    meaning: 현재값의 위험 기준.
    why: 결과 전달용(G4). Plan은 다시 보지 않는다(재개 뒤 같은 답으로 다시 멈추지 않게, G6).
    case_refs:
    - G6b
    - G3
    - G4
    evidence_status: requirement_reference
  /properties/risk_mark/anyOf/1:
    title: ''
    meaning: 없음
    why: 위험 기준에 걸리지 않는 현재값이다(B1 Q5.시간 7, C1 Q2.개비 20). 결과 전달이 이 표시로 위험한 답을 가리므로(G4, H4), 없음이 "결과에 표시할 것 없음"이다.
    case_refs:
    - B1
    - C1
    evidence_status: requirement_reference
  /properties/history:
    title: 이력
    meaning: 오래된 순서의 이전 답 값. 메타데이터를 확보한 이력은 {value, value_metadata}, 미확보 이력은 값만 기록한다.
    why: 수정 이력을 결과로 넘긴다(C1).
    case_refs:
    - C1
    - C2
    - C4a
    evidence_status: requirement_reference
  /properties/pending:
    title: 확인 대기
    meaning: 있으면 하나. 한 슬롯에 최대 하나(모양으로 보장).
    why: 충돌한 새 값을 확인을 받을 때까지 현재값과 따로 둔다. 끝까지 안 풀리면 결과에 풀리지 않은 답으로 넘어간다.
    case_refs:
    - C4a
    - C3
    - C8d
    evidence_status: requirement_reference
  /properties/pending/anyOf/1:
    title: ''
    meaning: 없음
    why: 확인 대기가 없는 슬롯이다(B1, C1). 8-1 규칙 16이 남은 확인 대기를 찾을 때 이 없음이 "물을 것 없음"이 되고, 결과 전달에도 풀리지 않은 답으로 넘어가지 않는다.
    case_refs:
    - B1
    - C1
    evidence_status: requirement_reference
  /properties/value_metadata:
    title: ''
    meaning: 해당 값의 정밀도와 근거. 생략은 미수집이며 exact로 간주하지 않는다.
    why: 정규화·판정·저장·확인 후보·응답 재료에서 정밀도와 근거가 사라지지 않아야 한다.
    case_refs:
    - T1
    - T2
    evidence_status: requirement_reference
  /allOf/0/if/properties/value_metadata:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
    - T1
    evidence_status: requirement_reference
  /allOf/0/if/properties/value_metadata/properties/precision:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
    - T1
    evidence_status: requirement_reference
  /allOf/0/then/properties/current_value:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
    - T1
    evidence_status: requirement_reference
