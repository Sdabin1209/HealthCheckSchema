definition: TextSpan
nodes:
  ? ''
  : title: ''
    meaning: 모델이 읽은 현재 원문의 구절·위치를 표현한다. 턴 번호는 모델이 만들어 낼 필요가 없다.
    why: 모델이 읽은 현재 원문의 구절·위치를 표현한다. 턴 번호는 모델이 만들어 낼 필요가 없다.
    case_refs: &id001
    - T2
    evidence_status: requirement_reference
  /properties/start:
    title: ''
    meaning: 원문에서 근거가 시작하는 포함 위치. 위치 단위는 offset_unit으로 명시한다.
    why: 같은 구절이 원문에 반복되어도 어느 부분을 사용했는지 식별해야 한다.
    case_refs: *id001
    evidence_status: requirement_reference
  /properties/end:
    title: ''
    meaning: 원문에서 근거가 끝나는 제외 위치. start 이상이어야 한다. 순서와 text 길이의 일관성은 정적 자료 무결성 검사로 확인한다.
    why: 원문 근거의 정확한 범위를 복원할 수 있어야 한다.
    case_refs: *id001
    evidence_status: requirement_reference
  /properties/offset_unit:
    title: ''
    meaning: '위치 단위: unicode_code_point, utf16_code_unit, utf8_byte. 서로 다른 런타임의 위치를 조용히 혼용하지 않는다.'
    why: Unicode 문자, UTF-16 코드 단위, UTF-8 바이트 위치는 같은 숫자가 아닐 수 있다.
    case_refs: *id001
    evidence_status: requirement_reference
  /properties/text:
    title: ''
    meaning: 근거 구절 자체. 원문 일치 여부는 원문을 가진 담당자가 확인한다.
    why: 모델이 읽은 현재 원문의 구절·위치를 표현한다. 턴 번호는 모델이 만들어 낼 필요가 없다.
    case_refs: *id001
    evidence_status: requirement_reference
