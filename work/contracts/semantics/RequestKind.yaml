definition: RequestKind
nodes:
  ? ''
  : title: 요청 종류
    meaning: 발화 판정의 요청 하나의 종류.
    why: 진행 조작 넷에 안내·사람을 더해, Plan이 요청을 한 목록으로 다루게 한다.
    case_refs:
    - D1a
    - D2
    - D3a
    - E1a
    - F1
    evidence_status: requirement_reference
  /oneOf/0:
    title: 반복
    meaning: 다시 말해 달라
    why: 직전 말을 다시 들으려는 요청이다. 새로 묻지 않고 같은 말을 되풀이해야 한다.
    case_refs:
    - D1a
    - D1c
    evidence_status: requirement_reference
  /oneOf/1:
    title: 대기
    meaning: 기다려 달라
    why: 잠깐 기다려 달라는 요청이다. 다음 질문으로 재촉하지 않아야 한다.
    case_refs:
    - D2
    evidence_status: requirement_reference
  /oneOf/2:
    title: 나중에
    meaning: 이 문항은 나중에
    why: 지금 문항을 나중에 하겠다는 요청이다. 다른 것을 먼저 묻고 맨 뒤에 다시 묻는다.
    case_refs:
    - D3a
    - N7a
    - N7b
    evidence_status: requirement_reference
  /oneOf/3:
    title: 중단
    meaning: 그만하겠다
    why: 그만하겠다는 요청이다. 잘못 들었을 수 있어 바로 끝내지 않고 확인한다.
    case_refs:
    - D4
    evidence_status: requirement_reference
  /oneOf/4:
    title: 안내
    meaning: 안내 목록의 물음
    why: 안내 목록의 물음이다. 검토된 안내 문장으로 답하고 하던 질문을 잇는다.
    case_refs:
    - E1a
    - E1b
    evidence_status: requirement_reference
  /oneOf/5:
    title: 사람
    meaning: 직원 요청
    why: 직원을 찾는 요청이다. 직원을 부르고 문진은 이어 간다.
    case_refs:
    - F1
    - X8
    evidence_status: requirement_reference
