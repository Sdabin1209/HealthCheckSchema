definition: Action
nodes:
  ? ''
  : title: 행동
    meaning: Plan이 이번 턴에 하기로 한 일. 한 턴에 하나.
    why: 응답 생성기가 이번 턴에 수행할 묻기·확인·안내·종료 행동을 구분하고, 다음 턴의 짧은 답을 어떤 질문에 연결할지 확인할 수 있어야 한다.
    case_refs:
    - A1
    - B2
    - G1
    - H2
    evidence_status: requirement_reference
  /oneOf/0:
    title: 다음 문항 묻기
    meaning: 열린 문항을 묻는다
    why: 열린 문항을 차례로 물어 문진을 진행한다.
    case_refs:
    - A1
    - A2
    - B1
    evidence_status: requirement_reference
  /oneOf/1:
    title: 빠진 슬롯 되묻기
    meaning: 같은 문항의 빠진 필수 슬롯만 묻는다
    why: 같은 문항에서 받은 값은 다시 묻지 않고 빠진 칸만 묻는다.
    case_refs:
    - B2
    - E1c
    - E3b
    evidence_status: requirement_reference
  /oneOf/2:
    title: 구체화 요청
    meaning: 애매한 값을 짚어 다시 묻는다
    why: 애매한 값을 사용자가 한 말 그대로 짚어 하나로 다시 말하게 한다.
    case_refs:
    - B3a
    - B4
    - S2b
    evidence_status: requirement_reference
  /oneOf/3:
    title: 확인 대기 확인
    meaning: 기존 답과 새 답 중 어느 것이 맞는지 묻는다
    why: 표지 없이 다른 값을 말했을 때 잘못 들었을 수 있으므로 기존 답과 새 답 중 어느 것이 맞는지 확인한다.
    case_refs:
    - C3
    - C8b
    - N13
    evidence_status: requirement_reference
  /oneOf/4:
    title: 모름 뒤 재질문
    meaning: 모름에 한 번 더 묻는다
    why: 모름에 한 번 더 기회를 주는 문항이 있다(정책).
    case_refs:
    - B7a
    - S8d
    evidence_status: requirement_reference
  /oneOf/5:
    title: 거절 시 설명 후 재질문
    meaning: 왜 묻는지 설명하고 다시 묻는다
    why: 거절한 사람에게 왜 묻는지 설명하면 답할 수 있다(정책).
    case_refs:
    - B8a
    - S3a
    - N8a
    evidence_status: requirement_reference
  /oneOf/6:
    title: 정정 구체화
    meaning: 무엇을, 어떤 값으로 고칠지 묻는다
    why: 값 없이 고치겠다는 말을 버리면 사용자의 정정 의사가 사라진다(C5, C6)
    case_refs:
    - C5
    - C6a
    - C7a
    evidence_status: requirement_reference
  /oneOf/7:
    title: 종료 확인
    meaning: 마칠지 묻는다
    why: 마친 뒤에는 고칠 수 없으므로 한 번 묻는다(H1, A6)
    case_refs:
    - H1
    - H3a
    - C8d
    evidence_status: requirement_reference
  /oneOf/8:
    title: 중단 확인
    meaning: 정말 그만둘지 묻는다
    why: 잘못 알아들은 "그만"으로 문진이 끝나지 않게(D4)
    case_refs:
    - D4
    - R2
    - S5a
    evidence_status: requirement_reference
  /oneOf/9:
    title: 다시 말씀 요청
    meaning: 알아듣지 못했으니 다시 말해 달라
    why: 알아듣지 못했을 때는 값을 짚는 구체화가 아니라 다시 말해 달라는 말이 필요하다(I1).
    case_refs:
    - I1a
    - J7a
    - N14
    evidence_status: requirement_reference
  /oneOf/10:
    title: 도움 요청
    meaning: 알아듣지 못함이 이어져 직원을 부른다
    why: 알아듣지 못함이 이어지면 시스템이 더 할 수 있는 일이 없어 사람이 와야 한다(F3).
    case_refs:
    - F3
    evidence_status: requirement_reference
  /oneOf/11:
    title: 무관 안내 후 다시 묻기
    meaning: 받아 주고 하던 질문을 잇는다
    why: 문진과 상관없는 말을 받아 준 뒤 하던 질문을 다시 해야 대화가 이어진다.
    case_refs:
    - E4
    - K1
    - K9a
    evidence_status: requirement_reference
  /oneOf/12:
    title: 위험 안내
    meaning: 위급 안내를 하고 멈춘다
    why: 위급한 상황에서는 문진을 멈추고 검토된 안내만 해야 한다(G1, G3).
    case_refs:
    - G1
    - G2
    - G3
    evidence_status: requirement_reference
  /oneOf/13:
    title: 대기 안내
    meaning: 기다리겠다고 한다
    why: 기다려 달라는 사용자에게 다음 질문을 하면 재촉이 된다(D2).
    case_refs:
    - D2
    - R2
    - X5
    evidence_status: requirement_reference
  /oneOf/14:
    title: 사람 연결 안내
    meaning: 직원을 불렀다고 한다
    why: 직원을 불렀다는 것을 사용자에게 알려야 기다린다(F1, F2).
    case_refs:
    - F1
    - F2
    - X8
    evidence_status: requirement_reference
  /oneOf/15:
    title: 종료 인사
    meaning: 마친다
    why: 마칠 때(완료든 미완료든) 인사로 끝내고, 미완료면 문진 중단을 함께 알린다.
    case_refs:
    - A4a
    - D5a
    - F4
    - H2
    evidence_status: requirement_reference
