definition: SessionCommitResult
nodes:
  ? ''
  : title: ''
    meaning: 저장 결과·동시 수정 충돌·반영 여부 미확인을 표현하는 응답 초안이다. 반환·재시도·복구 정책은 저장과 Framework 담당자의 책임이다.
    why: 저장 결과·동시 수정 충돌·반영 여부 미확인을 표현하는 응답 초안이다. 반환·재시도·복구 정책은 저장과 Framework 담당자의 책임이다.
    case_refs: &id001
    - T6
    - T7
    - T10
    evidence_status: requirement_reference
  /properties/session_id:
    title: ''
    meaning: 조회 또는 저장 대상 세션 식별자.
    why: 저장 결과·동시 수정 충돌·반영 여부 미확인을 표현하는 응답 초안이다. 반환·재시도·복구 정책은 저장과 Framework 담당자의 책임이다.
    case_refs: *id001
    evidence_status: requirement_reference
  /properties/status:
    title: ''
    meaning: 이 요청 종류의 처리 결과 코드. 어떤 결과를 반환할지는 저장 담당자의 책임이다.
    why: 저장 결과·동시 수정 충돌·반영 여부 미확인을 표현하는 응답 초안이다. 반환·재시도·복구 정책은 저장과 Framework 담당자의 책임이다.
    case_refs: *id001
    evidence_status: requirement_reference
  /properties/write_outcome:
    title: ''
    meaning: APPLIED(반영 확인), NOT_APPLIED(미반영 확인), UNKNOWN(반영 여부 미확인). 전송 장애를 미반영으로 단정하지 않는다.
    why: 응답을 받지 못했거나 저장 결과가 불명확할 때 중복 저장·잘못된 안내를 막을 근거를 표현해야 한다.
    case_refs: *id001
    evidence_status: requirement_reference
  /properties/revision:
    title: ''
    meaning: 저장소가 보고한 상태 버전 토큰. 답 이력의 revision ID와 다른 개념이다. 생성 규칙과 단조 증가 여부는 정하지 않는다.
    why: 저장 결과·동시 수정 충돌·반영 여부 미확인을 표현하는 응답 초안이다. 반환·재시도·복구 정책은 저장과 Framework 담당자의 책임이다.
    case_refs: *id001
    evidence_status: requirement_reference
  /properties/revision/anyOf/1:
    title: ''
    meaning: 해당 payload 미확보 또는 이 결과에서 해당 없음. 생략과는 구별한다.
    why: 저장 결과·동시 수정 충돌·반영 여부 미확인을 표현하는 응답 초안이다. 반환·재시도·복구 정책은 저장과 Framework 담당자의 책임이다.
    case_refs: *id001
    evidence_status: requirement_reference
  /properties/detail:
    title: ''
    meaning: 진단 설명. null이면 설명 미확보이며 코드의 뜻은 status와 write_outcome으로 읽는다.
    why: 저장 결과·동시 수정 충돌·반영 여부 미확인을 표현하는 응답 초안이다. 반환·재시도·복구 정책은 저장과 Framework 담당자의 책임이다.
