definition: SessionInfo
nodes:
  ? ''
  : title: 세션 정보
    meaning: 세션 식별과 문항 정의 버전.
    why: 세션을 찾고(A3) 버전을 고정한다(J1).
    case_refs:
    - J1
    - A1
    evidence_status: requirement_reference
  /properties/session_id:
    title: 세션 식별
    meaning: 어느 세션의 값인지.
    why: 응답 기록·진행 기록·Plan 기록·로그가 모두 이 식별로 한 세션에 묶인다. 세션 정보를 만들 때 정해져 끝까지 바뀌지 않는다(9-2절
      2).
    case_refs:
    - A3
    - A1
    - A2
    evidence_status: requirement_reference
  /properties/question_bank_version:
    title: 문항 정의 버전
    meaning: 세션을 만들 때의 최신 버전.
    why: 운영 중 새 문항 정의가 등록돼도 진행 중인 세션은 처음 버전으로 끝나야 답과 문항이 어긋나지 않는다.
    case_refs:
    - J1
    evidence_status: requirement_reference
