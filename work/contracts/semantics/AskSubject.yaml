definition: AskSubject
nodes:
  ? ''
  : title: 물은 대상
    meaning: '물은 횟수를 세는 단위: 대상(슬롯·문항) 또는 대상 없는 물음.'
    why: 같은 것을 끝없이 묻지 않게 물음 상한을 적용하려면, 대상이 없는 물음(종료 확인, 중단 확인, 무엇을 고칠지 모르는 정정 구체화)도
      셀 수 있어야 한다(H3, C5).
    case_refs:
    - H1
    - C5
    - D4
    evidence_status: requirement_reference
  /oneOf/1:
    title: 대상 없는 물음
    meaning: 대상이 없는 묻기 행동.
    why: 종료 확인·중단 확인·대상 없는 정정 구체화도 물음 상한까지만 묻도록 셀 단위가 있어야 한다.
    case_refs:
    - H1
    - C5
    - D4
    evidence_status: requirement_reference
  /oneOf/1/properties/untargeted:
    title: 행동
    meaning: 대상 없는 묻기 행동.
    why: 대상 없는 물음도 종류별로 따로 세야 각각 상한을 적용한다.
    case_refs:
    - H1
    - C5
    - D4
    evidence_status: requirement_reference
  /oneOf/1/properties/untargeted/oneOf/0:
    title: 종료 확인
    meaning: 마칠지 물음
    why: 종료 확인을 계속 거부하면 물음 상한에서 도움 요청으로 넘어가도록 따로 센다.
    case_refs:
    - H1
    - C8d
    evidence_status: requirement_reference
  /oneOf/1/properties/untargeted/oneOf/1:
    title: 중단 확인
    meaning: 그만둘지 물음
    why: 중단 확인에 계속 답하지 않으면 물음 상한에서 중단 요청을 놓도록 따로 센다.
    case_refs:
    - D4
    - G8b
    evidence_status: requirement_reference
  /oneOf/1/properties/untargeted/oneOf/2:
    title: 정정 구체화
    meaning: 무엇을 고칠지 물음
    why: 무엇을 고칠지 모르는 정정 구체화도 물음 상한까지만 묻도록 따로 센다.
    case_refs:
    - C5
    - C9b
    - N5a
    evidence_status: requirement_reference
