definition: ProgressRecord
nodes:
  ? ''
  : title: 진행 기록
    meaning: Plan만 쓰는 진행 사실.
    why: 다음에 물을 것을 매 턴 계산하는 데 쓰는 사실(열린 요청·건너뜀·확인 중단·세션 상태)을 둔다. 결정은 저장하지 않는다(원칙 7).
    case_refs:
    - A3
    - C5
    - C8d
    evidence_status: requirement_reference
  /properties/last_directive:
    title: 직전 응답 지시
    meaning: 마지막 턴의 응답 지시. 처음이면 없음.
    why: 발화 해석과 반복 요청에만 쓴다(B5, D1).
    case_refs:
    - B9
    - C4a
    - D1a
    evidence_status: requirement_reference
  /properties/last_directive/anyOf/1:
    title: ''
    meaning: 없음
    why: 아직 아무것도 묻지 않은 세션이다(A1 시작, A2 첫 입력이 말). 9-2절 2의 초기값이 없음이라, 첫 발화를 직전 지시 없이
      해석한다.
    case_refs:
    - A1
    - A2
    evidence_status: requirement_reference
  /properties/open_requests:
    title: 열린 요청
    meaning: 열린 요청.
    why: 고칠 요청·중단 요청·미룸이 다른 말이 끼어도 사라지지 않게 턴 사이에 남긴다.
    case_refs:
    - C9a
    - D5a
    - N5a
    - R20
    evidence_status: requirement_reference
  /properties/skipped:
    title: 건너뜀
    meaning: 건너뛴 문항들.
    why: 건너뛴 문항을 다시 묻지 않고, 결과에 받지 못한 까닭을 남긴다.
    case_refs:
    - X7
    - S3a
    - N11c
    evidence_status: requirement_reference
  /properties/confirm_stopped:
    title: 확인 중단
    meaning: 확인을 그만둔 슬롯들. 확인 대기는 남는다.
    why: 확인을 그만둔 확인 대기를 다시 묻지 않는다. 확인 대기 자체는 결과로 넘어가도록 남긴다.
    case_refs:
    - C8d
    - N6
    evidence_status: requirement_reference
  /properties/session_status:
    title: 세션 상태
    meaning: 세션 상태.
    why: LangGraph가 처리 표로 입력을 처리할지 정하고, 결과 전달이 완료·미완료를 넘긴다.
    case_refs:
    - G5
    - A5
    - G6a
    - J4a
    evidence_status: requirement_reference
  /properties/pause_history:
    title: 중지 이력
    meaning: 일시 중지·재개 기록.
    why: 멈춘 적과 이어 간 적을 결과에 넘긴다.
    case_refs:
    - G7
    evidence_status: requirement_reference
