definition: SessionStatus
nodes:
  ? ''
  : title: 세션 상태
    meaning: 세션이 어디에 있는지.
    why: LangGraph가 입력을 처리할지(처리 표)와, 결과를 받는 쪽이 완료·미완료와 그 사유를 아는 데 쓴다(A4, A5, G5, H2).
    case_refs:
    - G1
    - H2
    - A4a
    - G6a
    evidence_status: requirement_reference
  /oneOf/0:
    title: 진행 중
    meaning: 문진 중
    why: 이 상태에서만 사용자 발화를 처리한다. 멈춤·종료와 구분해야 처리 표가 입력을 받을지 정한다.
    case_refs:
    - G6a
    - G6b
    - H3d
    evidence_status: requirement_reference
  /oneOf/1:
    title: 일시 중지(위험)
    meaning: 위험으로 멈춤. 사용자 발화는 처리하지 않음
    why: 위험으로 멈춘 동안에는 사용자 말을 처리하지 않고 직원의 재개·종료만 받아야 한다.
    case_refs:
    - G1
    - G5
    - J4a
    evidence_status: requirement_reference
  /oneOf/2:
    title: 종료(완료)
    meaning: 마침
    why: 사용자가 마치기로 확인한 정상 종료다. 결과를 받는 쪽이 완료된 결과로 다룬다.
    case_refs:
    - H2
    - J5
    - A5
    evidence_status: requirement_reference
  /oneOf/3:
    title: '종료(미완료: 개입 종료)'
    meaning: 직원이 끝냄
    why: 직원이 끝낸 미완료다. 받는 쪽이 이탈·사용자 중단과 구분해 사유를 안다.
    case_refs:
    - F4
    - G7
    evidence_status: requirement_reference
  /oneOf/4:
    title: '종료(미완료: 이탈)'
    meaning: 사용자가 떠남
    why: 사용자가 떠난 미완료다. 받는 쪽이 사유를 구분한다.
    case_refs:
    - A4a
    - A4b
    evidence_status: requirement_reference
  /oneOf/5:
    title: '종료(미완료: 사용자 중단)'
    meaning: 사용자가 그만둠
    why: 사용자가 그만두기로 확인한 미완료다. 받는 쪽이 사유를 구분한다.
    case_refs:
    - D5a
    evidence_status: requirement_reference
