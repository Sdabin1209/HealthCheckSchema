definition: ItemCheck
nodes:
  ? ''
  : title: 항목별 검사
    meaning: 항목 하나의 값을 표준화하고 검사한 사실.
    why: 값 규칙(단위·범위·선행 조건)을 아는 곳을 이 컴포넌트 하나로 모은다. 상태 판정은 이 사실만 보고 판정한다(값 규칙과 해석 규칙은 바뀌는 이유가 달라 나눴다).
    case_refs:
    - B3a
    - S1a
    - X7
    evidence_status: requirement_reference
  /properties/item_no:
    title: 항목 번호
    meaning: 검사한 항목.
    why: 검사 결과를 상태 판정이 원래 항목(의도·원문)과 다시 이어야 판정할 수 있다.
    case_refs:
    - B1
    - B4
    - N13
    evidence_status: requirement_reference
  /properties/standard_value:
    title: 표준 값
    meaning: 표준화한 값. 문제가 있거나 값 없는 항목이면 없음.
    why: '"한 갑"·"스무 개비"처럼 다르게 말한 같은 값을 하나의 형태로 바꿔야 비교하고 저장할 수 있다.'
    case_refs:
    - A2
    - B1
    - C1
    evidence_status: requirement_reference
  /properties/standard_value/anyOf/1:
    title: ''
    meaning: 없음
    why: 표준화하지 못했거나 표준화할 값이 없는 항목이다(B3a 범위 밖, B3b 단위 없음, C6a 값 없는 정정). 5절 6이 이때 "현재 값과·확인 대기 값과"를 해당 없음으로 정하는 조건이
      바로 이 없음이다.
    case_refs:
    - B3a
    - B3b
    - C6a
    evidence_status: requirement_reference
  /properties/problems:
    title: 문제
    meaning: 찾은 문제들(없으면 빈 목록).
    why: 값을 쓸 수 없는 까닭을 사실로 넘겨야 상태 판정이 애매로 판정하고 Plan이 무엇을 되물을지 안다.
    case_refs:
    - B3a
    - B3b
    - B4
    evidence_status: requirement_reference
  /properties/mismatched_slots:
    title: 맞지 않는 슬롯
    meaning: 문제에 "다른 답과 맞지 않음"이 있을 때, 어느 슬롯의 값과 맞지 않는지.
    why: 되물을 때 두 값을 함께 짚어야 사용자가 어느 쪽을 고칠지 안다(B4).
    case_refs:
    - B4
    - S2b
    - S6a
    evidence_status: requirement_reference
  /properties/vs_current:
    title: 현재 값과
    meaning: 표준 값과 현재값의 비교.
    why: 같음은 정상, 다름은 충돌이나 정정을 가른다(C3).
    case_refs:
    - X7
    - C3
    - C4b
    evidence_status: requirement_reference
  /properties/vs_current/oneOf/0:
    title: 같음
    meaning: 현재값과 같음
    why: 다시 말한 것이라 바꿀 것이 없다
    case_refs:
    - C4b
    evidence_status: requirement_reference
  /properties/vs_current/oneOf/1:
    title: 다름
    meaning: 현재값과 다름
    why: 기존 답과 다르면 정정 표지에 따라 바로 고치거나(정정) 확인을 묻는다(충돌).
    case_refs:
    - C3
    - N6
    - N13
    evidence_status: requirement_reference
  /properties/vs_current/oneOf/2:
    title: 현재 값 없음
    meaning: 현재값이 없음·모름·거절
    why: 값을 말하면 충돌이 아니라 새 답이다(B7 뒤의 답)
    case_refs:
    - X7
    - A2
    - B1
    evidence_status: requirement_reference
  /properties/vs_current/oneOf/3:
    title: 해당 없음
    meaning: 표준 값이 없음
    why: 표준 값이 없으면 비교 자체가 불가능하므로 같음·다름과 구분해 둔다.
    case_refs:
    - B3a
    - B3b
    evidence_status: requirement_reference
  /properties/vs_pending:
    title: 확인 대기 값과
    meaning: 표준 값과 그 슬롯 확인 대기 값의 비교.
    why: 확인 대기 값을 다시 말하면 받아들인 것이다(C4).
    case_refs:
    - C4b
    - N3b
    - N6
    evidence_status: requirement_reference
  /properties/vs_pending/oneOf/0:
    title: 같음
    meaning: 확인 대기 값과 같음
    why: 확인 대기 값을 다시 말하면 그 값을 받아들인 것으로 본다.
    case_refs:
    - N3b
    - N17
    - S2e
    evidence_status: requirement_reference
  /properties/vs_pending/oneOf/1:
    title: 다름
    meaning: 확인 대기 값과 다름
    why: 확인 대기와도 다르면 새 충돌이거나, 기존 값을 다시 말한 경우 확인 대기를 버린다.
    case_refs:
    - C4b
    - N6
    evidence_status: requirement_reference
  /properties/vs_pending/oneOf/2:
    title: 확인 대기 없음
    meaning: 그 슬롯에 확인 대기가 없음
    why: 확인 대기가 없으면 받아들이거나 버릴 것이 없다는 사실을 따로 알려야 상태 판정이 확인 대기 처리를 내지 않는다.
    case_refs:
    - A2
    - C3
    evidence_status: requirement_reference
  /properties/vs_pending/oneOf/3:
    title: 해당 없음
    meaning: 표준 값이 없음
    why: 표준 값이 없으면 비교 자체가 불가능하므로 같음·다름과 구분해 둔다.
    case_refs:
    - C8a
    - B3a
    evidence_status: requirement_reference
  /properties/risk_rule:
    title: 위험 기준
    meaning: 표준 값이 슬롯 위험 기준에 해당하면 그 대응, 아니면 없음.
    why: 값 비교는 이 컴포넌트에서만 하므로, 위험 해당 여부도 여기서 사실로 넘긴다(G3, G4).
    case_refs:
    - G3
    - G4
    evidence_status: requirement_reference
  /properties/risk_rule/anyOf/1:
    title: ''
    meaning: 없음
    why: 위험 기준이 없는 슬롯이거나 값이 기준에 걸리지 않은 항목이다(B1 Q5.시간 7). G4처럼 걸릴 때만 대응이 담기므로, 없음이 "위험에 해당하지 않음"을 사실로 남긴다.
    case_refs:
    - B1
    - B3a
    evidence_status: requirement_reference
  /properties/prerequisite_unmet:
    title: 선행 불충족
    meaning: 후속 문항 항목인데 선행 답이 정해지지 않았거나, 이번 발화에서 충돌이 될 값이거나, 저장할 수 없는 경우.
    why: 후속 답은 선행 답이 정해진 뒤에만 기록한다는 원칙을 값 규칙 쪽에서 판단한다(C2, B4).
    case_refs:
    - S1a
    - S2a
    - S8a
    evidence_status: requirement_reference
  /properties/value_metadata:
    title: ''
    meaning: 해당 값의 정밀도와 근거. 생략은 미수집이며 exact로 간주하지 않는다.
    why: 정규화·판정·저장·확인 후보·응답 재료에서 정밀도와 근거가 사라지지 않아야 한다.
    case_refs:
    - T1
    - T2
    evidence_status: requirement_reference
  /properties/problem_details:
    title: ''
    meaning: problems의 넓은 분류를 보충하는 세부 코드·관련 슬롯·진단 설명. 생략은 세부 설명 미수집이다.
    why: 단위 불명과 모호한 표현 등을 하나의 AMBIGUOUS로 축약해도 원래 사유와 대상은 보존할 수 있어야 한다.
    case_refs:
    - T9
    evidence_status: requirement_reference
  /allOf/0/if/properties/value_metadata:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
    - T1
    evidence_status: requirement_reference
  /allOf/0/if/properties/value_metadata/properties/precision:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
    - T1
    evidence_status: requirement_reference
  /allOf/0/then/properties/standard_value:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
    - T1
    evidence_status: requirement_reference
  /allOf/0/then/properties/standard_value/not:
    title: 메타데이터 일관성
    meaning: exact·approximate 메타데이터는 실제 값이 있는 경우에만 허용한다. 미확보 값에는 unspecified만 사용한다.
    why: 값이 없는데 확정 또는 근사값이 있다고 표현하는 구조적 모순을 거부한다. 입력의 정답이나 정밀도 분류는 판단하지 않는다.
    case_refs:
    - T1
    evidence_status: requirement_reference
