definition: PauseReason
nodes:
  ? ''
  : title: 위험 이유
    meaning: 일시 중지의 이유 하나.
    why: 결과를 받는 쪽이 왜 멈췄는지 안다(G7).
    case_refs:
    - G1
    - G3
    - G7
    evidence_status: requirement_reference
  /oneOf/0:
    title: 위험 신호 이유
    meaning: 위험한 말.
    why: 위험한 말 때문에 멈췄다면 그 원문을 남겨야 의료진이 결과에서 무슨 말이었는지 확인한다.
    case_refs:
    - G1
    - G2
    - G9
    - X9
    - S3c
    evidence_status: requirement_reference
  /oneOf/0/properties/kind:
    title: 종류
    meaning: 위험 신호.
    why: 멈춘 까닭이 위험 신호면 근거(원문)를, 위험 기준이면 대상(슬롯)을 담는다. 담는 칸이 서로 달라 이 값으로 가르지 않으면 중지
      이력을 읽는 쪽이 어느 칸을 봐야 할지 모른다(G1, G3).
    case_refs:
    - G1
    - G2
    - G9
    - X9
    evidence_status: requirement_reference
  /oneOf/0/properties/evidence:
    title: 근거
    meaning: 원문 표현.
    why: 결과를 받는 의료진이 어떤 말 때문에 멈췄는지 원문으로 확인한다.
    case_refs:
    - G1
    - G2
    - G9
    - S3c
    evidence_status: requirement_reference
  /oneOf/1:
    title: 위험 기준 이유
    meaning: 위험한 답.
    why: 위험한 답 때문에 멈췄다면 어느 칸의 답인지 남겨야 의료진이 결과에서 그 답을 찾아 본다.
    case_refs:
    - G3
    evidence_status: requirement_reference
  /oneOf/1/properties/kind:
    title: 위험 기준
    meaning: 위험 기준.
    why: 위험 기준으로 멈춘 이력은 어느 슬롯의 답 때문인지를 남긴다. 위험 신호 이유와 모양이 달라, 이 값이 있어야 결과 전달이 중지 이력을
      원문과 슬롯 중 무엇으로 읽을지 정한다(G3, G6b).
    case_refs:
    - G3
    evidence_status: requirement_reference
  /oneOf/1/properties/target:
    title: 대상
    meaning: 위험 기준에 해당한 슬롯.
    why: 어느 답 때문에 멈췄는지 결과에 남긴다.
    case_refs:
    - G3
    evidence_status: requirement_reference
