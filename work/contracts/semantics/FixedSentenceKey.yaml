definition: FixedSentenceKey
nodes:
  ? ''
  : title: 고정 문장 종류
    meaning: 세션 설정에 등록하는 고정 문장의 종류. 실제 문장 선택·생성은 담당 컴포넌트의 책임이다.
    why: 모델이 지어내면 안 되는 문장(위험 안내 등)과 모델이 실패할 때 그대로 읽을 문장이 필요하다(G1, J7).
    case_refs:
    - G1
    - J3
    evidence_status: requirement_reference
  /oneOf/0:
    title: 다시 말씀 요청
    meaning: 다시 말씀 요청 때 쓰는 문장
    why: 알아듣지 못했을 때 할 말을 검토된 문장으로 등록해 두어야, LoRA-B가 이를 바탕으로 말하고 실패하면 그대로 읽을 수 있다.
    case_refs:
    - J9
    - I1a
    - J7a
    evidence_status: requirement_reference
  /oneOf/1:
    title: 무관 안내
    meaning: 문진 밖 발화에 대응하기 위한 등록 문장의 종류. 적절한 수용·지원 불가 표현의 선택은 응답 담당 컴포넌트의 책임이다.
    why: 문진과 상관없는 말을 받을 때의 말을 검토된 문장으로 등록해 두어야, LoRA-B가 이를 바탕으로 말하고 실패하면 그대로 읽을 수
      있다.
    case_refs:
    - J9
    - E4
    - K1
    evidence_status: requirement_reference
  /oneOf/2:
