definition: PendingId
nodes:
  ? ''
  : title: 확인 대기 ID
    meaning: '저장 판단이 확인 대기를 둘 때 새로 만드는, 세션 안에서 겹치지 않는 값(예: UUID).'
    why: '"네"가 어느 확인 대기에 대한 답인지 상태 판정이 이 ID로 잇는다. 같은 슬롯에 새 충돌 값이 와서 확인 대기가 바뀌면 이전
      확인에 대한 "네"가 새 값을 받아들이지 않게 한다(C4).'
    case_refs:
    - C3
    - C4a
    - N13
    evidence_status: requirement_reference
