definition: SlotDef
nodes:
  ? ''
  : title: 슬롯 정의
    meaning: 문항의 답 칸 하나.
    why: 칸마다 받을 수 있는 값(단위·선택지), 필수 여부, 위험 기준이 정해져 있어야 정규화가 검사하고 Plan이 묻는다.
    case_refs:
    - B1
    - B2
    evidence_status: requirement_reference
  /properties/slot_id:
    title: 슬롯 ID
    meaning: 문항 안의 칸 식별자.
    why: 모든 컴포넌트가 문항 ID와 함께 이 칸을 같은 이름으로 가리킨다.
    case_refs:
    - B1
    - B2
    - B6
    evidence_status: requirement_reference
  /properties/units:
    title: 단위
    meaning: 단위 슬롯의 단위들. 선택지 슬롯이면 빈 목록.
    why: 단위 없는 숫자를 그 단위로 볼지(단위가 하나), 단위를 되물을지(둘 이상) 정하고 환산한다.
    case_refs:
    - B3b
    - C1
    - B3a
    evidence_status: requirement_reference
  /properties/choices:
    title: 선택지
    meaning: 선택지 슬롯의 선택지. 단위 슬롯이면 빈 목록.
    why: 답을 정해진 말로 표준화한다(B1).
    case_refs:
    - B1
    - C8a
    - S7b
    evidence_status: requirement_reference
  /properties/yes_no_map:
    title: 네아니요 대응
    meaning: '"네"·"아니요"가 이 슬롯의 어떤 선택지인지. 예/아니요로 답할 수 있는 선택 슬롯만.'
    why: '"폭음 하세요?"에 "네"는 값이다(B9). 이 정의가 없으면 "네"를 확인 응답과 구분할 수 없다.'
    case_refs:
    - B9
    - S4d
    - N16
    evidence_status: requirement_reference
  /properties/yes_no_map/anyOf/0:
    title: 네아니요 대응 내용
    meaning: 두 선택지.
    why: '"네"와 "아니요"가 각각 어느 선택지인지 둘 다 있어야 한다.'
    case_refs:
    - B9
    - S4d
    - N16
    evidence_status: requirement_reference
  /properties/yes_no_map/anyOf/0/properties/yes:
    title: 네
    meaning: '"네"에 해당하는 선택지.'
    why: '"폭음 하세요?" "네" → 예(B9).'
    case_refs:
    - B9
    - S4d
    evidence_status: requirement_reference
  /properties/yes_no_map/anyOf/0/properties/no:
    title: 아니요
    meaning: '"아니요"에 해당하는 선택지.'
    why: '"술 드세요?" "아니요" → 안 마심.'
    case_refs:
    - N16
    evidence_status: requirement_reference
  /properties/yes_no_map/anyOf/1:
    title: ''
    meaning: 없음
    why: 예·아니요로 답할 수 없는 슬롯이다(Q2.개비, Q5.시간). 4절 3이 이 대응이 있는 슬롯에서만 단독 "네"를 값으로 보므로, 없음이 C4a의 확인 응답 "네"와 B9의 답 "네"를
      가른다.
    case_refs:
    - C3
    - B1
    evidence_status: requirement_reference
  /properties/required:
    title: 필수
    meaning: 꼭 받아야 하는 칸인지.
    why: 열린 문항과 빠진 슬롯을 정한다(B2). 다른 답에 따라 필요 여부가 바뀌는 칸은 같은 문항에 두지 않는다(등록 규칙).
    case_refs:
    - B2
    - H1
    evidence_status: requirement_reference
  /properties/reask_sentence:
    title: 되묻기 문장
    meaning: 이 칸만 다시 물을 때의 문장.
    why: 빠진 칸이나 애매한 칸만 다시 물을 때 쓸 검토된 문장이 칸마다 있어야 한다.
    case_refs:
    - B2
    evidence_status: requirement_reference
  /properties/risk_rule:
    title: 위험 기준
    meaning: 있으면 그 조건과 대응. 없으면 없음.
    why: 답에 따라 바로 멈추거나 결과에 표시해야 하는 칸이 있다. 기준이 정의에 있어야 정규화가 판단한다.
    case_refs:
    - G3
    - G4
    evidence_status: requirement_reference
  /properties/risk_rule/anyOf/1:
    title: ''
    meaning: 없음
    why: 위험 기준이 없는 슬롯이다(Q5.시간, Q2.개비). 기준이 있는 것은 Q6.여부(즉시)와 Q7의 두 칸(결과 표시)뿐이라(G3, G4), 없음이 보통 칸임을 뜻한다.
    case_refs:
    - B1
    - C3
    evidence_status: requirement_reference
  /properties/choice_catalog:
    title: ''
    meaning: 등록된 선택지 코드·표시 이름·표현 목록. 사용하면 choices는 빈 목록이고 yes_no_map은 등록 코드를 참조한다.
    why: 선택지 이름과 안정적인 코드를 따로 정의하고 두 선택지 목록의 우선순위를 모호하게 두지 않아야 한다.
    case_refs:
    - T3
    evidence_status: requirement_reference
  /allOf/0/then/properties/choices:
    title: ''
    meaning: choice_catalog 사용 시 문자열 선택지 목록은 비워 한 정의만 사용한다.
    why: 두 목록이 동시에 선택지 정의의 원본이 되지 않아야 한다.
    case_refs:
    - T3
    evidence_status: requirement_reference
