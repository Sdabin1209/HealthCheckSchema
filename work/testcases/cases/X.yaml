cases:
- id: X1
  상황:
  - B7
  - B2
  설명: B7·B2 문항 전체 모름과 슬롯 답이 함께
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q3b
  input:
    발화: 술은 잘 모르겠는데 소주는 마셔요
  expect:
    LoRA-A:
    - 대상: Q3b.*
      의도: SAYS_UNKNOWN
    - 대상: Q3b.종류
      값: 소주
      의도: ANSWERED_INTENT
    정규화:
      빠진필수슬롯: []
    판정:
    - 대상: Q3b.*
      상태: UNKNOWN
    - 대상: Q3b.종류
      상태: ANSWERED
      이번값: 소주
    저장:
    - 슬롯: Q3b.빈도
      동작: RECORD_UNKNOWN
    - 슬롯: Q3b.1회양
      동작: RECORD_UNKNOWN
    - 슬롯: Q3b.종류
      동작: FIRST_WRITE
      값: 소주
    Plan:
      행동: ASK_NEXT
      대상:
      - Q4
      건너뜀추가:
      - 문항: Q3b
        사유: UNKNOWN_ACCEPTED
  왜: 'B7·B2 문항 전체 모름과 슬롯 답이 함께: 기대값이 판정 Q3b.* UNKNOWN, Q3b.종류 ANSWERED; 저장 Q3b.빈도 RECORD_UNKNOWN, Q3b.1회양 RECORD_UNKNOWN,
    Q3b.종류 FIRST_WRITE; 행동 ASK_NEXT Q4이 되는지 확인한다. 이 상황을 다루는 이유: 모른다는 답은 흔하고 빈 답과 다르게 다뤄야 한다. / 사람은 여러 칸 중 일부만 답하곤
    한다. 받은 것은 저장하고 빠진 것만 물어야 한다. 기대값을 정하는 규칙: 6절 5; 7절 2; 8-1 규칙 11·17.'
- id: X2
  상황:
  - C8
  - B7
  설명: C8c·B7 확인 대기 둘이 있는 문항 전체 모름
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
      Q3b.빈도: 주 2회
      Q3b.종류: 소주
      Q3b.1회양: 1병
    확인대기:
      Q3b.빈도:
        ID: X
        값: 주 4회
      Q3b.1회양:
        ID: Y
        값: 3병
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q3b.빈도
      대상확인대기ID: X
  input:
    발화: 술은 다 잘 모르겠어요
  expect:
    LoRA-A:
    - 대상: Q3b.*
      의도: SAYS_UNKNOWN
    판정:
    - 대상: Q3b.*
      상태: UNKNOWN
      확인대기처리: 버림
      대상확인대기ID:
      - X
      - Y
    저장:
    - 슬롯: Q3b.빈도
      동작: RECORD_UNKNOWN
    - 슬롯: Q3b.종류
      동작: RECORD_UNKNOWN
    - 슬롯: Q3b.1회양
      동작: RECORD_UNKNOWN
    - 슬롯: Q3b.빈도
      동작: DROP_PENDING
      확인대기ID: X
    - 슬롯: Q3b.1회양
      동작: DROP_PENDING
      확인대기ID: Y
    Plan:
      행동: ASK_NEXT
      대상:
      - Q4
      건너뜀추가:
      - 문항: Q3b
        사유: UNKNOWN_ACCEPTED
    뒤:
      답:
        Q3b.빈도: 모름
        Q3b.종류: 모름
        Q3b.1회양: 모름
      확인대기: {}
      이력:
        Q3b.빈도:
        - 주 2회
        Q3b.종류:
        - 소주
        Q3b.1회양:
        - 1병
  왜: 'C8c·B7 확인 대기 둘이 있는 문항 전체 모름: 기대값이 판정 Q3b.* UNKNOWN; 저장 Q3b.빈도 RECORD_UNKNOWN, Q3b.종류 RECORD_UNKNOWN, Q3b.1회양
    RECORD_UNKNOWN, Q3b.빈도 DROP_PENDING, Q3b.1회양 DROP_PENDING; 행동 ASK_NEXT Q4이 되는지 확인한다. 이 상황을 다루는 이유: 확인에 계속 답하지
    않으면 끝없이 묻게 된다. 풀리지 않은 답은 결과에 남겨 의료진이 본다. / 모른다는 답은 흔하고 빈 답과 다르게 다뤄야 한다. 기대값을 정하는 규칙: 6절 5; 7절 1·2; 8-1 규칙 11.'
- id: X3
  상황:
  - C9
  설명: C9 이어 담긴 정정 구체화에서 그만둠
  given:
    직전:
      행동: ASK_REPEAT
    기다리는답:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q2.개비
    열린요청:
      정정요청:
      - 대상: Q2.개비
  input:
    발화: 아니요, 그냥 둘게요
  expect:
    LoRA-A:
    - 의도: CONFIRM_NO
    발화판정:
      확인응답: 거부
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - KEPT_PREVIOUS: null
        슬롯: Q2.개비
        값: 10
  왜: 'C9 이어 담긴 정정 구체화에서 그만둠: 기대값이 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 고치려다 마음을 바꾸는 경우가 있다. 고치지 않고 하던 질문으로 돌아가야
    한다. 기대값을 정하는 규칙: 6절 표; 8-1 규칙 0.'
- id: X4
  상황:
  - C9
  - C1
  설명: C9·C1 "아니"와 새 값이 함께
  given:
    직전:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q2.개비
    열린요청:
      정정요청:
      - 대상: Q2.개비
  input:
    발화: 아니, 스무 개요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 스무 개
      의도: CORRECTION_MARKED
    판정:
    - 대상: Q2.개비
      상태: CORRECTION
      이번값: 20
    저장:
    - 슬롯: Q2.개비
      동작: NEW_REVISION
      값: 20
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q2.개비
        이전: 10
        값: 20
  왜: 'C9·C1 "아니"와 새 값이 함께: 기대값이 판정 Q2.개비 CORRECTION; 저장 Q2.개비 NEW_REVISION; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는
    이유: 고치려다 마음을 바꾸는 경우가 있다. 고치지 않고 하던 질문으로 돌아가야 한다. / 사람은 앞서 한 답을 고친다. 기대값을 정하는 규칙: 4절 2; 6절 1; 8-2 7.'
- id: X5
  상황:
  - C6
  - B6
  - D2
  설명: C6·B6·D2 정정 구체화 중에 다른 답과 대기가 섞임
  steps:
  - given:
      직전:
        행동: ASK_CORRECTION_TARGET
        대상:
        - Q2.개비
      열린요청:
        정정요청:
        - 대상: Q2.개비
    input:
      발화: 잠깐만요, 아 운동은 주 세 번이에요
    expect:
      LoRA-A:
      - 의도: PROGRESS_OP
        진행조작: WAIT
      - 대상: Q8.횟수
        값: 주 세 번
        의도: ANSWERED_INTENT
      판정:
      - 대상: Q8.횟수
        상태: ANSWERED
        이번값: 주 3회
      저장:
      - 슬롯: Q8.횟수
        동작: FIRST_WRITE
        값: 주 3회
      Plan:
        행동: WAIT_NOTICE
        기다리는답:
          행동: ASK_CORRECTION_TARGET
          대상:
          - Q2.개비
  - input:
      발화: 열다섯 개요
    expect:
      LoRA-A:
      - 대상: Q2.개비
        값: 열다섯 개
        의도: CORRECTION_MARKED
      판정:
      - 대상: Q2.개비
        상태: CORRECTION
        이번값: 15
      저장:
      - 슬롯: Q2.개비
        동작: NEW_REVISION
        값: 15
      Plan:
        행동: ASK_NEXT
        대상:
        - Q5
        알릴것:
        - CORRECTION_ACK: null
          슬롯: Q2.개비
          이전: 10
          값: 15
  왜: 'C6·B6·D2 정정 구체화 중에 다른 답과 대기가 섞임: 기대값이 판정 Q8.횟수 ANSWERED; 저장 Q8.횟수 FIRST_WRITE; 행동 WAIT_NOTICE → 판정 Q2.개비 CORRECTION;
    저장 Q2.개비 NEW_REVISION; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 고치겠다고만 하고 값을 말하지 않는 경우가 있다. 값을 물어야 고칠 수 있다. /
    사람은 묻지 않은 것까지 한꺼번에 말한다. 버리면 나중에 또 물어야 한다. / 수첩을 찾는 등 잠깐 기다려 달라는 사람에게 재촉하면 안 된다. 기대값을 정하는 규칙: 8-1 규칙 5; 8-2 1(규칙
    7); 4절 2.'
- id: X6
  상황:
  - C4
  설명: C4 이미 풀린 확인 대기를 가리키는 "네"(상태 판정 단위 테스트)
  given:
    답:
      Q2.개비: 20
    확인대기: {}
    직전:
      행동: ASK_REPEAT
    기다리는답:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
  input:
    발화: 네
  expect:
    LoRA-A:
    - 의도: CONFIRM_YES
    발화판정:
      결과: OUT_OF_SCOPE_ONLY
  비고: '정상 흐름에서는 기다리는 답을 새로 정하므로 생기지 않는다. 고침: 상태 판정 하나만 떼어 보는 케이스라 Plan은 확인하지 않는다. 그런데 비교 규칙의 "엄격 필드는 적지 않았으면 없음과
    비교한다"가 걸려 "Plan 없음"을 주장하는 꼴이 됐고, 독립 검증자는 규칙대로 Plan(무관 안내 후 다시 묻기)을 도출해 어긋났다. 범위를 적어 엄격 필드 기본값이 범위 밖에는 걸리지 않게
    한다.'
  왜: 'C4 이미 풀린 확인 대기를 가리키는 "네"(상태 판정 단위 테스트): 케이스의 기대값을 확인한다. 이 상황을 다루는 이유: 확인을 물었으면 그 답으로 어느 값을 남길지 정해야 한다. 기대값을
    정하는 규칙: 6절 표(확인 대기 ID 없음 → 무관).'
  범위:
  - LoRA-A
  - 발화판정
- id: X7
  상황:
  - B7
  설명: B7 모름 뒤에 값을 말함
  given:
    답:
      Q2.개비: 모름
    건너뜀:
    - 문항: Q2
      사유: UNKNOWN_ACCEPTED
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 담배는 열다섯 개 정도요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 열다섯 개
      의도: ANSWERED_INTENT
    정규화:
      항목별검사:
      - 현재값과: 현재 값 없음
    판정:
    - 대상: Q2.개비
      상태: ANSWERED
      이번값: 15
    저장:
    - 슬롯: Q2.개비
      동작: FIRST_WRITE
      값: 15
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      건너뜀해제:
      - Q2
  왜: 'B7 모름 뒤에 값을 말함: 기대값이 판정 Q2.개비 ANSWERED; 저장 Q2.개비 FIRST_WRITE; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 모른다는
    답은 흔하고 빈 답과 다르게 다뤄야 한다. 기대값을 정하는 규칙: 5절 5; 6절 1; 7절 1; 8-2 8.'
- id: X8
  상황:
  - F1
  설명: F1 잘못된 대상이 붙은 사람 요청(상태 판정 단위 테스트)
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 직원 불러 주세요
  주입:
    LoRA-A원출력:
    - 대상: Q99.*
      원문표현: 직원 불러 주세요
      의도: USER_CALLED_STAFF
  expect:
    발화판정:
      결과: REQUEST_ONLY
      요청:
      - 종류: STAFF_REQUEST
        원문표현:
        - 직원 불러 주세요
    Plan:
      행동: STAFF_NOTICE
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
      직원알림:
        종류: 사람 요청
        이유:
        - 사람 요청: null
          근거:
          - 직원 불러 주세요
  왜: 'F1 잘못된 대상이 붙은 사람 요청(상태 판정 단위 테스트): 기대값이 행동 STAFF_NOTICE이 되는지 확인한다. 이 상황을 다루는 이유: 직원을 찾는 사람에게 직원이 와야 한다. 기대값을
    정하는 규칙: 6절 8; 8-1 규칙 2.'
- id: X9
  상황:
  - G1
  설명: G1 잘못된 대상이 붙은 위험 신호(상태 판정 단위 테스트)
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 가슴이 쥐어짜듯 해요
  주입:
    LoRA-A원출력:
    - 대상: Q99.*
      원문표현: 가슴이 쥐어짜듯 해요
      의도: RISK_SIGNAL
  expect:
    발화판정:
      위험신호:
        근거:
        - 가슴이 쥐어짜듯 해요
    Plan:
      행동: RISK_NOTICE
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
      세션상태: PAUSED_RISK
      중지이력추가:
      - 종류: 일시 중지
        이유:
        - 위험 신호: null
          근거:
          - 가슴이 쥐어짜듯 해요
      직원알림:
        종류: 위험
        이유:
        - 위험 신호: null
          근거:
          - 가슴이 쥐어짜듯 해요
  왜: 'G1 잘못된 대상이 붙은 위험 신호(상태 판정 단위 테스트): 기대값이 행동 RISK_NOTICE; 세션 상태 PAUSED_RISK이 되는지 확인한다. 이 상황을 다루는 이유: 위급한 말에는
    문진보다 먼저 멈추고 사람을 불러야 한다. 기대값을 정하는 규칙: 6절 8; 8-1 규칙 1.'
