cases:
- id: G1
  상황:
  - G1
  설명: G1 지금 위급하다는 말
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 숨이 안 쉬어져요
  expect:
    LoRA-A:
    - 의도: RISK_SIGNAL
    발화판정:
      위험신호:
        근거:
        - 숨이 안 쉬어져요
    Plan:
      행동: RISK_NOTICE
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
      세션상태: PAUSED_RISK
      중지이력추가:
      - 종류: 일시 중지
        이유:
        - 위험 신호: null
          근거:
          - 숨이 안 쉬어져요
      직원알림:
        종류: 위험
        이유:
        - 위험 신호: null
          근거:
          - 숨이 안 쉬어져요
    LoRA-B조건:
    - 사용자 말을 받아 주는 말을 붙이지 않는다
    - 문장 재료의 위험 안내 문장대로 말한다
    사람개입입력:
      직원알림:
        세션식별: 이 세션
      턴실패신호: 없음
      개입결정결과: 없음
  왜: 'G1 지금 위급하다는 말: 기대값이 행동 RISK_NOTICE; 세션 상태 PAUSED_RISK이 되는지 확인한다. 이 상황을 다루는 이유: 위급한 말에는 문진보다 먼저 멈추고 사람을 불러야
    한다. 기대값을 정하는 규칙: 8-1 규칙 1; 8-2 1.'
- id: G2
  상황:
  - G2
  설명: G2 모델이 놓친 위급한 말
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 아이고 가슴이 너무 아파서…
  주입:
    LoRA-A원출력:
    - 의도: OUT_OF_SCOPE
  expect:
    발화판정:
      위험신호:
        근거:
        - 가슴이 너무 아파
    Plan:
      행동: RISK_NOTICE
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
      세션상태: PAUSED_RISK
      중지이력추가:
      - 종류: 일시 중지
        이유:
        - 위험 신호: null
          근거:
          - 가슴이 너무 아파
      직원알림:
        종류: 위험
        이유:
        - 위험 신호: null
          근거:
          - 가슴이 너무 아파
  비고: 정답 라벨은 위험 신호다. 이 케이스는 상태 판정 이후 단위 테스트.
  왜: 'G2 모델이 놓친 위급한 말: 기대값이 행동 RISK_NOTICE; 세션 상태 PAUSED_RISK이 되는지 확인한다. 이 상황을 다루는 이유: 모델이 위급한 말을 놓칠 수 있으므로 한 번
    더 거르는 장치가 필요하다. 기대값을 정하는 규칙: 6절 위험 표현 대조; 8-1 규칙 1.'
- id: G3
  상황:
  - G3
  설명: G3 답 자체가 즉시 위험
  given:
    답:
      Q5.시간: 7
    직전:
      행동: ASK_NEXT
      대상:
      - Q6
  input:
    발화: 예
  expect:
    LoRA-A:
    - 대상: Q6.여부
      값: 예
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q6.여부
      상태: ANSWERED
      이번값: 예
      위험기준: IMMEDIATE
    저장:
    - 슬롯: Q6.여부
      동작: FIRST_WRITE
      값: 예
      위험표시: 즉시
    Plan:
      행동: RISK_NOTICE
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q7
      세션상태: PAUSED_RISK
      중지이력추가:
      - 종류: 일시 중지
        이유:
        - 위험 기준: null
          대상:
          - Q6.여부
      직원알림:
        종류: 위험
        이유:
        - 위험 기준: null
          대상:
          - 문항: Q6
            문항이름: 죽고 싶은 생각
            슬롯: 여부
            값: 예
  왜: 'G3 답 자체가 즉시 위험: 기대값이 판정 Q6.여부 ANSWERED; 저장 Q6.여부 FIRST_WRITE; 행동 RISK_NOTICE; 세션 상태 PAUSED_RISK이 되는지 확인한다.
    이 상황을 다루는 이유: 답 자체가 즉시 위험한 문항(죽고 싶은 생각)이 있다. 기대값을 정하는 규칙: 5절 7; 6절 1; 7절 1; 8-1 규칙 1; 8-2 1.'
- id: G4
  상황:
  - G4
  설명: G4 답이 결과 표시 위험
  given:
    답:
      Q5.시간: 7
      Q6.여부: 아니요
    직전:
      행동: ASK_NEXT
      대상:
      - Q7
  input:
    발화: 백구십에 백십이요
  expect:
    LoRA-A:
    - 대상: Q7.수축기
      값: 백구십
      의도: ANSWERED_INTENT
    - 대상: Q7.이완기
      값: 백십
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q7.수축기
      상태: ANSWERED
      이번값: 190
      위험기준: ON_RESULT
    - 대상: Q7.이완기
      상태: ANSWERED
      이번값: 110
      위험기준: ON_RESULT
    저장:
    - 슬롯: Q7.수축기
      동작: FIRST_WRITE
      값: 190
      위험표시: 결과 표시
    - 슬롯: Q7.이완기
      동작: FIRST_WRITE
      값: 110
      위험표시: 결과 표시
    Plan:
      행동: ASK_NEXT
      대상:
      - Q8
  왜: 'G4 답이 결과 표시 위험: 기대값이 판정 Q7.수축기 ANSWERED, Q7.이완기 ANSWERED; 저장 Q7.수축기 FIRST_WRITE, Q7.이완기 FIRST_WRITE; 행동 ASK_NEXT
    Q8이 되는지 확인한다. 이 상황을 다루는 이유: 위험하지만 바로 멈출 정도는 아닌 답은 결과에 표시해 의료진이 본다. 기대값을 정하는 규칙: 7절 1; 8-1 규칙 17.'
- id: G5
  상황:
  - G5
  설명: G5 멈춘 동안 사용자가 말함
  given:
    세션: 일시 중지(위험)
  input:
    발화: 언제 와요?
  expect:
    LangGraph:
      처리: 처리 안 함
      대화로그:
        입력:
          종류: UTTERANCE
          발화: 있음
          개입결정: 없음
        처리: 처리 안 함
        턴결과: 해당 없음
        LoRA-A출력: 없음
        정규화출력: 없음
        판정출력: 없음
        저장출력: 없음
        응답지시: 없음
        흐름: 없음
        진행기록갱신: 없음
        직원알림: 없음
        응답문장: 없음
        직원알림전달: 해당 없음
        턴실패신호: 없음
        개입결정결과: 없음
    응답: 없음
  왜: 'G5 멈춘 동안 사용자가 말함: 기대값이 처리 처리 안 함이 되는지 확인한다. 이 상황을 다루는 이유: 멈춘 동안의 말을 처리하면 위급 상황에서 문진이 이어진다. 기대값을 정하는 규칙: 9-1절
    처리 표; 9-1절 3.'
- id: G6a
  상황:
  - G6
  설명: G6 재개(응급 신호로 멈췄던 경우)
  given:
    세션: 일시 중지(위험)
    직전:
      행동: RISK_NOTICE
    기다리는답:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    개입: 재개
  expect:
    LangGraph:
      턴종류: RESUME
      개입결정결과: 반영됨
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - RESUME: null
      세션상태: IN_PROGRESS
      중지이력추가:
      - 종류: 재개
  왜: 'G6 재개(응급 신호로 멈췄던 경우): 기대값이 행동 ASK_NEXT Q5; 세션 상태 IN_PROGRESS이 되는지 확인한다. 이 상황을 다루는 이유: 위험이 지나가면 멈춘 곳부터 이어 가야
    하고, 같은 답으로 다시 멈추면 안 된다. 기대값을 정하는 규칙: 8-3절 2.'
- id: G6b
  상황:
  - G6
  설명: G6 재개(답이 즉시 위험이라 멈췄던 경우)
  given:
    세션: 일시 중지(위험)
    답:
      Q5.시간: 7
      Q6.여부: 예
    위험표시:
      Q6.여부: 즉시
    직전:
      행동: RISK_NOTICE
    기다리는답:
      행동: ASK_NEXT
      대상:
      - Q7
  input:
    개입: 재개
  expect:
    LangGraph:
      턴종류: RESUME
      개입결정결과: 반영됨
    Plan:
      행동: ASK_NEXT
      대상:
      - Q7
      알릴것:
      - RESUME: null
      세션상태: IN_PROGRESS
      중지이력추가:
      - 종류: 재개
  왜: 'G6 재개(답이 즉시 위험이라 멈췄던 경우): 기대값이 행동 ASK_NEXT Q7; 세션 상태 IN_PROGRESS이 되는지 확인한다. 이 상황을 다루는 이유: 위험이 지나가면 멈춘 곳부터
    이어 가야 하고, 같은 답으로 다시 멈추면 안 된다. 기대값을 정하는 규칙: 8-1 규칙 1 왜; 8-3절 2.'
- id: G7
  상황:
  - G7
  설명: G7 의료진이 끝냄
  given:
    세션: 일시 중지(위험)
    중지이력:
    - 종류: 일시 중지
      이유:
      - 위험 신호: null
        근거:
        - 숨이 안 쉬어져요
  input:
    개입: 종료
  expect:
    LangGraph:
      턴종류: INTERVENTION_END
      결과전달호출: true
      개입결정결과: 반영됨
    Plan:
      행동: FAREWELL
      알릴것:
      - SURVEY_STOPPED: null
      세션상태: ENDED_STAFF
      흐름: END
    결과전달입력:
      중지이력:
      - 종류: 일시 중지
  왜: 'G7 의료진이 끝냄: 기대값이 행동 FAREWELL; 세션 상태 ENDED_STAFF이 되는지 확인한다. 이 상황을 다루는 이유: 의료진이 문진을 끝내면 받은 데까지 결과가 넘어가야 한다.
    기대값을 정하는 규칙: 9-1절 처리 표; 8-3절 3.'
- id: G8a
  상황:
  - G8
  설명: G8 위급한 말과 대기 요청이 함께
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 잠깐만요, 숨이 안 쉬어져요
  expect:
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: WAIT
    - 의도: RISK_SIGNAL
      원문: 숨이 안 쉬어져요
    Plan:
      행동: RISK_NOTICE
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
      세션상태: PAUSED_RISK
      중지이력추가:
      - 종류: 일시 중지
        이유:
        - 위험 신호: null
          근거:
          - 숨이 안 쉬어져요
      직원알림:
        종류: 위험
        이유:
        - 위험 신호: null
          근거:
          - 숨이 안 쉬어져요
  왜: 'G8 위급한 말과 대기 요청이 함께: 기대값이 행동 RISK_NOTICE; 세션 상태 PAUSED_RISK이 되는지 확인한다. 이 상황을 다루는 이유: 위급한 말이 다른 요청과 함께 오면 위험이
    먼저다. 기대값을 정하는 규칙: 8-1 규칙 1.'
- id: G8b
  상황:
  - G8
  설명: G8 그만하기 승낙과 위급한 말이 함께
  given:
    직전:
      행동: ASK_STOP
    열린요청:
      중단요청: 예
  input:
    발화: 네 그만할게요… 가슴이 너무 아파요
  expect:
    LoRA-A:
    - 의도: CONFIRM_YES
    - 의도: RISK_SIGNAL
      원문: 가슴이 너무 아파요
    Plan:
      행동: RISK_NOTICE
      기다리는답:
        행동: ASK_STOP
      세션상태: PAUSED_RISK
      중지이력추가:
      - 종류: 일시 중지
        이유:
        - 위험 신호: null
          근거:
          - 가슴이 너무 아파요
      직원알림:
        종류: 위험
        이유:
        - 위험 신호: null
          근거:
          - 가슴이 너무 아파요
    LangGraph:
      결과전달호출: false
  왜: 'G8 그만하기 승낙과 위급한 말이 함께: 기대값이 행동 RISK_NOTICE; 세션 상태 PAUSED_RISK이 되는지 확인한다. 이 상황을 다루는 이유: 위급한 말이 다른 요청과 함께 오면
    위험이 먼저다. 기대값을 정하는 규칙: 8-1 규칙 1; 8-2 1.'
- id: G9
  상황:
  - G9
  설명: G9 과거 증상이 위험 표현에 걸림
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 예전에 숨이 안 쉬어진 적 있어요
  expect:
    LoRA-A:
    - 의도: OUT_OF_SCOPE
    발화판정:
      위험신호:
        근거:
        - 숨이 안
    Plan:
      행동: RISK_NOTICE
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
      세션상태: PAUSED_RISK
      중지이력추가:
      - 종류: 일시 중지
        이유:
        - 위험 신호: null
          근거:
          - 숨이 안
      직원알림:
        종류: 위험
        이유:
        - 위험 신호: null
          근거:
          - 숨이 안
  왜: 'G9 과거 증상이 위험 표현에 걸림: 기대값이 행동 RISK_NOTICE; 세션 상태 PAUSED_RISK이 되는지 확인한다. 이 상황을 다루는 이유: 과거 증상도 위험 표현에 걸릴 수 있다.
    놓치는 쪽이 더 위험하므로 거르지 않는다. 기대값을 정하는 규칙: 4절 6; 8-1 규칙 1.'
- id: G10
  상황:
  - G4
  - C3
  - C4
  설명: G4 위험 슬롯의 충돌 값이 확인 대기로 갔다가 받아들여짐
  steps:
  - given:
      답:
        Q5.시간: 7
        Q6.여부: 아니요
        Q7.수축기: 120
        Q7.이완기: 80
      직전:
        행동: ASK_NEXT
        대상:
        - Q8
    input:
      발화: 혈압 위는 백구십이요
    expect:
      LoRA-A:
      - 대상: Q7.수축기
        값: 백구십
        의도: ANSWERED_INTENT
      정규화:
        항목별검사:
        - 대상: Q7.수축기
          표준값: 190
          현재값과: 다름
          위험기준: ON_RESULT
      판정:
      - 대상: Q7.수축기
        상태: CONFLICT
        이번값: 190
        위험기준: ON_RESULT
        확인대기처리: 새로 둠
      저장:
      - 슬롯: Q7.수축기
        동작: SET_PENDING
        확인대기ID: X
        값: 190
