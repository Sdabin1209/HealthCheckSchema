cases:
- id: R1
  상황:
  - B2
  - B10
  설명: B2·B10 빠진 슬롯을 계속 채우지 않음(시도 상한)
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
      Q3b.종류: 소주
    직전:
      행동: ASK_MISSING
      대상:
      - Q3b.빈도
      - Q3b.1회양
    Plan기록:
      시도횟수:
        Q3b: 2
  input:
    발화: 소주요
  expect:
    LoRA-A:
    - 대상: Q3b.종류
      값: 소주
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q3b.종류
      상태: ANSWERED
      이번값: 소주
    - 대상: Q3b.빈도
      상태: MISSING
      사유:
      - 필수 슬롯 누락
    - 대상: Q3b.1회양
      상태: MISSING
      사유:
      - 필수 슬롯 누락
    저장: []
    Plan:
      행동: ASK_NEXT
      대상:
      - Q4
      건너뜀추가:
      - 문항: Q3b
        사유: ATTEMPTS_EXCEEDED
  왜: 'B2·B10 빠진 슬롯을 계속 채우지 않음(시도 상한): 기대값이 판정 Q3b.종류 ANSWERED, Q3b.빈도 MISSING, Q3b.1회양 MISSING; 저장 없음; 행동 ASK_NEXT
    Q4이 되는지 확인한다. 이 상황을 다루는 이유: 사람은 여러 칸 중 일부만 답하곤 한다. 받은 것은 저장하고 빠진 것만 물어야 한다. / 계속 쓸 수 있는 답이 안 나오면 끝없이 묻게 된다.
    기대값을 정하는 규칙: 6절 1; 8-1 규칙 6b/10; 8-2 2.'
- id: R2
  상황:
  - D5
  - D2
  설명: D5·D2 그만하기를 거부하며 기다려 달라고 함
  steps:
  - given:
      직전:
        행동: ASK_NEXT
        대상:
        - Q5
    input:
      발화: 그만할래요
    expect:
      LoRA-A:
      - 의도: PROGRESS_OP
        진행조작: STOP
      Plan:
        행동: ASK_STOP
  - input:
      발화: 아니요 계속할게요, 잠깐만요
    expect:
      LoRA-A:
      - 의도: CONFIRM_NO
      - 의도: PROGRESS_OP
        진행조작: WAIT
      Plan:
        행동: WAIT_NOTICE
        기다리는답:
          행동: ASK_NEXT
          대상:
          - Q5
  왜: 'D5·D2 그만하기를 거부하며 기다려 달라고 함: 기대값이 행동 ASK_STOP → 행동 WAIT_NOTICE이 되는지 확인한다. 이 상황을 다루는 이유: 그만하기 확인의 답에 따라 미완료로
    끝내거나 이어 가야 한다. / 수첩을 찾는 등 잠깐 기다려 달라는 사람에게 재촉하면 안 된다. 기대값을 정하는 규칙: 8-1 규칙 0·5.'
- id: R3
  상황:
  - C9
  - F1
  설명: C9·F1 고치기를 그만두며 직원을 찾음
  given:
    직전:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q2.개비
      말할값:
      - 슬롯: Q2.개비
        값: 10
        역할: 현재값
    열린요청:
      정정요청:
      - 대상: Q2.개비
  input:
    발화: 아니요 됐어요, 직원 불러 주세요
  expect:
    LoRA-A:
    - 의도: CONFIRM_NO
    - 의도: USER_CALLED_STAFF
      원문: 직원 불러 주세요
    Plan:
      행동: STAFF_NOTICE
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
      알릴것:
      - KEPT_PREVIOUS: null
        슬롯: Q2.개비
        값: 10
      직원알림:
        종류: 사람 요청
        이유:
        - 사람 요청: null
          근거:
          - 직원 불러 주세요
  왜: 'C9·F1 고치기를 그만두며 직원을 찾음: 기대값이 행동 STAFF_NOTICE이 되는지 확인한다. 이 상황을 다루는 이유: 고치려다 마음을 바꾸는 경우가 있다. 고치지 않고 하던 질문으로
    돌아가야 한다. / 직원을 찾는 사람에게 직원이 와야 한다. 기대값을 정하는 규칙: 8-1 규칙 0·2.'
- id: R4
  상황:
  - D5
  - C6
  설명: D5·C6 고치는 중 그만하기를 거부하고 다른 답을 함
  steps:
  - given:
      직전:
        행동: ASK_CORRECTION_TARGET
        대상:
        - Q2.개비
        말할값:
        - 슬롯: Q2.개비
          값: 10
          역할: 현재값
      열린요청:
        정정요청:
        - 대상: Q2.개비
    input:
      발화: 그만할래요
    expect:
      LoRA-A:
      - 의도: PROGRESS_OP
        진행조작: STOP
      Plan:
        행동: ASK_STOP
  - input:
      발화: 아니요 계속할게요, 수면은 일곱 시간이요
    expect:
      LoRA-A:
      - 의도: CONFIRM_NO
      - 대상: Q5.시간
        값: 일곱 시간
        의도: ANSWERED_INTENT
      판정:
      - 대상: Q5.시간
        상태: ANSWERED
        이번값: 7
      저장:
      - 슬롯: Q5.시간
        동작: FIRST_WRITE
        값: 7
      Plan:
        행동: ASK_CORRECTION_TARGET
        대상:
        - Q2.개비
        말할값:
        - 슬롯: Q2.개비
          값: 10
          역할: 현재값
        열린요청:
          중단요청: 아니요
  왜: 'D5·C6 고치는 중 그만하기를 거부하고 다른 답을 함: 기대값이 행동 ASK_STOP → 판정 Q5.시간 ANSWERED; 저장 Q5.시간 FIRST_WRITE; 행동 ASK_CORRECTION_TARGET
    Q2.개비이 되는지 확인한다. 이 상황을 다루는 이유: 그만하기 확인의 답에 따라 미완료로 끝내거나 이어 가야 한다. / 고치겠다고만 하고 값을 말하지 않는 경우가 있다. 값을 물어야 고칠 수
    있다. 기대값을 정하는 규칙: 8-1 규칙 0·7.'
- id: R5
  상황:
  - D3
  - C2
  설명: D3·C2 미룬 정정의 문항이 무효화됨
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
    열린요청:
      미룸:
      - 종류: 정정 요청
        대상: Q2.개비
  input:
    발화: 사실 담배 끊었어요
  expect:
    LoRA-A:
    - 대상: Q1.상태
      값: 끊었어요
      의도: CORRECTION_MARKED
    판정:
    - 대상: Q1.상태
      상태: CORRECTION
      이번값: 끊음
    무효화대상문항:
    - Q2
    저장:
    - 슬롯: Q2.개비
      동작: INVALIDATE
    - 슬롯: Q1.상태
      동작: NEW_REVISION
      값: 끊음
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q1.상태
        이전: 현재 피움
        값: 끊음
      열린요청:
        미룸: []
  왜: 'D3·C2 미룬 정정의 문항이 무효화됨: 기대값이 판정 Q1.상태 CORRECTION; 저장 Q2.개비 INVALIDATE, Q1.상태 NEW_REVISION; 행동 ASK_NEXT Q5이
    되는지 확인한다. 이 상황을 다루는 이유: 어떤 문항은 나중에 답하고 싶어 한다. 버리지 않고 마지막에 다시 물어야 한다. / 선행 답을 고치면 그에 딸린 후속 답이 모순이 된다(술을 안 마시는데
    음주량이 남음). 기대값을 정하는 규칙: 6절 6; 8-2 7.'
- id: R6
  상황:
  - F1
  - C6
  설명: F1·C6 직원 요청과 값 없는 고침이 함께
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 직원 불러 주세요, 그리고 흡연량 고칠래요
  expect:
    LoRA-A:
    - 의도: USER_CALLED_STAFF
      원문: 직원 불러 주세요
    - 대상: Q2.개비
      의도: CORRECTION_MARKED
    Plan:
      행동: STAFF_NOTICE
      기다리는답:
        행동: ASK_CORRECTION_TARGET
        대상:
        - Q2.개비
      직원알림:
        종류: 사람 요청
        이유:
        - 사람 요청: null
          근거:
          - 직원 불러 주세요
  왜: 'F1·C6 직원 요청과 값 없는 고침이 함께: 기대값이 행동 STAFF_NOTICE이 되는지 확인한다. 이 상황을 다루는 이유: 직원을 찾는 사람에게 직원이 와야 한다. / 고치겠다고만 하고
    값을 말하지 않는 경우가 있다. 값을 물어야 고칠 수 있다. 기대값을 정하는 규칙: 8-1 규칙 2; 8-2 1.'
- id: R7
  상황:
  - C4
  설명: C4 확인에 "네"와 "아니요"가 함께(라벨이 둘을 냄)
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
  input:
    발화: 네 아니 아니요
  주입:
    LoRA-A원출력:
    - 의도: CONFIRM_YES
    - 의도: CONFIRM_NO
  expect:
    판정: []
    발화판정:
      결과: OUT_OF_SCOPE_ONLY
    Plan:
      행동: REDIRECT
      기다리는답:
        행동: ASK_CONFIRM
        대상:
        - Q2.개비
        대상확인대기ID: X
  왜: 'C4 확인에 "네"와 "아니요"가 함께(라벨이 둘을 냄): 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 확인을 물었으면 그 답으로 어느 값을 남길지 정해야 한다.
    기대값을 정하는 규칙: 6절 4; 8-1 규칙 13·8·16.'
- id: R8
  상황:
  - D1
  - C4
  설명: D1·C4 확인을 다시 말해 달라고 함(확인 횟수로 세지 않음)
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
      말할값:
      - 슬롯: Q2.개비
        값: 10
        역할: 현재값
      - 슬롯: Q2.개비
        값: 20
        역할: 확인 대기 값
  input:
    발화: 다시 말해 주세요
  expect:
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: REPEAT
    Plan:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
    Plan기록:
      확인횟수:
        Q2.개비: 1
  왜: 'D1·C4 확인을 다시 말해 달라고 함(확인 횟수로 세지 않음): 기대값이 행동 ASK_CONFIRM Q2.개비이 되는지 확인한다. 이 상황을 다루는 이유: 음성 대화에서 못 들었다는 말은
    흔하다. 같은 말을 다시 들려줘야 한다. / 확인을 물었으면 그 답으로 어느 값을 남길지 정해야 한다. 기대값을 정하는 규칙: 8-1 규칙 4; 8-2 3; 헤더 기본값(확인횟수 1).'
- id: R9
  상황:
  - C4
  - C6
  설명: C4·C6 확인을 거부하며 그 답을 고치겠다고 함
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
  input:
    발화: 아니요, 흡연량 고칠래요
  expect:
    LoRA-A:
    - 의도: CONFIRM_NO
    - 대상: Q2.개비
      의도: CORRECTION_MARKED
    판정:
    - 대상: Q2.개비
      상태: 없음
      확인대기처리: 버림
      대상확인대기ID:
      - X
    저장:
    - 슬롯: Q2.개비
      동작: DROP_PENDING
      확인대기ID: X
    발화판정:
      값없는정정요청:
      - 대상: Q2.개비
    Plan:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q2.개비
      말할값:
      - 슬롯: Q2.개비
        값: 10
        역할: 현재값
      알릴것:
      - KEPT_PREVIOUS: null
        슬롯: Q2.개비
        값: 10
  왜: 'C4·C6 확인을 거부하며 그 답을 고치겠다고 함: 기대값이 판정 Q2.개비 없음; 저장 Q2.개비 DROP_PENDING; 행동 ASK_CORRECTION_TARGET Q2.개비이 되는지
    확인한다. 이 상황을 다루는 이유: 확인을 물었으면 그 답으로 어느 값을 남길지 정해야 한다. / 고치겠다고만 하고 값을 말하지 않는 경우가 있다. 값을 물어야 고칠 수 있다. 기대값을 정하는
    규칙: 6절 표·4; 7절 1; 8-2 7·10; 8-1 규칙 7.'
- id: R10
  상황:
  - C8
  - B7
  설명: C8·X1 확인 중 애매한 값과 문항 전체 모름이 함께
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
      Q3b.빈도: 주 2회
      Q3b.종류: 소주
      Q3b.1회양: 1병
    확인대기:
      Q3b.빈도:
        ID: X
        값: 주 4회
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q3b.빈도
      대상확인대기ID: X
  input:
    발화: 두세 번? 술은 잘 모르겠어요
  expect:
    LoRA-A:
    - 대상: Q3b.빈도
      값: 두세 번
      의도: ANSWERED_INTENT
    - 대상: Q3b.*
      의도: SAYS_UNKNOWN
    판정:
    - 대상: Q3b.빈도
      상태: UNCLEAR
      사유:
      - 모호함
      이번에말한값: 두세 번
    - 대상: Q3b.*
      상태: UNKNOWN
    저장:
    - 슬롯: Q3b.종류
      동작: RECORD_UNKNOWN
    - 슬롯: Q3b.1회양
      동작: RECORD_UNKNOWN
    Plan:
      행동: ASK_CONFIRM
      대상:
      - Q3b.빈도
      대상확인대기ID: X
  왜: 'C8·X1 확인 중 애매한 값과 문항 전체 모름이 함께: 기대값이 판정 Q3b.빈도 UNCLEAR, Q3b.* UNKNOWN; 저장 Q3b.종류 RECORD_UNKNOWN, Q3b.1회양 RECORD_UNKNOWN;
    행동 ASK_CONFIRM Q3b.빈도이 되는지 확인한다. 이 상황을 다루는 이유: 확인에 계속 답하지 않으면 끝없이 묻게 된다. 풀리지 않은 답은 결과에 남겨 의료진이 본다. / 모른다는 답은
    흔하고 빈 답과 다르게 다뤄야 한다. 기대값을 정하는 규칙: 5절 2(범위 값은 모호함 하나만); 6절 1·5; 8-1 규칙 8.'
- id: R11
  상황:
  - B7
  - E2
  설명: B7·E2 모름과 진행 질문이 함께(남은 수는 이번 턴 반영 뒤)
  given:
    직전:
      행동: ASK_NEXT
