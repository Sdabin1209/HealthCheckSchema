cases:
- id: A1
  상황:
  - A1
  설명: A1 시작
  given:
    세션: 없음
  input:
    신호: 세션 시작
  expect:
    LangGraph:
      세션정보생성: true
      턴종류: SESSION_START
      대화로그:
        입력:
          종류: SESSION_START
          발화: 없음
          개입결정: 없음
        처리: SESSION_START
        턴결과: 확정
        LoRA-A출력: 없음
        정규화출력: 없음
        판정출력: 없음
        저장출력: 없음
        응답지시: 있음
        흐름: CONTINUE
        진행기록갱신: 있음
        직원알림: 없음
        응답문장: 있음
        직원알림전달: 해당 없음
        턴실패신호: 없음
        개입결정결과: 없음
    Plan:
      행동: ASK_NEXT
      대상:
      - Q1
  왜: 'A1 시작: 기대값이 행동 ASK_NEXT Q1이 되는지 확인한다. 이 상황을 다루는 이유: 문진은 키오스크 앞에서 말 없이 시작될 수 있다. 시작 신호만으로 첫 질문을 할 수 있어야 한다.
    기대값을 정하는 규칙: 9-1절 처리 표; 8-3절 1; 8-1 규칙 17.'
- id: A2
  상황:
  - A2
  설명: A2 첫 입력이 말
  given:
    세션: 없음
  input:
    발화: 담배 안 피워요
  expect:
    LangGraph:
      세션정보생성: true
      턴종류: UTTERANCE
      대화로그:
        입력:
          종류: UTTERANCE
          발화: 있음
          개입결정: 없음
        처리: UTTERANCE
        문항정의버전: 1
    LoRA-A:
    - 대상: Q1.상태
      값: 안 피워요
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q1.상태
      상태: ANSWERED
      이번값: 안 피움
    저장:
    - 슬롯: Q1.상태
      동작: FIRST_WRITE
      값: 안 피움
    Plan:
      행동: ASK_NEXT
      대상:
      - Q3a
    뒤:
      답:
        Q1.상태: 안 피움
  왜: 'A2 첫 입력이 말: 기대값이 판정 Q1.상태 ANSWERED; 저장 Q1.상태 FIRST_WRITE; 행동 ASK_NEXT Q3a이 되는지 확인한다. 이 상황을 다루는 이유: 사용자는 시작
    버튼 없이 바로 답부터 말할 수 있다. 그 말을 버리면 다시 말하게 해야 한다. 기대값을 정하는 규칙: 9-1절 처리 표; 6절 1; 7절 1; 8-1 규칙 17.'
- id: A3
  상황:
  - A3
  설명: A3 다시 접속
  given:
    기본: 없음
    답:
      Q1.상태: 현재 피움
    직전:
      행동: ASK_NEXT
      대상:
      - Q2
  input:
    신호: 세션 시작
  expect:
    LangGraph:
      턴종류: SESSION_START
    Plan:
      행동: ASK_NEXT
      대상:
      - Q2
  왜: 'A3 다시 접속: 기대값이 행동 ASK_NEXT Q2이 되는지 확인한다. 이 상황을 다루는 이유: 연결이 끊겼다 다시 붙는 일은 키오스크에서 흔하다. 처음부터 다시 물으면 이미 한 답을 또
    말해야 한다. 기대값을 정하는 규칙: 9-1절 처리 표; 8-3절 1; 8-1 규칙 17.'
- id: A4a
  상황:
  - A4
  설명: A4 떠남
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    신호: 세션 종료
  expect:
    LangGraph:
      턴종류: END_LEFT
      결과전달호출: true
    Plan:
      행동: FAREWELL
      알릴것:
      - SURVEY_STOPPED: null
      세션상태: ENDED_LEFT
      흐름: END
    결과전달입력:
      세션정보:
        문항정의버전: 1
      세션상태: ENDED_LEFT
      응답기록: 받은 데까지(기본 상태의 Q1~Q4)
      건너뜀: []
      확인중단: []
      중지이력: []
  왜: 'A4 떠남: 기대값이 행동 FAREWELL; 세션 상태 ENDED_LEFT이 되는지 확인한다. 이 상황을 다루는 이유: 사용자는 말없이 떠날 수 있다. 그때까지 받은 답이 넘어가지 않으면 버려진다.
    기대값을 정하는 규칙: 9-1절 처리 표; 8-3절 4.'
- id: A4b
  상황:
  - A4
  설명: A4 대기 중에 떠남
  given:
    직전:
      행동: WAIT_NOTICE
    기다리는답:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    신호: 세션 종료
  expect:
    LangGraph:
      턴종류: END_LEFT
      결과전달호출: true
    Plan:
      행동: FAREWELL
      알릴것:
      - SURVEY_STOPPED: null
      세션상태: ENDED_LEFT
      흐름: END
  왜: 'A4 대기 중에 떠남: 기대값이 행동 FAREWELL; 세션 상태 ENDED_LEFT이 되는지 확인한다. 이 상황을 다루는 이유: 사용자는 말없이 떠날 수 있다. 그때까지 받은 답이 넘어가지
    않으면 버려진다. 기대값을 정하는 규칙: 9-1절 처리 표; 8-3절 4.'
- id: A5
  상황:
  - A5
  설명: A5 끝난 세션에 말이 들어옴
  given:
    세션: 종료(완료)
  input:
    발화: 저 담배 안 피워요
  expect:
    LangGraph:
      처리: 처리 안 함
      대화로그: 없음
    응답: 없음
  왜: 'A5 끝난 세션에 말이 들어옴: 기대값이 처리 처리 안 함이 되는지 확인한다. 이 상황을 다루는 이유: 끝난 키오스크 앞에서 다음 사람이 말할 수 있다. 이 말이 앞사람의 결과에 섞이면 안
    된다. 기대값을 정하는 규칙: 9-1절 처리 표; 9-1절 3.'
- id: A6
  상황:
  - A6
  설명: A6 마친 직후 같은 사람이 고치려 함
  given:
    세션: 종료(완료)
  input:
    발화: 아 잠깐, 아까 거 틀렸어요
  expect:
    LangGraph:
      처리: 처리 안 함
      대화로그: 없음
    응답: 없음
  왜: 'A6 마친 직후 같은 사람이 고치려 함: 기대값이 처리 처리 안 함이 되는지 확인한다. 이 상황을 다루는 이유: 마친 직후 고치려는 사람이 있지만, 이미 넘긴 결과를 바꾸면 받는 쪽 기록과
    어긋난다. 그래서 마치기 전에 한 번 묻는다. 기대값을 정하는 규칙: 9-1절 처리 표; 9-1절 3.'
