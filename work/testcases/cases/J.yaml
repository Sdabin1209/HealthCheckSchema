cases:
- id: J1
  상황:
  - J1
  설명: J1 문진 중 문항 정의가 바뀜
  given:
    세션정보:
      문항정의버전: 1
    등록된최신버전: 2
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 일곱 시간이요
  expect:
    LoRA-A:
    - 대상: Q5.시간
      값: 일곱 시간
      의도: ANSWERED_INTENT
    LangGraph:
      사용하는문항정의버전: 1
    판정:
    - 대상: Q5.시간
      상태: ANSWERED
      이번값: 7
    저장:
    - 슬롯: Q5.시간
      동작: FIRST_WRITE
      값: 7
    Plan:
      행동: ASK_NEXT
      대상:
      - Q6
  왜: 'J1 문진 중 문항 정의가 바뀜: 기대값이 판정 Q5.시간 ANSWERED; 저장 Q5.시간 FIRST_WRITE; 행동 ASK_NEXT Q6이 되는지 확인한다. 이 상황을 다루는 이유: 운영
    중 문항 정의가 바뀌어도 진행 중인 세션의 답과 문항이 어긋나면 안 된다. 기대값을 정하는 규칙: OrchestratorInput 계약; 8-1 규칙 17.'
- id: J2
  상황:
  - J2
  설명: J2 처리 중 실패(쓰기 확정 전)
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 일곱 시간이요
  주입:
    실패: Plan 결정
  expect:
    LoRA-A:
    - 대상: Q5.시간
      값: 일곱 시간
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q5.시간
      상태: ANSWERED
      이번값: 7
    저장:
    - 슬롯: Q5.시간
      동작: FIRST_WRITE
      값: 7
    LangGraph:
      턴실패신호:
        쓰기확정: 안 됨
        직원알림: 없음
        받는쪽:
        - 프론트
        - 사람 개입
        세션식별: 이 세션
      대화로그: '턴 결과 실패(확정 전: Plan 결정)'
    뒤: 응답 기록·진행 기록·Plan 기록 바뀌지 않음(대화 로그만 추가)
  왜: 'J2 처리 중 실패(쓰기 확정 전): 기대값이 판정 Q5.시간 ANSWERED; 저장 Q5.시간 FIRST_WRITE이 되는지 확인한다. 이 상황을 다루는 이유: 처리 중 실패하면 사용자와
    직원이 알아야 대처한다. 기대값을 정하는 규칙: 0-1절 2; TurnFailureSignal.'
- id: J3
  상황:
  - J3
  설명: J3 직원 호출이 전달되지 않음
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 숨이 안 쉬어져요
  주입:
    실패: 직원 알림 전달
  expect:
    LoRA-A:
    - 의도: RISK_SIGNAL
    Plan:
      행동: RISK_NOTICE
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
      세션상태: PAUSED_RISK
      중지이력추가:
      - 종류: 일시 중지
        이유:
        - 위험 신호: null
          근거:
          - 숨이 안 쉬어져요
      직원알림:
        종류: 위험
        이유:
        - 위험 신호: null
          근거:
          - 숨이 안 쉬어져요
    응답: 나감
    LangGraph:
      턴실패신호:
        쓰기확정: 됨
        직원알림: 전달 실패
        받는쪽:
        - 프론트
        - 사람 개입
      대화로그:
        처리: UTTERANCE
        턴결과:
          실패단계:
          - 시점: 확정 뒤
            단계: 직원 알림 전달
        응답지시: 있음
        진행기록갱신: 있음
        직원알림: 있음
        응답문장: 있음
        직원알림전달: 실패
        턴실패신호: 있음
  왜: 'J3 직원 호출이 전달되지 않음: 기대값이 행동 RISK_NOTICE; 세션 상태 PAUSED_RISK이 되는지 확인한다. 이 상황을 다루는 이유: 직원 호출이 실패하면 직원이 오지 않는다는
    것을 프론트가 알아야 한다. 기대값을 정하는 규칙: 0-1절 3; 8-1 규칙 1.'
- id: J4a
  상황:
  - J4
  설명: J4 재개 처리 중 실패
  given:
    세션: 일시 중지(위험)
  input:
    개입: 재개
  주입:
    실패: Plan 결정
  expect:
    LangGraph:
      개입결정결과: 반영 안 됨(실패)
      턴실패신호:
        쓰기확정: 안 됨
        직원알림: 없음
        받는쪽:
        - 프론트
        - 사람 개입
        세션식별: 이 세션
      개입결정결과값:
        세션식별: 이 세션
        결과: 반영 안 됨(실패)
    뒤:
      세션상태: PAUSED_RISK
  왜: 'J4 재개 처리 중 실패: 케이스의 기대값을 확인한다. 이 상황을 다루는 이유: 직원이 보낸 결정이 반영됐는지 직원이 알아야 다시 보낸다. 기대값을 정하는 규칙: 0-1절 2; InterventionResult.'
- id: J4b
  상황:
  - J4
  설명: J4 끝난 세션에 종료를 보냄
  given:
    세션: 종료(완료)
  input:
    개입: 종료
  expect:
    LangGraph:
      처리: 처리 안 함
      개입결정결과: 반영 안 됨(처리 안 함)
      개입결정결과값:
        세션식별: 이 세션
        결과: 반영 안 됨(처리 안 함)
  왜: 'J4 끝난 세션에 종료를 보냄: 기대값이 처리 처리 안 함이 되는지 확인한다. 이 상황을 다루는 이유: 직원이 보낸 결정이 반영됐는지 직원이 알아야 다시 보낸다. 기대값을 정하는 규칙: 9-1절
    처리 표.'
- id: J5
  상황:
  - J5
  설명: J5 결과 전달 실패
  given:
    답:
      기본: 없음
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
      Q5.시간: 7
      Q6.여부: 아니요
      Q7.수축기: 120
      Q7.이완기: 80
      Q8.횟수: 주 3회
    직전:
      행동: ASK_FINISH
  input:
    발화: 네
  주입:
    실패: 결과 전달
  expect:
    LoRA-A:
    - 의도: CONFIRM_YES
    Plan:
      행동: FAREWELL
      세션상태: ENDED_COMPLETE
      흐름: END
    전달기록:
    - 성공여부: 실패
  왜: 'J5 결과 전달 실패: 기대값이 행동 FAREWELL; 세션 상태 ENDED_COMPLETE이 되는지 확인한다. 이 상황을 다루는 이유: 결과 전달이 실패하면 다시 보낼 수 있게 기록돼야 한다.
    기대값을 정하는 규칙: 8-1 규칙 6; DispatchRecord.'
- id: J6
  상황:
  - J6
  설명: J6 문제 원인 추적
  성질: 처리한 모든 턴의 대화 로그 항목에 그 턴의 경계 값(항목 목록 ~ 응답 문장)이 남는다. 모든 케이스에서 확인한다.
  왜: 'J6 문제 원인 추적: 처리한 모든 턴의 대화 로그 항목에 그 턴의 경계 값(항목 목록 ~ 응답 문장)이 남는다. 모든 케이스에서 확인한다. 이 상황을 다루는 이유: 결과가 틀렸다는 신고가
    오면 어느 단계가 틀렸는지 가려야 한다. 기대값을 정하는 규칙: 0-1절 2; LogEntry.'
- id: J7a
  상황:
  - J7
  설명: J7 LoRA-A 형식이 깨짐
