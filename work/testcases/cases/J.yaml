  expect:
    LoRA-A: []
    발화판정:
      결과: UNRECOGNIZED_TURN
    Plan:
      행동: ASK_REPEAT
      되물을이유:
      - UNRECOGNIZED
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
  왜: 'J7 LoRA-A 형식이 깨짐: 기대값이 행동 ASK_REPEAT이 되는지 확인한다. 이 상황을 다루는 이유: 모델 출력은 깨질 수 있다. 깨져도 대화가 이어지고 지어낸 말이 나가지 않아야
    한다. 기대값을 정하는 규칙: 4절 대체 출력; 8-1 규칙 14.'
