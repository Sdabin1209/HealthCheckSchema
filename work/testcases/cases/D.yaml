cases:
- id: D1a
  상황:
  - D1
  설명: D1 다시 말해 달라
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 네? 뭐라고요?
  expect:
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: REPEAT
    발화판정:
      결과: REQUEST_ONLY
      요청:
      - 종류: REPEAT
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
  왜: 'D1 다시 말해 달라: 기대값이 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 음성 대화에서 못 들었다는 말은 흔하다. 같은 말을 다시 들려줘야 한다. 기대값을 정하는
    규칙: 8-1 규칙 4.'
- id: D1b
  상황:
  - D1
  설명: D1 첫 입력이 "뭐라고요?"
  given:
    세션: 없음
  input:
    발화: 네? 뭐라고요?
  expect:
    LangGraph:
      세션정보생성: true
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: REPEAT
    Plan:
      행동: ASK_NEXT
      대상:
      - Q1
  왜: 'D1 첫 입력이 "뭐라고요?": 기대값이 행동 ASK_NEXT Q1이 되는지 확인한다. 이 상황을 다루는 이유: 음성 대화에서 못 들었다는 말은 흔하다. 같은 말을 다시 들려줘야 한다. 기대값을
    정하는 규칙: 9-1절 처리 표; 8-1 규칙 4.'
- id: D1c
  상황:
  - D1
  설명: D1 되묻기와 답이 함께
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 네? 아, 일곱 시간이요
  expect:
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: REPEAT
    - 대상: Q5.시간
      값: 일곱 시간
      의도: ANSWERED_INTENT
    발화판정:
      결과: HAS_ANSWER
      요청:
      - 종류: REPEAT
    판정:
    - 대상: Q5.시간
      상태: ANSWERED
      이번값: 7
    저장:
    - 슬롯: Q5.시간
      동작: FIRST_WRITE
      값: 7
    Plan:
      행동: ASK_NEXT
      대상:
      - Q6
  왜: 'D1 되묻기와 답이 함께: 기대값이 판정 Q5.시간 ANSWERED; 저장 Q5.시간 FIRST_WRITE; 행동 ASK_NEXT Q6이 되는지 확인한다. 이 상황을 다루는 이유: 음성 대화에서
    못 들었다는 말은 흔하다. 같은 말을 다시 들려줘야 한다. 기대값을 정하는 규칙: UtteranceResult; 8-1 규칙 17.'
- id: D2
  상황:
  - D2
  설명: D2 기다려 달라
  given:
    답:
      Q5.시간: 7
      Q6.여부: 아니요
    직전:
      행동: ASK_NEXT
      대상:
      - Q7
  input:
    발화: 잠깐만요, 수첩 좀 찾고요
  expect:
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: WAIT
    발화판정:
      결과: REQUEST_ONLY
      요청:
      - 종류: WAIT
    Plan:
      행동: WAIT_NOTICE
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q7
  왜: 'D2 기다려 달라: 기대값이 행동 WAIT_NOTICE이 되는지 확인한다. 이 상황을 다루는 이유: 수첩을 찾는 등 잠깐 기다려 달라는 사람에게 재촉하면 안 된다. 기대값을 정하는 규칙: 8-1
    규칙 5; 8-2 1.'
- id: D3a
  상황:
  - D3
  설명: D3 나중에
  given:
    답:
      Q5.시간: 7
    직전:
      행동: ASK_NEXT
      대상:
      - Q6
  input:
    발화: 이건 이따 할게요
  expect:
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: LATER
    발화판정:
      결과: REQUEST_ONLY
      요청:
      - 종류: LATER
        대상문항: Q6
    Plan:
      행동: ASK_NEXT
      대상:
      - Q7
      알릴것:
      - DEFERRED: null
        문항: Q6
  왜: 'D3 나중에: 기대값이 행동 ASK_NEXT Q7이 되는지 확인한다. 이 상황을 다루는 이유: 어떤 문항은 나중에 답하고 싶어 한다. 버리지 않고 마지막에 다시 물어야 한다. 기대값을 정하는
    규칙: 6절 7; 8-1 규칙 17(미룸).'
- id: D3b
  상황:
  - D3
  설명: D3 미룬 문항은 마지막에 묻는다
  given:
    답:
      Q5.시간: 7
      Q7.수축기: 120
      Q7.이완기: 80
      Q3c#소주.양: 2병
    직전:
      행동: ASK_NEXT
      대상:
      - Q8
    열린요청:
      미룸:
      - 종류: 문항
        대상: Q6
  input:
    발화: 주 세 번이요
  expect:
    LoRA-A:
    - 대상: Q8.횟수
      값: 주 세 번
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q8.횟수
      상태: ANSWERED
      이번값: 주 3회
    저장:
    - 슬롯: Q8.횟수
      동작: FIRST_WRITE
      값: 주 3회
    Plan:
      행동: ASK_NEXT
      대상:
      - Q6
  왜: 'D3 미룬 문항은 마지막에 묻는다: 기대값이 판정 Q8.횟수 ANSWERED; 저장 Q8.횟수 FIRST_WRITE; 행동 ASK_NEXT Q6이 되는지 확인한다. 이 상황을 다루는 이유:
    어떤 문항은 나중에 답하고 싶어 한다. 버리지 않고 마지막에 다시 물어야 한다. 기대값을 정하는 규칙: 8-1 규칙 17(미룬 문항 맨 뒤).'
  비고: '고침: 문항 정의에 반복 문항 Q3c(주종별 음주량)가 생겼다. 음주한다고 답한 세션에서는 Q3c도 열린 문항이라, 이 케이스가 의도한 "남은 문항이 Q6뿐"을 만들려면 given에 Q3c
    답이 있어야 한다.'
- id: D3c
  상황:
  - D3
  설명: D3 마지막 남은 문항을 미룸
  given:
    답:
      Q5.시간: 7
      Q7.수축기: 120
      Q7.이완기: 80
      Q8.횟수: 주 3회
      Q3c#소주.양: 2병
    직전:
      행동: ASK_NEXT
      대상:
      - Q6
  input:
    발화: 이건 이따 할게요
  expect:
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: LATER
    Plan:
      행동: ASK_NEXT
      대상:
      - Q6
      알릴것:
      - DEFERRED: null
        문항: Q6
    LoRA-B조건:
    - 남은 질문이 이것뿐이라 지금 여쭙는다는 뜻을 말한다
  왜: 'D3 마지막 남은 문항을 미룸: 기대값이 행동 ASK_NEXT Q6이 되는지 확인한다. 이 상황을 다루는 이유: 어떤 문항은 나중에 답하고 싶어 한다. 버리지 않고 마지막에 다시 물어야 한다.
    기대값을 정하는 규칙: 8-1 규칙 17.'
  비고: '고침: D3b와 같다. 반복 문항 Q3c가 열려 있으면 다음 대상이 Q6이 아니다.'
- id: D4
  상황:
  - D4
  설명: D4 그만하겠다
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 그만할래요
  expect:
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: STOP
    발화판정:
      결과: REQUEST_ONLY
      요청:
      - 종류: STOP
    Plan:
      행동: ASK_STOP
  왜: 'D4 그만하겠다: 기대값이 행동 ASK_STOP이 되는지 확인한다. 이 상황을 다루는 이유: 그만하겠다는 사람이 있다. 잘못 들었을 수 있어 확인한다. 기대값을 정하는 규칙: 8-1 규칙 3.'
- id: D5a
  상황:
  - D5
  설명: D5 그만하기 확인에 "네"
  given:
    직전:
      행동: ASK_STOP
    열린요청:
      중단요청: 예
  input:
    발화: 네
  expect:
    LoRA-A:
    - 의도: CONFIRM_YES
    발화판정:
      결과: HAS_ANSWER
      확인응답: 승낙
    Plan:
      행동: FAREWELL
      알릴것:
      - SURVEY_STOPPED: null
      세션상태: ENDED_USER_STOP
      흐름: END
    LangGraph:
      결과전달호출: true
  왜: 'D5 그만하기 확인에 "네": 기대값이 행동 FAREWELL; 세션 상태 ENDED_USER_STOP이 되는지 확인한다. 이 상황을 다루는 이유: 그만하기 확인의 답에 따라 미완료로 끝내거나
    이어 가야 한다. 기대값을 정하는 규칙: 8-1 규칙 6.'
- id: D5b
  상황:
  - D5
  설명: D5 그만하기 확인에 "아니요"
  given:
    직전:
      행동: ASK_STOP
    열린요청:
      중단요청: 예
  input:
    발화: 아니요, 계속할게요
  expect:
    LoRA-A:
    - 의도: CONFIRM_NO
    발화판정:
      확인응답: 거부
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
  왜: 'D5 그만하기 확인에 "아니요": 기대값이 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 그만하기 확인의 답에 따라 미완료로 끝내거나 이어 가야 한다. 기대값을 정하는
    규칙: 8-1 규칙 0·17.'
