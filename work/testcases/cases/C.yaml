cases:
- id: C1
  상황:
  - C1
  설명: C1 분명히 고침
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 아까 열 개 아니고 스무 개요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 스무 개
      의도: CORRECTION_MARKED
    판정:
    - 대상: Q2.개비
      상태: CORRECTION
      이번값: 20
    저장:
    - 슬롯: Q2.개비
      동작: NEW_REVISION
      값: 20
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q2.개비
        이전: 10
        값: 20
    뒤:
      답:
        Q2.개비: 20
      이력:
        Q2.개비:
        - 10
  왜: 'C1 분명히 고침: 기대값이 판정 Q2.개비 CORRECTION; 저장 Q2.개비 NEW_REVISION; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 사람은 앞서
    한 답을 고친다. 기대값을 정하는 규칙: 6절 1; 7절 1; 8-2 10; 8-1 규칙 17.'
- id: C2
  상황:
  - C2
  설명: C2 고친 답 때문에 뒤 문항이 무효
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 저 사실 술 안 마셔요
  expect:
    LoRA-A:
    - 대상: Q3a.여부
      값: 안 마셔요
      의도: CORRECTION_MARKED
    판정:
    - 대상: Q3a.여부
      상태: CORRECTION
      이번값: 안 마심
    무효화대상문항:
    - Q3b
    - Q4
    저장:
    - 슬롯: Q3b.빈도
      동작: INVALIDATE
    - 슬롯: Q3b.종류
      동작: INVALIDATE
    - 슬롯: Q3b.1회양
      동작: INVALIDATE
    - 슬롯: Q4.여부
      동작: INVALIDATE
    - 슬롯: Q3a.여부
      동작: NEW_REVISION
      값: 안 마심
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q3a.여부
        이전: 마심
        값: 안 마심
    뒤:
      답:
        Q3a.여부: 안 마심
        Q3b.빈도: 없음
        Q3b.종류: 없음
        Q3b.1회양: 없음
        Q4.여부: 없음
      이력:
        Q3a.여부:
        - 마심
        Q3b.빈도:
        - 주 2회
        Q3b.종류:
        - 소주
        Q3b.1회양:
        - 1병
        Q4.여부:
        - 예
  왜: 'C2 고친 답 때문에 뒤 문항이 무효: 기대값이 판정 Q3a.여부 CORRECTION; 저장 Q3b.빈도 INVALIDATE, Q3b.종류 INVALIDATE, Q3b.1회양 INVALIDATE,
    Q4.여부 INVALIDATE, Q3a.여부 NEW_REVISION; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 선행 답을 고치면 그에 딸린 후속 답이 모순이 된다(술을
    안 마시는데 음주량이 남음). 기대값을 정하는 규칙: 6절 1·6; 7절 1(무효화 먼저); 8-2 10; 8-1 규칙 17.'
- id: C3
  상황:
  - C3
  설명: C3 앞 답과 다른 말(고친다는 말 없음)
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 담배는 스무 개 피워요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 스무 개
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q2.개비
      상태: CONFLICT
      이번값: 20
      확인대기처리: 새로 둠
    저장:
    - 슬롯: Q2.개비
      동작: SET_PENDING
      확인대기ID: X
      값: 20
    Plan:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
      말할값:
      - 슬롯: Q2.개비
        값: 10
        역할: 현재값
      - 슬롯: Q2.개비
        값: 20
        역할: 확인 대기 값
  왜: 'C3 앞 답과 다른 말(고친다는 말 없음): 기대값이 판정 Q2.개비 CONFLICT; 저장 Q2.개비 SET_PENDING; 행동 ASK_CONFIRM Q2.개비이 되는지 확인한다. 이 상황을
    다루는 이유: 표지 없이 다른 값을 말하면 잘못 들었을 수도 있다. 기대값을 정하는 규칙: 6절 1·2; 7절 1·3; 8-1 규칙 15; 8-2 11.'
- id: C4a
  상황:
  - C4
  설명: C4 확인에 "네"
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
  input:
    발화: 네
  expect:
    LoRA-A:
    - 의도: CONFIRM_YES
    판정:
    - 대상: Q2.개비
      상태: 없음
      확인대기처리: 받아들임
      대상확인대기ID:
      - X
    저장:
    - 슬롯: Q2.개비
      동작: ACCEPT_PENDING
      확인대기ID: X
      값: 20
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q2.개비
        이전: 10
        값: 20
    뒤:
      답:
        Q2.개비: 20
      확인대기: {}
      이력:
        Q2.개비:
        - 10
  왜: 'C4 확인에 "네": 기대값이 판정 Q2.개비 없음; 저장 Q2.개비 ACCEPT_PENDING; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 확인을 물었으면 그
    답으로 어느 값을 남길지 정해야 한다. 기대값을 정하는 규칙: 6절 표(확인-긍정); 7절 1; 8-2 10.'
- id: C4b
  상황:
  - C4
  설명: C4 확인에 "아니요, 열 개 맞아요"
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
  input:
    발화: 아니요, 열 개 맞아요
  expect:
    LoRA-A:
    - 의도: CONFIRM_NO
    - 대상: Q2.개비
      값: 열 개
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q2.개비
      상태: ANSWERED
      이번값: 10
      확인대기처리: 버림
      대상확인대기ID:
      - X
    저장:
    - 슬롯: Q2.개비
      동작: DROP_PENDING
      확인대기ID: X
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - KEPT_PREVIOUS: null
        슬롯: Q2.개비
        값: 10
    뒤:
      확인대기: {}
  왜: 'C4 확인에 "아니요, 열 개 맞아요": 기대값이 판정 Q2.개비 ANSWERED; 저장 Q2.개비 DROP_PENDING; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는
    이유: 확인을 물었으면 그 답으로 어느 값을 남길지 정해야 한다. 기대값을 정하는 규칙: 6절 3·4; 7절 1; 8-2 10.'
- id: C5
  상황:
  - C5
  설명: C5 고친다는데 무엇인지 모름
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 아까 그거 틀렸어요
  expect:
    LoRA-A:
    - 의도: CORRECTION_MARKED
    발화판정:
      결과: HAS_ANSWER
      값없는정정요청:
      - 대상: 없음
    Plan:
      행동: ASK_CORRECTION_TARGET
      대상: []
  왜: 'C5 고친다는데 무엇인지 모름: 기대값이 행동 ASK_CORRECTION_TARGET이 되는지 확인한다. 이 상황을 다루는 이유: "아까 그거 틀렸어요"처럼 무엇을 고칠지 말하지 않는 경우가
    있다. 버리면 고치려는 뜻이 사라진다. 기대값을 정하는 규칙: 6절 표(정정 값 없음); 8-2 7; 8-1 규칙 7.'
- id: C6a
  상황:
  - C6
  설명: C6 고친다는데 값이 없음
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 담배 개수 답 고칠게요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      의도: CORRECTION_MARKED
    발화판정:
      결과: HAS_ANSWER
      값없는정정요청:
      - 대상: Q2.개비
    Plan:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q2.개비
      말할값:
      - 슬롯: Q2.개비
        값: 10
        역할: 현재값
  왜: 'C6 고친다는데 값이 없음: 기대값이 행동 ASK_CORRECTION_TARGET Q2.개비이 되는지 확인한다. 이 상황을 다루는 이유: 고치겠다고만 하고 값을 말하지 않는 경우가 있다. 값을
    물어야 고칠 수 있다. 기대값을 정하는 규칙: 6절 표; 8-2 7; 8-1 규칙 7; 8-2 11.'
- id: C6b
  상황:
  - C6
  설명: C6 예/아니요 문항(슬롯 하나)을 고치겠다고 함
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 폭음 답 고칠게요
  expect:
    LoRA-A:
    - 대상: Q4.여부
      의도: CORRECTION_MARKED
    발화판정:
      결과: HAS_ANSWER
      값없는정정요청:
      - 대상: Q4.여부
    Plan:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q4.여부
      말할값:
      - 슬롯: Q4.여부
        값: 예
        역할: 현재값
  왜: 'C6 예/아니요 문항(슬롯 하나)을 고치겠다고 함: 기대값이 행동 ASK_CORRECTION_TARGET Q4.여부이 되는지 확인한다. 이 상황을 다루는 이유: 고치겠다고만 하고 값을 말하지
    않는 경우가 있다. 값을 물어야 고칠 수 있다. 기대값을 정하는 규칙: 6절 표; 8-1 규칙 7.'
- id: C6c
  상황:
  - C6
  설명: C6 정정 구체화에 예/아니요 값으로 답함
  given:
    직전:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q4.여부
    열린요청:
      정정요청:
      - 대상: Q4.여부
  input:
    발화: 아니요
  expect:
    LoRA-A:
    - 대상: Q4.여부
      값: 아니요
      의도: CORRECTION_MARKED
    판정:
    - 대상: Q4.여부
      상태: CORRECTION
      이번값: 아니요
    저장:
    - 슬롯: Q4.여부
      동작: NEW_REVISION
      값: 아니요
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q4.여부
        이전: 예
        값: 아니요
  왜: 'C6 정정 구체화에 예/아니요 값으로 답함: 기대값이 판정 Q4.여부 CORRECTION; 저장 Q4.여부 NEW_REVISION; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을
    다루는 이유: 고치겠다고만 하고 값을 말하지 않는 경우가 있다. 값을 물어야 고칠 수 있다. 기대값을 정하는 규칙: 4절 2·3; 6절 1; 8-2 7; 8-1 규칙 17.'
- id: C7a
  상황:
  - C7
  설명: C7 앞 질문으로 돌아가기(문항이 분명함)
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 아까 술 마시는지 질문 다시 해 주세요
  expect:
    LoRA-A:
    - 대상: Q3a.여부
      의도: CORRECTION_MARKED
    발화판정:
      값없는정정요청:
      - 대상: Q3a.여부
    Plan:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q3a.여부
      말할값:
      - 슬롯: Q3a.여부
        값: 마심
        역할: 현재값
  왜: 'C7 앞 질문으로 돌아가기(문항이 분명함): 기대값이 행동 ASK_CORRECTION_TARGET Q3a.여부이 되는지 확인한다. 이 상황을 다루는 이유: "앞 질문 다시 해 주세요"는 사실상
    그 답을 고치려는 말이다. 기대값을 정하는 규칙: 4절 2; 8-1 규칙 7.'
- id: C7b
  상황:
  - C7
  설명: C7 앞 질문으로 돌아가기(문항이 분명하지 않음)
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 아까 그 질문 다시 해 주세요
  expect:
    LoRA-A:
    - 의도: CORRECTION_MARKED
    발화판정:
      값없는정정요청:
      - 대상: 없음
    Plan:
      행동: ASK_CORRECTION_TARGET
      대상: []
  왜: 'C7 앞 질문으로 돌아가기(문항이 분명하지 않음): 기대값이 행동 ASK_CORRECTION_TARGET이 되는지 확인한다. 이 상황을 다루는 이유: "앞 질문 다시 해 주세요"는 사실상 그
    답을 고치려는 말이다. 기대값을 정하는 규칙: 4절 2; 8-1 규칙 7.'
- id: C8a
  상황:
  - C8
  설명: C8 확인에 계속 답을 안 줌(상한)
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
    Plan기록:
      확인횟수:
        Q2.개비: 2
  input:
    발화: 그때그때 달라요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 그때그때 달라요
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q2.개비
      상태: UNCLEAR
      사유:
      - 모호함
      이번에말한값: 그때그때 달라요
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - KEPT_PREVIOUS: null
        슬롯: Q2.개비
        값: 10
      확인중단추가:
      - Q2.개비
    뒤:
      확인대기:
        Q2.개비:
          ID: X
          값: 20
  왜: 'C8 확인에 계속 답을 안 줌(상한): 기대값이 판정 Q2.개비 UNCLEAR; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 확인에 계속 답하지 않으면 끝없이 묻게
    된다. 풀리지 않은 답은 결과에 남겨 의료진이 본다. 기대값을 정하는 규칙: 5절 2(풀 수 없는 값 → 모호함); 8-1 규칙 8(확인 상한); 8-1 규칙 17.'
- id: C8b
  상황:
  - C8
  설명: C8 확인에 답을 안 줌(상한 전)
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
    Plan기록:
      확인횟수:
        Q2.개비: 1
  input:
    발화: 그때그때 달라요
  expect:
    LoRA-A:
