cases:
- id: V1
  상황:
  - V1
  설명: 한 발화에 같은 칸의 두 줄 — 한 줄은 답, 한 줄은 모름
  given:
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q3c
  input:
    발화: 소주는 두 병인데 맥주는 모르겠어요
  expect:
    LoRA-A:
    - 대상: Q3c#소주.양
      값: 두 병
      의도: ANSWERED_INTENT
    - 대상: Q3c#맥주.양
      의도: SAYS_UNKNOWN
    발화판정:
      결과: HAS_ANSWER
    판정:
    - 대상: Q3c#소주.양
      상태: ANSWERED
      이번값: 2병
    - 대상: Q3c#맥주.양
      상태: UNKNOWN
    저장:
    - 슬롯: Q3c#소주.양
      동작: FIRST_WRITE
      값: 2병
    - 슬롯: Q3c#맥주.양
      동작: RECORD_UNKNOWN
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      건너뜀추가:
      - 문항: Q3c
        사유: UNKNOWN_ACCEPTED
  비고: 같은 슬롯의 반복 행마다 상태가 다를 수 있으므로, 소주와 맥주의 답을 repeat_key로 구분해야 한다.
  왜: '한 발화에 같은 칸의 두 줄 — 한 줄은 답, 한 줄은 모름: 기대값이 판정 Q3c#소주.양 ANSWERED, Q3c#맥주.양 UNKNOWN; 저장 Q3c#소주.양 FIRST_WRITE, Q3c#맥주.양
    RECORD_UNKNOWN; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 한 문항이 주종처럼 줄마다 반복되면 한 발화에 같은 칸의 두 줄이 올 수 있고("소주는 2병인데
    맥주는 모르겠어요") 줄마다 상태가 다르다. 줄을 가리키지 못하면 둘 중 하나를 버려야 한다. 기대값을 정하는 규칙: SlotRef.repeat_key(반복 문항은 줄마다 가리킨다). 6절 1(판정은
    대상마다), 7절 1(정상 첫 답 → 첫 저장, 모름 → 모름 기록). 반복 키가 없으면 두 줄이 같은 대상이 되어 둘 중 하나를 버려야 한다.'
- id: V2
  상황:
  - V2
  설명: 같은 칸이라도 줄이 다르면 충돌이 아니다
  given:
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
      Q3c#소주.양: 2병
    직전:
      행동: ASK_NEXT
      대상:
      - Q3c
  input:
    발화: 맥주는 세 잔이요
  expect:
    LoRA-A:
    - 대상: Q3c#맥주.양
      값: 세 잔
      의도: ANSWERED_INTENT
    발화판정:
      결과: HAS_ANSWER
    판정:
    - 대상: Q3c#맥주.양
      상태: ANSWERED
      이번값: 3잔
    저장:
    - 슬롯: Q3c#맥주.양
      동작: FIRST_WRITE
      값: 3잔
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
  왜: '같은 칸이라도 줄이 다르면 충돌이 아니다: 기대값이 판정 Q3c#맥주.양 ANSWERED; 저장 Q3c#맥주.양 FIRST_WRITE; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을
    다루는 이유: 다른 줄의 같은 칸을 같은 대상으로 보면, 두 번째 줄의 첫 답이 충돌로 잘못 판정되어 묻지 않아도 될 확인을 한다. 기대값을 정하는 규칙: 6절 1(현재값과 다른 값이어야 충돌이다).
    소주 줄의 현재값은 맥주 줄의 현재값이 아니므로 맥주 줄은 첫 답이다. 반복 키가 없으면 2병과 3잔이 같은 칸의 두 값이 되어 충돌로 잘못 판정된다.'
- id: V3
  상황:
  - V3
  설명: 반복 키 목록에 없는 줄은 정의에 없는 대상이다
  given:
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q3c
  input:
    발화: 위스키 한 잔이요
  expect:
    LoRA-A:
    - 대상: Q3c#위스키.양
      값: 한 잔
      의도: ANSWERED_INTENT
    발화판정:
      결과: OUT_OF_SCOPE_ONLY
    판정: []
    저장: []
    Plan:
      행동: REDIRECT
  왜: '반복 키 목록에 없는 줄은 정의에 없는 대상이다: 기대값이 저장 없음; 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 반복 키를 문항 정의가 정하지 않으면 사용자가 말한
    아무 말이나 줄 식별자가 되어 저장에 들어간다. 기대값을 정하는 규칙: QuestionDef.repeat_keys(목록에 없는 키는 받지 않는다). 4절 대체 출력·5절 정의에 없는 대상은 무관으로
    본다. 목록이 없으면 어떤 줄이든 만들어져 저장에 아무 키나 들어간다.'
