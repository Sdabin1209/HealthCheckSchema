cases:
- id: H1
  상황:
  - H1
  설명: H1 다 답함
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
      Q5.시간: 7
      Q6.여부: 아니요
      Q7.수축기: 120
      Q7.이완기: 80
    직전:
      행동: ASK_NEXT
      대상:
      - Q8
  input:
    발화: 주 세 번이요
  expect:
    LoRA-A:
    - 대상: Q8.횟수
      값: 주 세 번
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q8.횟수
      상태: ANSWERED
      이번값: 주 3회
    저장:
    - 슬롯: Q8.횟수
      동작: FIRST_WRITE
      값: 주 3회
    Plan:
      행동: ASK_FINISH
  왜: 'H1 다 답함: 기대값이 판정 Q8.횟수 ANSWERED; 저장 Q8.횟수 FIRST_WRITE; 행동 ASK_FINISH이 되는지 확인한다. 이 상황을 다루는 이유: 다 답했으면 마치기 전에
    한 번 묻는다. 마친 뒤에는 고칠 수 없다(A6). 기대값을 정하는 규칙: 8-1 규칙 19.'
- id: H2
  상황:
  - H2
  설명: H2 마치겠다고 함
  given:
    답:
      기본: 없음
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
      Q5.시간: 7
      Q6.여부: 아니요
      Q7.수축기: 120
      Q7.이완기: 80
      Q8.횟수: 주 3회
    직전:
      행동: ASK_FINISH
  input:
    발화: 네
  expect:
    LoRA-A:
    - 의도: CONFIRM_YES
    발화판정:
      확인응답: 승낙
    Plan:
      행동: FAREWELL
      세션상태: ENDED_COMPLETE
      흐름: END
    LangGraph:
      결과전달호출: true
    결과전달입력:
      세션정보:
        문항정의버전: 1
      세션상태: ENDED_COMPLETE
      응답기록:
        Q1.상태: 안 피움
        Q3a.여부: 안 마심
        Q5.시간: 7
        Q6.여부: 아니요
        Q7.수축기: 120
        Q7.이완기: 80
        Q8.횟수: 주 3회
      건너뜀: []
      확인중단: []
      중지이력: []
  왜: 'H2 마치겠다고 함: 기대값이 행동 FAREWELL; 세션 상태 ENDED_COMPLETE이 되는지 확인한다. 이 상황을 다루는 이유: 마치겠다고 하면 결과를 넘기고 끝낸다. 기대값을 정하는
    규칙: 8-1 규칙 6.'
- id: H3a
  상황:
  - H3
  설명: H3 마치기 전에 고침
  given:
    답:
      기본: 없음
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
      Q5.시간: 7
      Q6.여부: 아니요
      Q7.수축기: 120
      Q7.이완기: 80
      Q8.횟수: 주 3회
    직전:
      행동: ASK_FINISH
  input:
    발화: 아 잠깐, 잠은 여섯 시간이에요
  expect:
    LoRA-A:
    - 대상: Q5.시간
      값: 여섯 시간
      의도: CORRECTION_MARKED
    판정:
    - 대상: Q5.시간
      상태: CORRECTION
      이번값: 6
    저장:
    - 슬롯: Q5.시간
      동작: NEW_REVISION
      값: 6
    Plan:
      행동: ASK_FINISH
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q5.시간
        이전: 7
        값: 6
  왜: 'H3 마치기 전에 고침: 기대값이 판정 Q5.시간 CORRECTION; 저장 Q5.시간 NEW_REVISION; 행동 ASK_FINISH이 되는지 확인한다. 이 상황을 다루는 이유: 마치기
    직전에 고치는 사람이 있다. 고친 것을 반영하고 다시 물어야 한다. 기대값을 정하는 규칙: 6절 1; 8-1 규칙 19.'
- id: H3b
  상황:
  - H3
  설명: H3 승낙과 고침이 함께
  given:
    답:
      기본: 없음
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
      Q5.시간: 7
      Q6.여부: 아니요
      Q7.수축기: 120
      Q7.이완기: 80
      Q8.횟수: 주 3회
    직전:
      행동: ASK_FINISH
  input:
    발화: 네, 근데 운동은 두 번이에요
  expect:
    LoRA-A:
    - 의도: CONFIRM_YES
    - 대상: Q8.횟수
      값: 두 번
      의도: CORRECTION_MARKED
    발화판정:
      확인응답: 승낙
    판정:
    - 대상: Q8.횟수
      상태: CORRECTION
      이번값: 주 2회
    저장:
    - 슬롯: Q8.횟수
      동작: NEW_REVISION
      값: 주 2회
    Plan:
      행동: ASK_FINISH
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q8.횟수
        이전: 주 3회
        값: 주 2회
    LangGraph:
      결과전달호출: false
  왜: 'H3 승낙과 고침이 함께: 기대값이 판정 Q8.횟수 CORRECTION; 저장 Q8.횟수 NEW_REVISION; 행동 ASK_FINISH이 되는지 확인한다. 이 상황을 다루는 이유: 마치기
    직전에 고치는 사람이 있다. 고친 것을 반영하고 다시 물어야 한다. 기대값을 정하는 규칙: 8-1 규칙 6·19.'
- id: H3c
  상황:
  - H3
  설명: H3 승낙과 값 없는 고침이 함께
  given:
    답:
      기본: 없음
      Q1.상태: 현재 피움
      Q2.개비: 10
      Q3a.여부: 안 마심
      Q5.시간: 7
      Q6.여부: 아니요
      Q7.수축기: 120
      Q7.이완기: 80
      Q8.횟수: 주 3회
    직전:
      행동: ASK_FINISH
  input:
    발화: 네, 근데 담배 개수 고칠래요
  expect:
    LoRA-A:
    - 의도: CONFIRM_YES
    - 대상: Q2.개비
      의도: CORRECTION_MARKED
    발화판정:
      확인응답: 승낙
      값없는정정요청:
      - 대상: Q2.개비
    Plan:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q2.개비
      말할값:
      - 슬롯: Q2.개비
        값: 10
        역할: 현재값
    LangGraph:
      결과전달호출: false
  왜: 'H3 승낙과 값 없는 고침이 함께: 기대값이 행동 ASK_CORRECTION_TARGET Q2.개비이 되는지 확인한다. 이 상황을 다루는 이유: 마치기 직전에 고치는 사람이 있다. 고친 것을
    반영하고 다시 물어야 한다. 기대값을 정하는 규칙: 8-1 규칙 6·7.'
- id: H3d
  상황:
  - H3
  설명: H3 승낙과 위급한 말이 함께, 재개 뒤 마침
  steps:
  - given:
      답:
        기본: 없음
        Q1.상태: 안 피움
        Q3a.여부: 안 마심
        Q5.시간: 7
        Q6.여부: 아니요
        Q7.수축기: 120
        Q7.이완기: 80
        Q8.횟수: 주 3회
      직전:
        행동: ASK_FINISH
    input:
      발화: 네… 가슴이 너무 아파요
    expect:
      LoRA-A:
      - 의도: CONFIRM_YES
      - 의도: RISK_SIGNAL
        원문: 가슴이 너무 아파요
      Plan:
        행동: RISK_NOTICE
        기다리는답:
          행동: ASK_FINISH
        세션상태: PAUSED_RISK
        중지이력추가:
        - 종류: 일시 중지
          이유:
          - 위험 신호: null
            근거:
            - 가슴이 너무 아파요
        직원알림:
          종류: 위험
          이유:
          - 위험 신호: null
            근거:
            - 가슴이 너무 아파요
      LangGraph:
        결과전달호출: false
  - input:
      개입: 재개
    expect:
      Plan:
        행동: ASK_FINISH
        알릴것:
        - RESUME: null
        세션상태: IN_PROGRESS
        중지이력추가:
        - 종류: 재개
  - input:
      발화: 네
    expect:
      LoRA-A:
      - 의도: CONFIRM_YES
      Plan:
        행동: FAREWELL
        세션상태: ENDED_COMPLETE
        흐름: END
      LangGraph:
        결과전달호출: true
  왜: 'H3 승낙과 위급한 말이 함께, 재개 뒤 마침: 기대값이 행동 RISK_NOTICE; 세션 상태 PAUSED_RISK → 행동 ASK_FINISH; 세션 상태 IN_PROGRESS → 행동
    FAREWELL; 세션 상태 ENDED_COMPLETE이 되는지 확인한다. 이 상황을 다루는 이유: 마치기 직전에 고치는 사람이 있다. 고친 것을 반영하고 다시 물어야 한다. 기대값을 정하는 규칙:
    8-1 규칙 1; 8-3절 2; 8-1 규칙 6·19; 8-2 6.'
- id: H3e
  상황:
  - H3
  설명: H3 마치기 확인 중 충돌과 위급한 말이 함께(재개 뒤 확인부터)
  steps:
  - given:
      답:
        기본: 없음
        Q1.상태: 안 피움
        Q3a.여부: 안 마심
        Q5.시간: 7
        Q6.여부: 아니요
        Q7.수축기: 120
        Q7.이완기: 80
        Q8.횟수: 주 3회
      직전:
        행동: ASK_FINISH
    input:
      발화: 운동은 다섯 번이에요… 숨이 안 쉬어져요
    expect:
      LoRA-A:
      - 대상: Q8.횟수
        값: 다섯 번
        의도: ANSWERED_INTENT
      - 의도: RISK_SIGNAL
        원문: 숨이 안 쉬어져요
      판정:
      - 대상: Q8.횟수
        상태: CONFLICT
        이번값: 주 5회
        확인대기처리: 새로 둠
      저장:
      - 슬롯: Q8.횟수
        동작: SET_PENDING
        확인대기ID: Y
        값: 주 5회
      Plan:
        행동: RISK_NOTICE
        기다리는답:
          행동: ASK_CONFIRM
          대상:
          - Q8.횟수
          대상확인대기ID: Y
        세션상태: PAUSED_RISK
        중지이력추가:
        - 종류: 일시 중지
          이유:
          - 위험 신호: null
            근거:
            - 숨이 안 쉬어져요
        직원알림:
          종류: 위험
          이유:
          - 위험 신호: null
            근거:
            - 숨이 안 쉬어져요
  - input:
      개입: 재개
    expect:
      Plan:
        행동: ASK_CONFIRM
        대상:
        - Q8.횟수
        대상확인대기ID: Y
        알릴것:
        - RESUME: null
        세션상태: IN_PROGRESS
        중지이력추가:
        - 종류: 재개
  왜: 'H3 마치기 확인 중 충돌과 위급한 말이 함께(재개 뒤 확인부터): 기대값이 판정 Q8.횟수 CONFLICT; 저장 Q8.횟수 SET_PENDING; 행동 RISK_NOTICE; 세션 상태
    PAUSED_RISK → 행동 ASK_CONFIRM Q8.횟수; 세션 상태 IN_PROGRESS이 되는지 확인한다. 이 상황을 다루는 이유: 마치기 직전에 고치는 사람이 있다. 고친 것을 반영하고
    다시 물어야 한다. 기대값을 정하는 규칙: 6절 1; 8-1 규칙 1·15; 8-3절 2; 8-1 규칙 16.'
- id: H4
  상황:
  - H2
  - B10
  - C8
  - C1
  - G4
  설명: H2 건너뜀·확인 중단·수정 이력·위험 표시가 있는 채로 마침
  steps:
  - given:
      기본: 없음
      답:
        Q1.상태: 현재 피움
        Q2.개비: 10
        Q3a.여부: 마심
        Q4.여부: 아니요
        Q5.시간: 7
        Q6.여부: 아니요
        Q7.수축기: 120
        Q7.이완기: 110
        Q8.횟수: 주 3회
        Q3c#소주.양: 2병
      확인대기:
        Q2.개비:
          ID: X
          값: 30
      확인중단:
      - Q2.개비
      건너뜀:
      - 문항: Q3b
        사유: ATTEMPTS_EXCEEDED
      직전:
        행동: ASK_FINISH
    input:
      발화: 아까 혈압 위 백이십이라고 한 거 아니고 백구십이에요
    expect:
      LoRA-A:
      - 대상: Q7.수축기
        값: 백구십
        의도: CORRECTION_MARKED
      판정:
      - 대상: Q7.수축기
        상태: CORRECTION
        이번값: 190
        위험기준: ON_RESULT
      저장:
      - 슬롯: Q7.수축기
        동작: NEW_REVISION
        값: 190
        위험표시: 결과 표시
      Plan:
        행동: ASK_FINISH
        알릴것:
        - CORRECTION_ACK: null
          슬롯: Q7.수축기
          이전: 120
          값: 190
      뒤:
        답:
          Q7.수축기: 190
        이력:
          Q7.수축기:
          - 120
  - input:
      발화: 네
    expect:
      LoRA-A:
      - 의도: CONFIRM_YES
      발화판정:
        확인응답: 승낙
      Plan:
        행동: FAREWELL
        세션상태: ENDED_COMPLETE
        흐름: END
      LangGraph:
        결과전달호출: true
      결과전달입력:
        세션정보:
          문항정의버전: 1
        세션상태: ENDED_COMPLETE
        응답기록:
          Q2.개비:
            현재값: 10
            확인대기:
              ID: X
              값: 30
          Q7.수축기:
            현재값: 190
            이력:
            - 120
            위험표시: 결과 표시
          Q7.이완기:
            현재값: 110
            위험표시: 결과 표시
        건너뜀:
        - 문항: Q3b
          사유: ATTEMPTS_EXCEEDED
        확인중단:
        - Q2.개비
        중지이력: []
      전달기록:
      - 성공여부: 성공
  왜: 'H2 건너뜀·확인 중단·수정 이력·위험 표시가 있는 채로 마침: 기대값이 판정 Q7.수축기 CORRECTION; 저장 Q7.수축기 NEW_REVISION; 행동 ASK_FINISH → 행동
    FAREWELL; 세션 상태 ENDED_COMPLETE이 되는지 확인한다. 이 상황을 다루는 이유: 마치겠다고 하면 결과를 넘기고 끝낸다. / 계속 쓸 수 있는 답이 안 나오면 끝없이 묻게 된다.
    / 확인에 계속 답하지 않으면 끝없이 묻게 된다. 풀리지 않은 답은 결과에 남겨 의료진이 본다. / 사람은 앞서 한 답을 고친다. / 위험하지만 바로 멈출 정도는 아닌 답은 결과에 표시해 의료진이
    본다. 기대값을 정하는 규칙: 6절 1; 7절 1; 8-1 규칙 6·19; DispatchInput 계약; 9-2절 표.'
- id: H5a
  상황:
  - H1
  설명: H1 종료 확인 중 못 알아들으면 다시 말씀 요청이고 물은 횟수는 는다
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
      Q5.시간: 7
      Q6.여부: 아니요
      Q7.수축기: 120
      Q7.이완기: 80
      Q8.횟수: 주 3회
    직전:
      행동: ASK_FINISH
    Plan기록:
      물은횟수:
        종료 확인: 1
  input:
    발화: 음
  expect:
    LoRA-A: []
    발화판정:
      결과: UNRECOGNIZED_TURN
    판정: []
    저장: []
