cases:
- id: E1a
  상황:
  - E1
  설명: E1 질문의 뜻을 물음
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
      Q3b.빈도: 주 2회
      Q3b.종류: 소주
      Q3b.1회양: 1병
    직전:
      행동: ASK_NEXT
      대상:
      - Q4
  input:
    발화: 폭음이 뭐예요?
  expect:
    LoRA-A:
    - 의도: GUIDE_REQUEST
      안내항목: 설명
      대상: Q4.*
    발화판정:
      결과: REQUEST_ONLY
      요청:
      - 종류: GUIDE
        안내항목: 설명
        대상문항: Q4
    Plan:
      행동: ASK_NEXT
      대상:
      - Q4
      알릴것:
      - GUIDE: 설명
        문항: Q4
    문장재료:
      안내문장:
      - 안내항목: 설명
        문항: Q4
        문장: 한 자리에서 소주 한 병이 넘게 드시는 일이 있는지 여쭙는 것입니다.
      문항문장:
      - 문항: Q4
        문장: 한 번에 소주 한 병 넘게 드시는 일이 있나요?
      선택지:
      - 슬롯: Q4.여부
        선택지:
        - 예
        - 아니요
      거절시설명: []
      되묻기문장: []
      고정문장: []
  왜: 'E1 질문의 뜻을 물음: 기대값이 행동 ASK_NEXT Q4이 되는지 확인한다. 이 상황을 다루는 이유: 질문의 뜻이나 이유를 묻는 사람에게 검토된 설명을 해야 답할 수 있다. 기대값을 정하는
    규칙: 8-1 규칙 12; 8-2 1.'
- id: E1b
  상황:
  - E1
  설명: E1 질문의 이유를 물음(대상 없이)
  given:
    답:
      Q5.시간: 7
    직전:
      행동: ASK_NEXT
      대상:
      - Q6
  input:
    발화: 이건 왜 물어보는 거예요?
  expect:
    LoRA-A:
    - 의도: GUIDE_REQUEST
      안내항목: 목적
    발화판정:
      결과: REQUEST_ONLY
      요청:
      - 종류: GUIDE
        안내항목: 목적
        대상문항: Q6
    Plan:
      행동: ASK_NEXT
      대상:
      - Q6
      알릴것:
      - GUIDE: 목적
        문항: Q6
    문장재료:
      안내문장:
      - 안내항목: 목적
        문항: Q6
        문장: 그런 생각이 드시면 바로 도움을 드리려고 확인합니다.
  왜: 'E1 질문의 이유를 물음(대상 없이): 기대값이 행동 ASK_NEXT Q6이 되는지 확인한다. 이 상황을 다루는 이유: 질문의 뜻이나 이유를 묻는 사람에게 검토된 설명을 해야 답할 수 있다.
    기대값을 정하는 규칙: 6절 7; 8-1 규칙 12.'
- id: E1c
  상황:
  - E1
  설명: E1 빠진 슬롯을 되묻는 중에 뜻을 물음
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
      Q3b.종류: 소주
    직전:
      행동: ASK_MISSING
      대상:
      - Q3b.빈도
      - Q3b.1회양
  input:
    발화: 1회 양이 뭐예요?
  expect:
    LoRA-A:
    - 의도: GUIDE_REQUEST
      안내항목: 설명
      대상: Q3b.*
    Plan:
      행동: ASK_MISSING
      대상:
      - Q3b.빈도
      - Q3b.1회양
      알릴것:
      - GUIDE: 설명
        문항: Q3b
  왜: 'E1 빠진 슬롯을 되묻는 중에 뜻을 물음: 기대값이 행동 ASK_MISSING Q3b.빈도, Q3b.1회양이 되는지 확인한다. 이 상황을 다루는 이유: 질문의 뜻이나 이유를 묻는 사람에게 검토된
    설명을 해야 답할 수 있다. 기대값을 정하는 규칙: 8-1 규칙 12; 8-2 1; 8-1 규칙 17(빈 필수 슬롯 + 답 있는 슬롯 → 빠진 슬롯 되묻기).'
- id: E2
  상황:
  - E2
  설명: E2 진행 상황을 물음
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 얼마나 남았어요?
  expect:
    LoRA-A:
    - 의도: GUIDE_REQUEST
      안내항목: 진행
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - GUIDE: 진행
        값: 4
    문장재료:
      안내문장:
      - 안내항목: 진행
        문항: 없음
        문장: 앞으로 {남은 문항 수}개 더 여쭤보면 끝납니다.
  왜: 'E2 진행 상황을 물음: 기대값이 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 얼마나 남았는지 묻는 사람에게 실제 남은 수를 알려야 한다. 기대값을 정하는 규칙:
    8-1 규칙 12; 8-2 10(남은 문항 수 4).'
- id: E3a
  상황:
  - E3
  설명: E3 개인정보를 물음
  given:
    답:
      Q5.시간: 7
    직전:
      행동: ASK_NEXT
      대상:
      - Q6
  input:
    발화: 이거 누가 봐요?
  expect:
    LoRA-A:
    - 의도: GUIDE_REQUEST
      안내항목: 개인정보
    Plan:
      행동: ASK_NEXT
      대상:
      - Q6
      알릴것:
      - GUIDE: 개인정보
    문장재료:
      안내문장:
      - 안내항목: 개인정보
        문항: 없음
        문장: 말씀해 주신 내용은 오늘 진료를 보는 의료진만 봅니다.
  왜: 'E3 개인정보를 물음: 기대값이 행동 ASK_NEXT Q6이 되는지 확인한다. 이 상황을 다루는 이유: 개인정보·의료 판단 질문에는 검토된 문장으로만 답해야 한다. 함께 한 답은 저장돼야 한다.
    기대값을 정하는 규칙: 8-1 규칙 12.'
- id: E3b
  상황:
  - E3
  설명: E3 답과 의료 판단 질문이 함께
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q3b
  input:
    발화: 주 2회 한 병씩인데, 이 정도면 많이 마시는 거예요?
  expect:
    LoRA-A:
    - 대상: Q3b.빈도
      값: 주 2회
      의도: ANSWERED_INTENT
    - 대상: Q3b.1회양
      값: 한 병
      의도: ANSWERED_INTENT
    - 의도: GUIDE_REQUEST
      안내항목: 의료판단
    판정:
    - 대상: Q3b.빈도
      상태: ANSWERED
      이번값: 주 2회
    - 대상: Q3b.1회양
      상태: ANSWERED
      이번값: 1병
    - 대상: Q3b.종류
      상태: MISSING
      사유:
      - 필수 슬롯 누락
    저장:
    - 슬롯: Q3b.빈도
      동작: FIRST_WRITE
      값: 주 2회
    - 슬롯: Q3b.1회양
      동작: FIRST_WRITE
      값: 1병
    Plan:
      행동: ASK_MISSING
      대상:
      - Q3b.종류
      알릴것:
      - GUIDE: 의료판단
      말할값:
      - 슬롯: Q3b.빈도
        값: 주 2회
        역할: 방금 저장
      - 슬롯: Q3b.1회양
        값: 1병
        역할: 방금 저장
  왜: 'E3 답과 의료 판단 질문이 함께: 기대값이 판정 Q3b.빈도 ANSWERED, Q3b.1회양 ANSWERED, Q3b.종류 MISSING; 저장 Q3b.빈도 FIRST_WRITE, Q3b.1회양
    FIRST_WRITE; 행동 ASK_MISSING Q3b.종류이 되는지 확인한다. 이 상황을 다루는 이유: 개인정보·의료 판단 질문에는 검토된 문장으로만 답해야 한다. 함께 한 답은 저장돼야 한다.
    기대값을 정하는 규칙: 6절 1; 8-1 규칙 10; 8-2 10·11.'
- id: E4
  상황:
  - E4
  설명: E4 목록에 없는 질문
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 화장실 어디예요?
  expect:
    LoRA-A:
    - 의도: OUT_OF_SCOPE
    발화판정:
      결과: OUT_OF_SCOPE_ONLY
    Plan:
      행동: REDIRECT
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
    LoRA-B조건:
    - 도와드리기 어렵다는 뜻을 말한다
    - 화장실 위치를 지어내지 않는다
    - 수면 질문을 다시 한다
  왜: 'E4 목록에 없는 질문: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 목록에 없는 질문(화장실 위치)에 답을 지어내면 안 된다. 기대값을 정하는 규칙: 8-1
    규칙 13.'
- id: E5a
  상황:
  - E2
  - C1
  설명: C1·E2 한 발화에 정정과 진행 질문이 함께 — 알릴 것 순서
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 아까 열 개 아니고 스무 개요, 그리고 얼마나 남았어요?
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 스무 개
      의도: CORRECTION_MARKED
    - 의도: GUIDE_REQUEST
      안내항목: 진행
    발화판정:
      결과: HAS_ANSWER
    판정:
    - 대상: Q2.개비
      상태: CORRECTION
      이번값: 20
    저장:
    - 슬롯: Q2.개비
      동작: NEW_REVISION
      값: 20
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q2.개비
        이전: 10
        값: 20
      - GUIDE: 진행
        값: 5
  비고: 알릴 것이 둘 이상인 유일한 케이스다. 순서를 뒤집으면 8-2절 10을 어긴다.
  왜: 'C1·E2 한 발화에 정정과 진행 질문이 함께 — 알릴 것 순서: 기대값이 판정 Q2.개비 CORRECTION; 저장 Q2.개비 NEW_REVISION; 행동 ASK_NEXT Q5이 되는지
    확인한다. 이 상황을 다루는 이유: 얼마나 남았는지 묻는 사람에게 실제 남은 수를 알려야 한다. / 사람은 앞서 한 답을 고친다. 기대값을 정하는 규칙: 8-2절 10(알릴 것 순서: 정정 받았음
    → 기존 답 유지 → 안내); 8-4절 1(알릴 것은 행동과 함께); 안내 진행의 채울 값은 이번 턴 반영 뒤 남은 문항 수.'
