cases:
- id: S1a
  상황:
  - K9
  - C2
  설명: K9·C2 해당 없는 후속 문항에 부정 답을 함
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 폭음은 안 해요
  expect:
    LoRA-A:
    - 대상: Q4.여부
      값: 안 해요
      의도: ANSWERED_INTENT
    정규화:
      항목별검사:
      - 선행불충족: true
    판정:
    - 대상: Q4.여부
      상태: PREREQUISITE_UNMET
    발화판정:
      결과: HAS_ANSWER
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
  왜: 'K9·C2 해당 없는 후속 문항에 부정 답을 함: 기대값이 판정 Q4.여부 PREREQUISITE_UNMET; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 문진에
    없는 정보는 저장할 곳이 없다. 받아 주고 잇는다. / 선행 답을 고치면 그에 딸린 후속 답이 모순이 된다(술을 안 마시는데 음주량이 남음). 기대값을 정하는 규칙: 5절 4; 6절 표; 8-1
    규칙 17.'
- id: S1b
  상황:
  - B4
  설명: B4 맞지 않는 후속 답을 되물었는데 맞는 쪽으로 답함
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
    직전:
      행동: ASK_CLARIFY
      대상:
      - Q4.여부
      되물을이유:
      - MISMATCH
      말할값:
      - 슬롯: Q4.여부
        값: 있어요
        역할: 이번에 말한 값
      - 슬롯: Q3a.여부
        값: 안 마심
        역할: 현재값
    Plan기록:
      시도횟수:
        Q4: 1
  input:
    발화: 폭음은 없어요
  expect:
    LoRA-A:
    - 대상: Q4.여부
      값: 없어요
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q4.여부
      상태: PREREQUISITE_UNMET
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
  비고: 선행 불충족을 판정하지 않으면 이 답이 보이지 않아 같은 구체화 요청을 끝없이 반복한다.
  왜: 'B4 맞지 않는 후속 답을 되물었는데 맞는 쪽으로 답함: 기대값이 판정 Q4.여부 PREREQUISITE_UNMET; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유:
    앞뒤가 맞지 않는 답을 둘 다 저장하면 결과가 모순된다. 기대값을 정하는 규칙: 5절 4; 8-1 규칙 6b·17.'
- id: S1c
  상황:
  - K9
  설명: K9 해당 없는 후속 문항에 모름
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 음주 상세는 잘 모르겠어요
  expect:
    LoRA-A:
    - 대상: Q3b.*
      의도: SAYS_UNKNOWN
    판정:
    - 대상: Q3b.*
      상태: PREREQUISITE_UNMET
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
    뒤:
      답:
        Q3b.빈도: 없음
        Q3b.종류: 없음
        Q3b.1회양: 없음
  왜: 'K9 해당 없는 후속 문항에 모름: 기대값이 판정 Q3b.* PREREQUISITE_UNMET; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 문진에 없는 정보는 저장할
    곳이 없다. 받아 주고 잇는다. 기대값을 정하는 규칙: 5절 4; 6절 표.'
  비고: '입력을 고침: 원래 발화 "술 양은 잘 모르겠어요"는 Q3b 문항 전체로도, Q3b.1회양 한 칸으로도 읽힌다. 독립 검증자는 1회양으로, 기존 기대값은 문항 전체로 읽었다. 문항 이름("음주
    상세")을 그대로 써서 하나로 정한다.'
- id: S1d
  상황:
  - K9
  - D3
  설명: K9·D3 해당 없는 후속 문항을 미룸
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 폭음 질문은 이따 할게요
  expect:
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: LATER
      대상: Q4.*
    발화판정:
      결과: OUT_OF_SCOPE_ONLY
    Plan:
      행동: REDIRECT
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
  비고: 묻지 않을 문항을 미뤘다고 알리지 않는다.
  왜: 'K9·D3 해당 없는 후속 문항을 미룸: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 문진에 없는 정보는 저장할 곳이 없다. 받아 주고 잇는다. / 어떤 문항은
    나중에 답하고 싶어 한다. 버리지 않고 마지막에 다시 물어야 한다. 기대값을 정하는 규칙: 5절 4; 6절 표; 8-1 규칙 13.'
- id: S1e
  상황:
  - K9
  - C6
  설명: K9·C6 해당 없는 후속 문항을 고치겠다고 함
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 폭음 답 고칠게요
  expect:
    LoRA-A:
    - 대상: Q4.여부
      의도: CORRECTION_MARKED
    발화판정:
      결과: OUT_OF_SCOPE_ONLY
      값없는정정요청: []
    Plan:
      행동: REDIRECT
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
  왜: 'K9·C6 해당 없는 후속 문항을 고치겠다고 함: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 문진에 없는 정보는 저장할 곳이 없다. 받아 주고 잇는다. / 고치겠다고만
    하고 값을 말하지 않는 경우가 있다. 값을 물어야 고칠 수 있다. 기대값을 정하는 규칙: 6절 표; 8-1 규칙 13.'
- id: S2a
  상황:
  - B6
  설명: B6 선행 문항보다 후속 문항을 먼저 답함
  given:
    기본: 없음
    직전:
      행동: ASK_NEXT
      대상:
      - Q1
  input:
    발화: 하루 열 개 피워요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 열 개
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q2.개비
      상태: PREREQUISITE_UNMET
    저장: []
    Plan:
      행동: ASK_NEXT
      대상:
      - Q1
  비고: 후속 문항 기록은 선행 조건이 충족될 때만 둔다. 선행 답이 정해진 뒤 그 문항을 묻는다.
  왜: 'B6 선행 문항보다 후속 문항을 먼저 답함: 기대값이 판정 Q2.개비 PREREQUISITE_UNMET; 저장 없음; 행동 ASK_NEXT Q1이 되는지 확인한다. 이 상황을 다루는 이유:
    사람은 묻지 않은 것까지 한꺼번에 말한다. 버리면 나중에 또 물어야 한다. 기대값을 정하는 규칙: 5절 3·4; 7절 1; 8-1 규칙 17.'
- id: S2b
  상황:
  - B4
  설명: B4 저장된 선행 답과 맞지 않는 후속 답
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
    직전:
      행동: ASK_NEXT
      대상:
      - Q3a
  input:
    발화: 담배는 열 개요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 열 개
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q2.개비
      상태: UNCLEAR
      사유:
      - 다른 답과 맞지 않음
      이번에말한값: 열 개
      맞지않는슬롯:
      - Q1.상태
    Plan:
      행동: ASK_CLARIFY
      대상:
      - Q2.개비
      되물을이유:
      - MISMATCH
      말할값:
      - 슬롯: Q2.개비
        값: 열 개
        역할: 이번에 말한 값
      - 슬롯: Q1.상태
        값: 안 피움
        역할: 현재값
  왜: 'B4 저장된 선행 답과 맞지 않는 후속 답: 기대값이 판정 Q2.개비 UNCLEAR; 행동 ASK_CLARIFY Q2.개비이 되는지 확인한다. 이 상황을 다루는 이유: 앞뒤가 맞지 않는 답을
    둘 다 저장하면 결과가 모순된다. 기대값을 정하는 규칙: 5절 4; 8-1 규칙 9; 8-2 11.'
- id: S2c
  상황:
  - C2
  - B7
  설명: C2·B7 선행 답이 모름으로 바뀌면 후속 기록이 무효화됨
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 사실 술 마시는지 잘 모르겠어요
  expect:
    LoRA-A:
    - 대상: Q3a.여부
      의도: SAYS_UNKNOWN
    판정:
    - 대상: Q3a.여부
      상태: UNKNOWN
    무효화대상문항:
    - Q3b
    - Q4
    저장:
    - 슬롯: Q3b.빈도
      동작: INVALIDATE
    - 슬롯: Q3b.종류
      동작: INVALIDATE
    - 슬롯: Q3b.1회양
      동작: INVALIDATE
    - 슬롯: Q4.여부
      동작: INVALIDATE
    - 슬롯: Q3a.여부
      동작: RECORD_UNKNOWN
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      건너뜀추가:
      - 문항: Q3a
        사유: UNKNOWN_ACCEPTED
    뒤:
      답:
        Q3a.여부: 모름
        Q3b.종류: 없음
        Q4.여부: 없음
      이력:
        Q3a.여부:
        - 마심
  왜: 'C2·B7 선행 답이 모름으로 바뀌면 후속 기록이 무효화됨: 기대값이 판정 Q3a.여부 UNKNOWN; 저장 Q3b.빈도 INVALIDATE, Q3b.종류 INVALIDATE, Q3b.1회양
    INVALIDATE, Q4.여부 INVALIDATE, Q3a.여부 RECORD_UNKNOWN; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 선행 답을 고치면 그에 딸린
    후속 답이 모순이 된다(술을 안 마시는데 음주량이 남음). / 모른다는 답은 흔하고 빈 답과 다르게 다뤄야 한다. 기대값을 정하는 규칙: 6절 1·6; 7절 1; 8-1 규칙 11.'
- id: S2d
  상황:
  - B4
  설명: B4 선행 답과 알 수 없는 후속 값이 함께
  given:
    기본: 없음
    직전:
      행동: ASK_NEXT
      대상:
      - Q3a
  input:
    발화: 안 마셔요, 빈도는 자주요
  expect:
    LoRA-A:
    - 대상: Q3a.여부
      값: 안 마셔요
      의도: ANSWERED_INTENT
    - 대상: Q3b.빈도
      값: 자주
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q3a.여부
      상태: ANSWERED
      이번값: 안 마심
    - 대상: Q3b.빈도
      상태: PREREQUISITE_UNMET
    저장:
    - 슬롯: Q3a.여부
      동작: FIRST_WRITE
      값: 안 마심
    Plan:
      행동: ASK_NEXT
      대상:
      - Q1
  왜: 'B4 선행 답과 알 수 없는 후속 값이 함께: 기대값이 판정 Q3a.여부 ANSWERED, Q3b.빈도 PREREQUISITE_UNMET; 저장 Q3a.여부 FIRST_WRITE; 행동 ASK_NEXT
    Q1이 되는지 확인한다. 이 상황을 다루는 이유: 앞뒤가 맞지 않는 답을 둘 다 저장하면 결과가 모순된다. 기대값을 정하는 규칙: 5절 2·3·4; NormalizerOutput.missing_required_slots(선행
    불충족 항목의 문항 제외); 6절 1; 8-1 규칙 17.'
- id: S2e
  상황:
  - C3
  - B6
  설명: C3·B6 선행 답이 충돌인 발화의 후속 답
  steps:
  - given:
      기본: 없음
      답:
        Q1.상태: 안 피움
        Q3a.여부: 안 마심
      직전:
        행동: ASK_NEXT
        대상:
        - Q5
    input:
      발화: 술 마셔요, 폭음도 있어요
    expect:
      LoRA-A:
      - 대상: Q3a.여부
        값: 마셔요
        의도: ANSWERED_INTENT
      - 대상: Q4.여부
        값: 있어요
        의도: ANSWERED_INTENT
      판정:
      - 대상: Q3a.여부
        상태: CONFLICT
        이번값: 마심
        확인대기처리: 새로 둠
      - 대상: Q4.여부
        상태: PREREQUISITE_UNMET
      저장:
      - 슬롯: Q3a.여부
        동작: SET_PENDING
        확인대기ID: X
        값: 마심
      Plan:
        행동: ASK_CONFIRM
        대상:
        - Q3a.여부
        대상확인대기ID: X
  - input:
      발화: 네
    expect:
      LoRA-A:
      - 의도: CONFIRM_YES
      판정:
      - 대상: Q3a.여부
        상태: 없음
        확인대기처리: 받아들임
        대상확인대기ID:
        - X
      저장:
      - 슬롯: Q3a.여부
        동작: ACCEPT_PENDING
        확인대기ID: X
        값: 마심
      무효화대상문항:
      - Q3b
      - Q4
      Plan:
        행동: ASK_NEXT
        대상:
        - Q3b
        알릴것:
        - CORRECTION_ACK: null
          슬롯: Q3a.여부
          이전: 안 마심
          값: 마심
  비고: 선행 답이 확인되기 전에는 후속 답을 저장하지 않는다. 확인 뒤 그 문항을 다시 묻는다.
  왜: 'C3·B6 선행 답이 충돌인 발화의 후속 답: 기대값이 판정 Q3a.여부 CONFLICT, Q4.여부 PREREQUISITE_UNMET; 저장 Q3a.여부 SET_PENDING; 행동 ASK_CONFIRM
    Q3a.여부 → 판정 Q3a.여부 없음; 저장 Q3a.여부 ACCEPT_PENDING; 행동 ASK_NEXT Q3b이 되는지 확인한다. 이 상황을 다루는 이유: 표지 없이 다른 값을 말하면 잘못
    들었을 수도 있다. / 사람은 묻지 않은 것까지 한꺼번에 말한다. 버리면 나중에 또 물어야 한다. 기대값을 정하는 규칙: 5절 4; 6절 1·6; 8-1 규칙 15·17.'
- id: S3d
  상황:
  - B10
  - B7
  설명: B10·B7 시도 초과로 넘긴 문항에 애매와 모름이 함께
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
      Q5.시간: 7
      Q6.여부: 아니요
    건너뜀:
    - 문항: Q7
      사유: ATTEMPTS_EXCEEDED
    직전:
      행동: ASK_NEXT
      대상:
      - Q8
