    문항 전체로 두면 짧은 답 "몰라요"가 Q7.*로 라벨되어(4절 5) 이미 답한 수축기까지 모름으로 덮인다. 독립 검증자가 실제로 그렇게 도출했다.'
  왜: 'B7·F1 두 번째 모름과 직원 요청이 함께: 기대값이 판정 Q7.이완기 UNKNOWN; 저장 없음; 행동 STAFF_NOTICE이 되는지 확인한다. 이 상황을 다루는 이유: 모른다는 답은
    흔하고 빈 답과 다르게 다뤄야 한다. / 직원을 찾는 사람에게 직원이 와야 한다. 기대값을 정하는 규칙: 8-1 규칙 2; 8-2 1.'
