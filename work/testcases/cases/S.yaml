      - 슬롯: Q6.여부
        동작: RECORD_REFUSAL
      - 슬롯: Q7.수축기
        동작: RECORD_UNKNOWN
      - 슬롯: Q7.이완기
        동작: RECORD_UNKNOWN
      Plan:
        행동: ASK_AFTER_REFUSAL
        대상:
        - Q6.여부
      Plan기록:
        거절횟수:
          Q6: 1
        모름횟수:
          Q7: 1
  - input:
      발화: 아니요
    expect:
      LoRA-A:
      - 대상: Q6.여부
        값: 아니요
        의도: ANSWERED_INTENT
      판정:
      - 대상: Q6.여부
        상태: ANSWERED
        이번값: 아니요
      저장:
      - 슬롯: Q6.여부
        동작: FIRST_WRITE
        값: 아니요
      Plan:
        행동: ASK_AFTER_UNKNOWN
        대상:
        - Q7.수축기
        - Q7.이완기
  - input:
      발화: 몰라요
    expect:
      LoRA-A:
      - 대상: Q7.*
        의도: SAYS_UNKNOWN
      판정:
      - 대상: Q7.*
        상태: UNKNOWN
      Plan:
        행동: ASK_NEXT
        대상:
        - Q8
        건너뜀추가:
        - 문항: Q7
          사유: UNKNOWN_ACCEPTED
  왜: 'B7·B8 한 발화의 거절과 모름을 모두 센다: 기대값이 판정 Q6.여부 REJECTED, Q7.* UNKNOWN; 저장 Q6.여부 RECORD_REFUSAL, Q7.수축기 RECORD_UNKNOWN,
    Q7.이완기 RECORD_UNKNOWN; 행동 ASK_AFTER_REFUSAL Q6.여부 → 판정 Q6.여부 ANSWERED; 저장 Q6.여부 FIRST_WRITE; 행동 ASK_AFTER_UNKNOWN
    Q7.수축기, Q7.이완기 → 판정 Q7.* UNKNOWN; 행동 ASK_NEXT Q8이 되는지 확인한다. 이 상황을 다루는 이유: 모른다는 답은 흔하고 빈 답과 다르게 다뤄야 한다. / 민감한
    문항은 답을 거절할 수 있다. 기대값을 정하는 규칙: 6절 1; 8-1 규칙 11·17; 8-2 4.'
  비고: '고침: 1단계는 거절 슬롯 Q6.여부, 2단계는 모름 슬롯 Q7의 두 칸이다.'
