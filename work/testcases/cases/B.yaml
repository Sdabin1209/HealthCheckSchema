cases:
- id: B1
  상황:
  - B1
  설명: B1 묻는 것에 답함
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q3b
  input:
    발화: 일주일에 두 번, 소주 한 병씩요
  expect:
    LoRA-A:
    - 대상: Q3b.빈도
      값: 일주일에 두 번
      의도: ANSWERED_INTENT
    - 대상: Q3b.종류
      값: 소주
      의도: ANSWERED_INTENT
    - 대상: Q3b.1회양
      값: 한 병
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q3b.빈도
      상태: ANSWERED
      이번값: 주 2회
    - 대상: Q3b.종류
      상태: ANSWERED
      이번값: 소주
    - 대상: Q3b.1회양
      상태: ANSWERED
      이번값: 1병
    저장:
    - 슬롯: Q3b.빈도
      동작: FIRST_WRITE
      값: 주 2회
    - 슬롯: Q3b.종류
      동작: FIRST_WRITE
      값: 소주
    - 슬롯: Q3b.1회양
      동작: FIRST_WRITE
      값: 1병
    Plan:
      행동: ASK_NEXT
      대상:
      - Q4
    LangGraph:
      대화로그:
        입력:
          종류: UTTERANCE
          발화: 있음
          개입결정: 없음
        처리: UTTERANCE
        턴결과: 확정
        LoRA-A출력: 있음
        정규화출력: 있음
        판정출력: 있음
        저장출력: 있음
        응답지시: 있음
        흐름: CONTINUE
        진행기록갱신: 있음
        직원알림: 없음
        응답문장: 있음
        직원알림전달: 해당 없음
        턴실패신호: 없음
        개입결정결과: 없음
  왜: 'B1 묻는 것에 답함: 기대값이 판정 Q3b.빈도 ANSWERED, Q3b.종류 ANSWERED, Q3b.1회양 ANSWERED; 저장 Q3b.빈도 FIRST_WRITE, Q3b.종류 FIRST_WRITE,
    Q3b.1회양 FIRST_WRITE; 행동 ASK_NEXT Q4이 되는지 확인한다. 이 상황을 다루는 이유: 문진의 기본 경로다. 기대값을 정하는 규칙: 5절 1; 6절 1; 7절 1; 8-1
    규칙 17.'
- id: B2
  상황:
  - B2
  설명: B2 일부만 답함
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
    직전:
      행동: ASK_NEXT
      대상:
      - Q3b
  input:
    발화: 소주 마셔요
  expect:
    LoRA-A:
    - 대상: Q3b.종류
      값: 소주
      의도: ANSWERED_INTENT
    정규화:
      빠진필수슬롯:
      - Q3b.빈도
      - Q3b.1회양
    판정:
    - 대상: Q3b.종류
      상태: ANSWERED
      이번값: 소주
    - 대상: Q3b.빈도
      상태: MISSING
      사유:
      - 필수 슬롯 누락
    - 대상: Q3b.1회양
      상태: MISSING
      사유:
      - 필수 슬롯 누락
    저장:
    - 슬롯: Q3b.종류
      동작: FIRST_WRITE
      값: 소주
    Plan:
      행동: ASK_MISSING
      대상:
      - Q3b.빈도
      - Q3b.1회양
      말할값:
      - 슬롯: Q3b.종류
        값: 소주
        역할: 방금 저장
    문장재료:
      되묻기문장:
      - 슬롯: Q3b.빈도
        문장: 일주일이나 한 달에 몇 번 드시는지 말씀해 주세요.
      - 슬롯: Q3b.1회양
        문장: 한 번에 얼마나 드시는지 말씀해 주세요.
      문항문장: []
      거절시설명: []
      선택지: []
      안내문장: []
      고정문장: []
  왜: 'B2 일부만 답함: 기대값이 판정 Q3b.종류 ANSWERED, Q3b.빈도 MISSING, Q3b.1회양 MISSING; 저장 Q3b.종류 FIRST_WRITE; 행동 ASK_MISSING
    Q3b.빈도, Q3b.1회양이 되는지 확인한다. 이 상황을 다루는 이유: 사람은 여러 칸 중 일부만 답하곤 한다. 받은 것은 저장하고 빠진 것만 물어야 한다. 기대값을 정하는 규칙: NormalizerOutput.missing_required_slots;
    6절 1; 7절 1; 8-1 규칙 10; 8-2 11.'
- id: B3a
  상황:
  - B3
  설명: B3 애매(범위 밖)
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 서른 시간이요
  expect:
    LoRA-A:
    - 대상: Q5.시간
      값: 서른 시간
      의도: ANSWERED_INTENT
    정규화:
      항목별검사:
      - 문제:
        - 범위 밖
    판정:
    - 대상: Q5.시간
      상태: UNCLEAR
      사유:
      - 범위 밖
      이번에말한값: 서른 시간
    Plan:
      행동: ASK_CLARIFY
      대상:
      - Q5.시간
      되물을이유:
      - OUT_OF_RANGE
      말할값:
      - 슬롯: Q5.시간
        값: 서른 시간
        역할: 이번에 말한 값
  왜: 'B3 애매(범위 밖): 기대값이 판정 Q5.시간 UNCLEAR; 행동 ASK_CLARIFY Q5.시간이 되는지 확인한다. 이 상황을 다루는 이유: 단위 없이, 범위를 벗어나게, 범위 값으로
    답하는 일이 흔하다. 그대로 저장하면 틀린 값이 남는다. 기대값을 정하는 규칙: 5절 1; 6절 1; 8-1 규칙 9; 8-2 11.'
- id: B3b
  상황:
  - B3
  설명: B3 애매(단위 없음)
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
      Q3b.종류: 소주
      Q3b.1회양: 1병
    직전:
      행동: ASK_MISSING
      대상:
      - Q3b.빈도
  input:
    발화: 두 번이요
  expect:
    LoRA-A:
    - 대상: Q3b.빈도
      값: 두 번
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q3b.빈도
      상태: UNCLEAR
      사유:
      - 단위 없음
      이번에말한값: 두 번
    Plan:
      행동: ASK_CLARIFY
      대상:
      - Q3b.빈도
      되물을이유:
      - NO_UNIT
      말할값:
      - 슬롯: Q3b.빈도
        값: 두 번
        역할: 이번에 말한 값
  왜: 'B3 애매(단위 없음): 기대값이 판정 Q3b.빈도 UNCLEAR; 행동 ASK_CLARIFY Q3b.빈도이 되는지 확인한다. 이 상황을 다루는 이유: 단위 없이, 범위를 벗어나게, 범위 값으로
    답하는 일이 흔하다. 그대로 저장하면 틀린 값이 남는다. 기대값을 정하는 규칙: 5절 1; 6절 1; 8-1 규칙 9.'
- id: B4
  상황:
  - B4
  설명: B4 서로 안 맞는 답
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
    직전:
      행동: ASK_NEXT
      대상:
      - Q3a
  input:
    발화: 술 안 마셔요, 소주 두 병 정도?
  expect:
    LoRA-A:
    - 대상: Q3a.여부
      값: 안 마셔요
      의도: ANSWERED_INTENT
    - 대상: Q3b.종류
      값: 소주
      의도: ANSWERED_INTENT
    - 대상: Q3b.1회양
      값: 두 병
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q3a.여부
      상태: UNCLEAR
      사유:
      - 다른 답과 맞지 않음
      이번에말한값: 안 마셔요
      맞지않는슬롯:
      - Q3b.종류
      - Q3b.1회양
    - 대상: Q3b.종류
      상태: UNCLEAR
      사유:
      - 다른 답과 맞지 않음
      이번에말한값: 소주
      맞지않는슬롯:
      - Q3a.여부
    - 대상: Q3b.1회양
      상태: UNCLEAR
      사유:
      - 다른 답과 맞지 않음
      이번에말한값: 두 병
      맞지않는슬롯:
      - Q3a.여부
    Plan:
      행동: ASK_CLARIFY
      대상:
      - Q3a.여부
      - Q3b.종류
      - Q3b.1회양
      되물을이유:
      - MISMATCH
      말할값:
      - 슬롯: Q3a.여부
        값: 안 마셔요
        역할: 이번에 말한 값
      - 슬롯: Q3b.종류
        값: 소주
        역할: 이번에 말한 값
      - 슬롯: Q3b.1회양
        값: 두 병
        역할: 이번에 말한 값
  비고: Q3a가 정해지지 않았으므로 Q3b 빈도의 누락은 따지지 않는다(선행 조건이 정해진 뒤의 일).
  왜: 'B4 서로 안 맞는 답: 기대값이 판정 Q3a.여부 UNCLEAR, Q3b.종류 UNCLEAR, Q3b.1회양 UNCLEAR; 행동 ASK_CLARIFY Q3a.여부, Q3b.종류, Q3b.1회양이
    되는지 확인한다. 이 상황을 다루는 이유: 앞뒤가 맞지 않는 답을 둘 다 저장하면 결과가 모순된다. 기대값을 정하는 규칙: 5절 3·4; NormalizerOutput.missing_required_slots(다른
    답과 맞지 않음 문항 제외); 6절 1; 8-1 규칙 9(묶음).'
- id: B5
  상황:
  - B5
  설명: B5 앞 질문의 짧은 답
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 마심
      Q3b.종류: 소주
      Q3b.1회양: 1병
    직전:
      행동: ASK_CLARIFY
      대상:
      - Q3b.빈도
      말할값:
      - 슬롯: Q3b.빈도
        값: 두 번
        역할: 이번에 말한 값
  input:
    발화: 일주일에요
  expect:
    LoRA-A:
    - 대상: Q3b.빈도
      값: 일주일에 두 번
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q3b.빈도
      상태: ANSWERED
      이번값: 주 2회
    저장:
    - 슬롯: Q3b.빈도
      동작: FIRST_WRITE
      값: 주 2회
    Plan:
      행동: ASK_NEXT
      대상:
      - Q4
  왜: 'B5 앞 질문의 짧은 답: 기대값이 판정 Q3b.빈도 ANSWERED; 저장 Q3b.빈도 FIRST_WRITE; 행동 ASK_NEXT Q4이 되는지 확인한다. 이 상황을 다루는 이유: 되물은
    뒤의 짧은 답("일주일에요")은 앞서 한 말과 합쳐야 뜻이 된다. 기대값을 정하는 규칙: 4절 5; 6절 1; 7절 1; 8-1 규칙 17.'
- id: B6
  상황:
  - B6
  설명: B6 묻지 않은 문항까지 답함
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 일곱 시간 자고, 운동은 일주일에 세 번 해요
  expect:
    LoRA-A:
    - 대상: Q5.시간
      값: 일곱 시간
      의도: ANSWERED_INTENT
    - 대상: Q8.횟수
      값: 일주일에 세 번
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q5.시간
      상태: ANSWERED
      이번값: 7
    - 대상: Q8.횟수
      상태: ANSWERED
      이번값: 주 3회
    저장:
    - 슬롯: Q5.시간
      동작: FIRST_WRITE
      값: 7
    - 슬롯: Q8.횟수
      동작: FIRST_WRITE
      값: 주 3회
    Plan:
      행동: ASK_NEXT
      대상:
      - Q6
  왜: 'B6 묻지 않은 문항까지 답함: 기대값이 판정 Q5.시간 ANSWERED, Q8.횟수 ANSWERED; 저장 Q5.시간 FIRST_WRITE, Q8.횟수 FIRST_WRITE; 행동 ASK_NEXT
    Q6이 되는지 확인한다. 이 상황을 다루는 이유: 사람은 묻지 않은 것까지 한꺼번에 말한다. 버리면 나중에 또 물어야 한다. 기대값을 정하는 규칙: 6절 1; 7절 1; 8-1 규칙 17.'
- id: B7a
  상황:
  - B7
  설명: B7 모름(수용 시점 2인 문항의 첫 모름)
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
      Q5.시간: 7
      Q6.여부: 아니요
    직전:
      행동: ASK_NEXT
      대상:
      - Q7
  input:
    발화: 혈압은 잘 모르겠어요
  expect:
    LoRA-A:
    - 대상: Q7.*
      의도: SAYS_UNKNOWN
    판정:
    - 대상: Q7.*
      상태: UNKNOWN
    저장:
    - 슬롯: Q7.수축기
      동작: RECORD_UNKNOWN
    - 슬롯: Q7.이완기
      동작: RECORD_UNKNOWN
    Plan:
      행동: ASK_AFTER_UNKNOWN
      대상:
      - Q7.수축기
      - Q7.이완기
  왜: 'B7 모름(수용 시점 2인 문항의 첫 모름): 기대값이 판정 Q7.* UNKNOWN; 저장 Q7.수축기 RECORD_UNKNOWN, Q7.이완기 RECORD_UNKNOWN; 행동 ASK_AFTER_UNKNOWN
    Q7.수축기, Q7.이완기이 되는지 확인한다. 이 상황을 다루는 이유: 모른다는 답은 흔하고 빈 답과 다르게 다뤄야 한다. 기대값을 정하는 규칙: 6절 1·5; 7절 1·2; 8-1 규칙 11;
    8-2 4.'
  비고: '고침: 규칙 11의 대상은 모름 판정이 난 슬롯들이다. Q7은 두 칸 모두 모름이라 둘 다 적는다.'
- id: B7b
  상황:
  - B7
  설명: B7 모름(수용)
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
      Q5.시간: 7
      Q6.여부: 아니요
      Q7.수축기: 모름
      Q7.이완기: 모름
    직전:
      행동: ASK_AFTER_UNKNOWN
      대상:
      - Q7.수축기
      - Q7.이완기
    Plan기록:
      모름횟수:
        Q7: 1
  input:
    발화: 정말 몰라요
  expect:
    LoRA-A:
    - 대상: Q7.*
      의도: SAYS_UNKNOWN
    판정:
    - 대상: Q7.*
      상태: UNKNOWN
    저장: []
    Plan:
      행동: ASK_NEXT
      대상:
      - Q8
      건너뜀추가:
      - 문항: Q7
        사유: UNKNOWN_ACCEPTED
  왜: 'B7 모름(수용): 기대값이 판정 Q7.* UNKNOWN; 저장 없음; 행동 ASK_NEXT Q8이 되는지 확인한다. 이 상황을 다루는 이유: 모른다는 답은 흔하고 빈 답과 다르게 다뤄야 한다.
    기대값을 정하는 규칙: 6절 1; 7절 1(변경 없는 슬롯 안 냄); 8-1 규칙 11·17.'
  비고: '고침: given의 직전 지시도 같은 규칙을 따른다. Q7 두 칸 모두 모름이었다.'
- id: B8a
  상황:
  - B8
  설명: B8 거절(수용 시점 2인 문항의 첫 거절)
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
      Q3a.여부: 안 마심
      Q5.시간: 7
    직전:
      행동: ASK_NEXT
      대상:
      - Q6
  input:
    발화: 그건 말 안 할래요
