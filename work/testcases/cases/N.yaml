cases:
- id: N1a
  상황:
  - A2
  - K1
  설명: A2·K1 첫 입력이 인사
  given:
    세션: 없음
  input:
    발화: 안녕하세요
  expect:
    LangGraph:
      세션정보생성: true
    LoRA-A:
    - 의도: OUT_OF_SCOPE
    발화판정:
      결과: OUT_OF_SCOPE_ONLY
    Plan:
      행동: REDIRECT
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q1
  왜: 'A2·K1 첫 입력이 인사: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 사용자는 시작 버튼 없이 바로 답부터 말할 수 있다. 그 말을 버리면 다시 말하게 해야
    한다. / 인사·감사에는 짧게 받고 질문을 이어 가야 대화가 자연스럽다. 기대값을 정하는 규칙: 9-1절 처리 표; 8-1 규칙 13.'
- id: N1b
  상황:
  - A2
  - E3
  설명: A2·E3 첫 입력이 안내 요청
  given:
    세션: 없음
  input:
    발화: 이거 누가 봐요?
  expect:
    LoRA-A:
    - 의도: GUIDE_REQUEST
      안내항목: 개인정보
    Plan:
      행동: ASK_NEXT
      대상:
      - Q1
      알릴것:
      - GUIDE: 개인정보
  왜: 'A2·E3 첫 입력이 안내 요청: 기대값이 행동 ASK_NEXT Q1이 되는지 확인한다. 이 상황을 다루는 이유: 사용자는 시작 버튼 없이 바로 답부터 말할 수 있다. 그 말을 버리면 다시
    말하게 해야 한다. / 개인정보·의료 판단 질문에는 검토된 문장으로만 답해야 한다. 함께 한 답은 저장돼야 한다. 기대값을 정하는 규칙: 8-1 규칙 12.'
- id: N1c
  상황:
  - A2
  - I1
  설명: A2·I1 첫 입력을 알아듣지 못함
  given:
    세션: 없음
  input:
    발화: 어브브
  expect:
    LoRA-A:
    - 의도: UNRECOGNIZED
    Plan:
      행동: ASK_REPEAT
      되물을이유:
      - UNRECOGNIZED
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q1
  왜: 'A2·I1 첫 입력을 알아듣지 못함: 기대값이 행동 ASK_REPEAT이 되는지 확인한다. 이 상황을 다루는 이유: 사용자는 시작 버튼 없이 바로 답부터 말할 수 있다. 그 말을 버리면 다시
    말하게 해야 한다. / STT가 잘못 옮기거나 소리만 들린 경우 다시 말해 달라고 해야 한다. 기대값을 정하는 규칙: 8-1 규칙 14.'
- id: N2a
  상황:
  - C6
  설명: C6 선택지 둘인 문항의 정정 구체화에 "아니요"
  given:
    직전:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q3a.여부
    열린요청:
      정정요청:
      - 대상: Q3a.여부
  input:
    발화: 아니요
  expect:
    LoRA-A:
    - 대상: Q3a.여부
      값: 아니요
      의도: CORRECTION_MARKED
    판정:
    - 대상: Q3a.여부
      상태: CORRECTION
      이번값: 안 마심
    무효화대상문항:
    - Q3b
    - Q4
    저장:
    - 슬롯: Q3b.빈도
      동작: INVALIDATE
    - 슬롯: Q3b.종류
      동작: INVALIDATE
    - 슬롯: Q3b.1회양
      동작: INVALIDATE
    - 슬롯: Q4.여부
      동작: INVALIDATE
    - 슬롯: Q3a.여부
      동작: NEW_REVISION
      값: 안 마심
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q3a.여부
        이전: 마심
        값: 안 마심
  왜: 'C6 선택지 둘인 문항의 정정 구체화에 "아니요": 기대값이 판정 Q3a.여부 CORRECTION; 저장 Q3b.빈도 INVALIDATE, Q3b.종류 INVALIDATE, Q3b.1회양 INVALIDATE,
    Q4.여부 INVALIDATE, Q3a.여부 NEW_REVISION; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 고치겠다고만 하고 값을 말하지 않는 경우가 있다. 값을
    물어야 고칠 수 있다. 기대값을 정하는 규칙: 4절 3; 6절 1·6; 7절 1.'
- id: N2b
  상황:
  - B9
  설명: B9 선택지 둘인 문항 질문에 "네"
  given:
    기본: 없음
    답:
      Q1.상태: 안 피움
    직전:
      행동: ASK_NEXT
      대상:
      - Q3a
  input:
    발화: 네
  expect:
    LoRA-A:
    - 대상: Q3a.여부
      값: 네
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q3a.여부
      상태: ANSWERED
      이번값: 마심
    저장:
    - 슬롯: Q3a.여부
      동작: FIRST_WRITE
      값: 마심
    Plan:
      행동: ASK_NEXT
      대상:
      - Q3b
  왜: 'B9 선택지 둘인 문항 질문에 "네": 기대값이 판정 Q3a.여부 ANSWERED; 저장 Q3a.여부 FIRST_WRITE; 행동 ASK_NEXT Q3b이 되는지 확인한다. 이 상황을 다루는
    이유: 예/아니요 질문의 "네"는 확인이 아니라 답이다. 구분하지 못하면 답이 저장되지 않는다. 기대값을 정하는 규칙: 4절 3; 6절 1; 8-1 규칙 17.'
- id: N3a
  상황:
  - C4
  설명: C4 확인에 "네"와 기존 값이 함께
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
  input:
    발화: 네, 열 개요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 열 개
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q2.개비
      상태: ANSWERED
      이번값: 10
      확인대기처리: 버림
      대상확인대기ID:
      - X
    저장:
    - 슬롯: Q2.개비
      동작: DROP_PENDING
      확인대기ID: X
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - KEPT_PREVIOUS: null
        슬롯: Q2.개비
        값: 10
  왜: 'C4 확인에 "네"와 기존 값이 함께: 기대값이 판정 Q2.개비 ANSWERED; 저장 Q2.개비 DROP_PENDING; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유:
    확인을 물었으면 그 답으로 어느 값을 남길지 정해야 한다. 기대값을 정하는 규칙: 6절 1·3·4; 7절 1; 8-2 10.'
- id: N3b
  상황:
  - C4
  설명: C4 확인에 "아니요"와 확인 대기 값이 함께
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
  input:
    발화: 아니요, 스무 개요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 스무 개
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q2.개비
      상태: CORRECTION
      이번값: 20
      확인대기처리: 받아들임
      대상확인대기ID:
      - X
    저장:
    - 슬롯: Q2.개비
      동작: ACCEPT_PENDING
      확인대기ID: X
      값: 20
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q2.개비
        이전: 10
        값: 20
  왜: 'C4 확인에 "아니요"와 확인 대기 값이 함께: 기대값이 판정 Q2.개비 CORRECTION; 저장 Q2.개비 ACCEPT_PENDING; 행동 ASK_NEXT Q5이 되는지 확인한다. 이
    상황을 다루는 이유: 확인을 물었으면 그 답으로 어느 값을 남길지 정해야 한다. 기대값을 정하는 규칙: 6절 1·2; 7절 1; 8-2 10.'
- id: N4
  상황:
  - C6
  설명: C6 정정 구체화에 "네"와 값이 함께
  given:
    직전:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q2.개비
    열린요청:
      정정요청:
      - 대상: Q2.개비
  input:
    발화: 네, 스무 개요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 스무 개
      의도: CORRECTION_MARKED
    판정:
    - 대상: Q2.개비
      상태: CORRECTION
      이번값: 20
    저장:
    - 슬롯: Q2.개비
      동작: NEW_REVISION
      값: 20
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q2.개비
        이전: 10
        값: 20
  왜: 'C6 정정 구체화에 "네"와 값이 함께: 기대값이 판정 Q2.개비 CORRECTION; 저장 Q2.개비 NEW_REVISION; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는
    이유: 고치겠다고만 하고 값을 말하지 않는 경우가 있다. 값을 물어야 고칠 수 있다. 기대값을 정하는 규칙: 4절 2·4; 6절 1.'
- id: N5a
  상황:
  - C5
  설명: C5 무엇인지 모르는 정정 뒤 값을 말함
  given:
    직전:
      행동: ASK_CORRECTION_TARGET
      대상: []
    열린요청:
      정정요청:
      - 대상: 없음
  input:
    발화: 담배 스무 개요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 스무 개
      의도: CORRECTION_MARKED
    판정:
    - 대상: Q2.개비
      상태: CORRECTION
      이번값: 20
    저장:
    - 슬롯: Q2.개비
      동작: NEW_REVISION
      값: 20
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - CORRECTION_ACK: null
        슬롯: Q2.개비
        이전: 10
        값: 20
  왜: 'C5 무엇인지 모르는 정정 뒤 값을 말함: 기대값이 판정 Q2.개비 CORRECTION; 저장 Q2.개비 NEW_REVISION; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는
    이유: "아까 그거 틀렸어요"처럼 무엇을 고칠지 말하지 않는 경우가 있다. 버리면 고치려는 뜻이 사라진다. 기대값을 정하는 규칙: 4절 2; 6절 1; 8-2 7(대상 없는 정정 요청 뺌); 8-1
    규칙 17.'
- id: N5b
  상황:
  - C5
  설명: C5 무엇인지 모르는 정정 뒤 문항만 말함
  given:
    직전:
      행동: ASK_CORRECTION_TARGET
      대상: []
    열린요청:
      정정요청:
      - 대상: 없음
  input:
    발화: 흡연량이요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      의도: CORRECTION_MARKED
    발화판정:
      값없는정정요청:
      - 대상: Q2.개비
    Plan:
      행동: ASK_CORRECTION_TARGET
      대상:
      - Q2.개비
      말할값:
      - 슬롯: Q2.개비
        값: 10
        역할: 현재값
  왜: 'C5 무엇인지 모르는 정정 뒤 문항만 말함: 기대값이 행동 ASK_CORRECTION_TARGET Q2.개비이 되는지 확인한다. 이 상황을 다루는 이유: "아까 그거 틀렸어요"처럼 무엇을 고칠지
    말하지 않는 경우가 있다. 버리면 고치려는 뜻이 사라진다. 기대값을 정하는 규칙: 4절 2; 8-2 7(대상 없는 요청 뺌); 8-1 규칙 7(이번 턴 요청 먼저).'
  비고: '입력을 고침: 원래 발화 "담배요"는 Q1(이름 "흡연")과 Q2(이름 "흡연량") 어느 쪽도 가리킬 수 있다. 독립 검증자는 Q1.상태로, 기존 기대값은 Q2.개비로 읽었다. 문항 이름을
    그대로 써서 하나로 정한다.'
- id: N6
  상황:
  - C8
  설명: C8 확인 중 세 번째 값(상한에서)
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
    Plan기록:
      확인횟수:
        Q2.개비: 2
  input:
    발화: 열다섯 개요
  expect:
    LoRA-A:
    - 대상: Q2.개비
      값: 열다섯 개
      의도: ANSWERED_INTENT
    판정:
    - 대상: Q2.개비
      상태: CONFLICT
      이번값: 15
      확인대기처리: 새로 둠
    저장:
    - 슬롯: Q2.개비
      동작: SET_PENDING
      확인대기ID: Z
      값: 15
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - KEPT_PREVIOUS: null
        슬롯: Q2.개비
        값: 10
      확인중단추가:
      - Q2.개비
    뒤:
      확인대기:
        Q2.개비:
          ID: Z
          값: 15
  왜: 'C8 확인 중 세 번째 값(상한에서): 기대값이 판정 Q2.개비 CONFLICT; 저장 Q2.개비 SET_PENDING; 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유:
    확인에 계속 답하지 않으면 끝없이 묻게 된다. 풀리지 않은 답은 결과에 남겨 의료진이 본다. 기대값을 정하는 규칙: 8-1 규칙 8(확인 중단 추가); 8-1 규칙 15(확인 중단 슬롯 제외);
    8-1 규칙 17.'
- id: N7a
  상황:
  - D3
  - C3
  설명: D3·C3 확인 중에 "이따 할게요"
  given:
    확인대기:
      Q2.개비:
        ID: X
        값: 20
    직전:
      행동: ASK_CONFIRM
      대상:
      - Q2.개비
      대상확인대기ID: X
  input:
    발화: 이건 이따 할게요
  expect:
    LoRA-A:
    - 의도: PROGRESS_OP
      진행조작: LATER
    발화판정:
      결과: REQUEST_ONLY
      요청:
      - 종류: LATER
        대상문항: Q2
    Plan:
      행동: ASK_NEXT
      대상:
      - Q5
      알릴것:
      - DEFERRED: null
        문항: Q2
      열린요청:
        DEFERRED:
        - 종류: 확인 대기
          대상: Q2.개비
  왜: 'D3·C3 확인 중에 "이따 할게요": 기대값이 행동 ASK_NEXT Q5이 되는지 확인한다. 이 상황을 다루는 이유: 어떤 문항은 나중에 답하고 싶어 한다. 버리지 않고 마지막에 다시 물어야
    한다. / 표지 없이 다른 값을 말하면 잘못 들었을 수도 있다. 기대값을 정하는 규칙: 6절 7; 8-1 규칙 8(미룸 확인 대기); 8-1 규칙 17(규칙 7·8에서 옮긴 미룸은 다시 안 더함).'
- id: N7b
  상황:
  - D3
  - C6
