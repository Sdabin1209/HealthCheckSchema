      행동: ASK_REPEAT
      되물을이유:
      - UNRECOGNIZED
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
  왜: 'I1 알아들을 수 없는 말: 기대값이 행동 ASK_REPEAT이 되는지 확인한다. 이 상황을 다루는 이유: STT가 잘못 옮기거나 소리만 들린 경우 다시 말해 달라고 해야 한다. 기대값을 정하는
    규칙: 8-1 규칙 14.'
