cases:
- id: K1
  상황:
  - K1
  설명: K1 인사·감사
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 고마워요
  expect:
    LoRA-A:
    - 의도: OUT_OF_SCOPE
    발화판정:
      결과: OUT_OF_SCOPE_ONLY
    Plan:
      행동: REDIRECT
      기다리는답:
        행동: ASK_NEXT
        대상:
        - Q5
    LoRA-B조건:
    - 짧게 받아 준다
    - 대답할 수 없다는 말을 하지 않는다
    - 수면 질문을 한다
  왜: 'K1 인사·감사: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 인사·감사에는 짧게 받고 질문을 이어 가야 대화가 자연스럽다. 기대값을 정하는 규칙: 8-1 규칙
    13.'
- id: K2
  상황:
  - K2
  설명: K2 사과·사정
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 죄송해요, 제가 귀가 어두워서
  expect:
    LoRA-A:
    - 의도: OUT_OF_SCOPE
    Plan:
      행동: REDIRECT
    LoRA-B조건:
    - 괜찮다고 받아 준다
    - 질문을 다시 한다
  왜: 'K2 사과·사정: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 사과·사정에는 괜찮다고 받아 줘야 어르신이 편하게 답한다. 기대값을 정하는 규칙: 8-1 규칙 13.'
- id: K3
  상황:
  - K3
  설명: K3 맞장구·혼잣말
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 어디 보자…
  expect:
    LoRA-A:
    - 의도: OUT_OF_SCOPE
    Plan:
      행동: REDIRECT
  왜: 'K3 맞장구·혼잣말: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 맞장구·혼잣말은 답이 아니므로 질문을 이어 간다. 기대값을 정하는 규칙: 8-1 규칙 13.'
- id: K4
  상황:
  - K4
  설명: K4 답에 붙인 사연
  given:
    기본: 없음
    직전:
      행동: ASK_NEXT
      대상:
      - Q1
  input:
    발화: 담배는 끊었어요, 작년에 수술해서
  expect:
    LoRA-A:
    - 대상: Q1.상태
      값: 끊었어요
      의도: ANSWERED_INTENT
    - 의도: OUT_OF_SCOPE
    발화판정:
      결과: HAS_ANSWER
    판정:
    - 대상: Q1.상태
      상태: ANSWERED
      이번값: 끊음
    저장:
    - 슬롯: Q1.상태
      동작: FIRST_WRITE
      값: 끊음
    Plan:
      행동: ASK_NEXT
      대상:
      - Q3a
    LoRA-B조건:
    - 사연을 받아 준다
    - 수술을 저장된 값처럼 말하지 않는다
  왜: 'K4 답에 붙인 사연: 기대값이 판정 Q1.상태 ANSWERED; 저장 Q1.상태 FIRST_WRITE; 행동 ASK_NEXT Q3a이 되는지 확인한다. 이 상황을 다루는 이유: 답에 사연을
    붙여도 답은 저장되고, 사연은 저장된 값처럼 말하지 않아야 한다. 기대값을 정하는 규칙: 6절 1; 8-1 규칙 17.'
- id: K5
  상황:
  - K5
  설명: K5 감정 표현(위험 표현이 아님)
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 요즘 너무 힘들어요
  expect:
    LoRA-A:
    - 의도: OUT_OF_SCOPE
    발화판정:
      결과: OUT_OF_SCOPE_ONLY
      위험신호: 없음
    Plan:
      행동: REDIRECT
    LoRA-B조건:
    - 공감하는 말로 받는다
    - 상담·진단을 하지 않는다
  왜: 'K5 감정 표현(위험 표현이 아님): 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 힘들다는 말에는 공감하되 상담·진단을 하지 않는다. 위험 표현이면 G1이다.
    기대값을 정하는 규칙: 8-1 규칙 13.'
- id: K6
  상황:
  - K6
  설명: K6 옆 사람에게 한 말
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 엄마, 이거 뭐라고 해?
  expect:
    LoRA-A:
    - 의도: OUT_OF_SCOPE
    Plan:
      행동: REDIRECT
  왜: 'K6 옆 사람에게 한 말: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 옆 사람에게 한 말은 답이 아니므로 질문을 다시 천천히 한다. 기대값을 정하는 규칙: 8-1
    규칙 13.'
- id: K7
  상황:
  - K7
  설명: K7 문진에 대한 불평
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 질문이 왜 이렇게 많아
  expect:
    LoRA-A:
    - 의도: OUT_OF_SCOPE
    Plan:
      행동: REDIRECT
    LoRA-B조건:
    - 남은 문항 수를 지어내지 않는다
  왜: 'K7 문진에 대한 불평: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 불평에는 받아 주되 남은 수 같은 값을 지어내지 않는다. 기대값을 정하는 규칙: 8-1 규칙
    13.'
- id: K8
  상황:
  - K8
  설명: K8 자기가 앞서 한 답을 물음
  given:
    직전:
      행동: ASK_NEXT
      대상:
      - Q5
  input:
    발화: 제가 담배 몇 개라고 했죠?
  expect:
    LoRA-A:
    - 의도: OUT_OF_SCOPE
    Plan:
      행동: REDIRECT
    LoRA-B조건:
    - 10이라는 값을 말하지 않는다
    - 도와드리기 어렵다고 한다
  왜: 'K8 자기가 앞서 한 답을 물음: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 앞서 한 답을 읽어 주는 기능은 정하지 않았으므로(보류) 지어내지 않고 도와드리기
    어렵다고 한다. 기대값을 정하는 규칙: 8-1 규칙 13.'
- id: K9a
  상황:
  - K9
  설명: K9 문진에 없는 건강 정보
  given:
    직전:
      행동: ASK_NEXT
      대상:
