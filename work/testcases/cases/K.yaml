  왜: 'K9 문진에 없는 건강 정보: 기대값이 행동 REDIRECT이 되는지 확인한다. 이 상황을 다루는 이유: 문진에 없는 정보는 저장할 곳이 없다. 받아 주고 잇는다. 기대값을 정하는 규칙: 4절
    6; 8-1 규칙 13.'
