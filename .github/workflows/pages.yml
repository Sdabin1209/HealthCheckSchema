name: Schema viewer Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - name: Install schema dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify schema contracts and static examples
        run: python verify.py
      - name: Install viewer dependencies
        working-directory: presentation
        run: npm ci
      - name: Generate viewer data
        working-directory: presentation
        run: npm run data
      - name: Check Svelte
        working-directory: presentation
        run: npm run check
      - name: Test viewer data
        working-directory: presentation
        run: npm test
      - name: Build viewer
        working-directory: presentation
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Test built viewer in DOM emulator
        working-directory: presentation
        run: npm run test:dom
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: presentation/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
